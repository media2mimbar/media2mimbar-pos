<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikayat Merchandise — Prototype Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#FF6100; --accent-dark:#E5570A; --accent-bg:#FFF0E5; --accent-text:#E5570A;
    --sidebar-bg:#FF6100; --sidebar-text:#FFFFFF; --sidebar-text-mut:#FFD6BD;
    --bg:#F4F5F3; --card:#FFFFFF; --border:#E7E8E4; --border-strong:#D6D8D1;
    --text:#1E2321; --text-2:#5B615C; --text-mut:#93988F;
    --danger-bg:#FDECEA; --danger-text:#C0392B;
    --warn-bg:#FDF2DD; --warn-text:#B7791F;
    --success-bg:#E4F7EF; --success-text:#00734E;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); font-size:13px;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; font-size:13px; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:13px;}
  input[type="radio"],input[type="checkbox"]{accent-color:var(--accent); cursor:pointer;}

  .app{display:flex; flex-direction:column; height:100vh;}
  .topbar{display:flex; align-items:center; gap:16px; padding:0 18px; height:56px; background:#fff; border-bottom:1px solid var(--border); flex-shrink:0;}
  .brand{display:flex; flex-direction:column; line-height:1.15; color:var(--accent); font-size:13px;}
  .brand .l1{font-weight:500;}
  .brand .l2{font-weight:800; font-size:14px;}
  .topnav{display:flex; gap:4px; margin-left:200px;}
  .topnav .item{padding:7px 14px; border-radius:20px; color:var(--text-2); cursor:pointer; font-weight:500;}
  .topnav .item.active{background:var(--accent); color:#fff; font-weight:700;}
  .spacer{flex:1;}
  .user-box{display:flex; align-items:center; gap:8px;}
  .user-box .avatar{width:30px; height:30px; border-radius:50%; background:#EDEDED; color:#3a3a3a; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px;}
  .user-box .who{line-height:1.15;}
  .user-box .who .name{font-weight:600; color:var(--text); font-size:12.5px;}
  .user-box .who .sub{color:var(--text-mut); font-size:11px;}
  .user-box .kebab{color:var(--text-2); cursor:pointer; padding:4px;}

  .body{display:flex; flex:1; min-height:0;}

  /* ── SIDEBAR ───────────────────────────────────────────── */
  .sidebar{width:300px; background:var(--sidebar-bg); padding:12px 0; overflow-y:auto; flex-shrink:0;}

  .outlet-switch{position:relative; margin-bottom:14px; padding:0 14px;}
  .outlet-btn{display:flex; align-items:center; gap:10px; width:100%; padding:4px 2px; background:transparent; border:none; color:#fff; cursor:pointer;}
  .outlet-btn .icon{width:30px; height:30px; border-radius:7px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .outlet-btn .labels{text-align:left; flex:1;}
  .outlet-btn .labels .lbl{font-size:12.5px; color:var(--sidebar-text-mut); font-weight:500;}
  .outlet-btn .labels .name{font-size:14px; font-weight:700; color:#fff;}
  .outlet-btn .caret{color:#fff; font-size:20px;}
  .outlet-panel{position:absolute; top:110%; left:14px; width:270px; background:#fff; border:1px solid var(--border); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.18); padding:8px; z-index:50; display:none;}
  .outlet-panel.open{display:block;}
  .outlet-panel .search{width:100%; padding:7px 8px; border:1px solid var(--border-strong); border-radius:6px; margin-bottom:6px; background:var(--bg); color:var(--text);}
  .outlet-opt{display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; cursor:pointer; color:var(--text);}
  .outlet-opt:hover{background:var(--bg);}
  .outlet-opt .dot{width:14px; height:14px; border-radius:50%; border:1px solid var(--border-strong); flex-shrink:0; position:relative;}
  .outlet-opt.sel .dot{border-color:var(--accent);}
  .outlet-opt.sel .dot::after{content:''; position:absolute; inset:3px; border-radius:50%; background:var(--accent);}
  .outlet-add{padding:7px 8px; border-top:1px solid var(--border); margin-top:4px; color:var(--accent-text); font-weight:600; cursor:pointer;}

  /* Level 1 — nav group header (Inventori, Produk, dll) */
  .nav-group{margin-bottom:1px;}
  .nav-head{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px;
    cursor:pointer; color:#fff; font-weight:600; font-size:14px;
    position:relative;
  }
  .nav-head .nh-icon{width:28px; height:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .nav-head .nh-icon svg{width:28px; height:28px; display:block;}
  .nav-head .nh-icon.icon-inventori{width:33px; height:33px;}
  .nav-head .nh-icon.icon-inventori svg{width:33px; height:33px;}
  .nav-head .nh-icon.icon-produk{width:32px; height:32px;}
  .nav-head .nh-icon.icon-produk svg{width:32px; height:32px;}
  .nav-head .nh-icon.icon-pelanggan{width:34px; height:34px;}
  .nav-head .nh-icon.icon-pelanggan svg{width:34px; height:34px;}
  .nav-head .nh-icon.icon-promo{width:34px; height:34px;}
  .nav-head .nh-icon.icon-promo svg{width:34px; height:34px;}
  .nav-head .nh-label{flex:1;}
  .nav-head .chevron{font-size:16px; color:rgba(255,255,255,.7); transition:transform .15s;}
  .nav-head .chevron.open{transform:rotate(180deg);}
  .nav-head:hover{background:rgba(0,0,0,.1);}
  .nav-head.active{background:rgba(0,0,0,.18);}
  .nav-head.active::after{content:''; position:absolute; top:0; bottom:0; right:0; width:3px; background:#FFD400;}

  /* Level 2 — nav-child (Faktur Pembelian, Kelola Stok, dll) */
  .nav-children{padding-left:0; overflow:hidden;}
  .nav-child{
    display:flex; align-items:center;
    padding:9px 14px 9px 46px;
    margin:0;
    border-radius:0;
    color:rgba(255,255,255,.75);
    cursor:pointer; font-weight:500; font-size:13px;
    position:relative;
  }
  .nav-child:hover{background:rgba(0,0,0,.1); color:#fff;}
  .nav-child.active{background:rgba(0,0,0,.18); color:#fff; font-weight:600;}
  .nav-child.active::after{content:''; position:absolute; top:0; bottom:0; right:0; width:3px; background:#FFD400;}

  /* Level 2 parent (Kelola Stok — has chevron) */
  .nav-child-parent{
    display:flex; align-items:center;
    padding:9px 14px 9px 46px;
    margin:0; border-radius:0;
    color:rgba(255,255,255,.75);
    cursor:pointer; font-weight:500; font-size:13px;
    position:relative;
  }
  .nav-child-parent:hover{background:rgba(0,0,0,.1); color:#fff;}
  .nav-child-parent.active{background:rgba(0,0,0,.18); color:#fff; font-weight:600;}
  .nav-child-parent.active::after{content:''; position:absolute; top:0; bottom:0; right:0; width:3px; background:#FFD400;}
  .nav-child-parent .nc-label{flex:1;}
  .nav-child-parent .chevron.sub{font-size:13px; color:rgba(255,255,255,.6); transition:transform .15s; margin-left:auto;}
  .nav-child-parent .chevron.sub.open{transform:rotate(180deg);}

  /* Level 3 — nav-grandchild (Daftar Stok, Stok Opname, Stok Terbuang) */
  .nav-grandchildren{overflow:hidden;}
  .nav-grandchild{
    display:flex; align-items:center;
    padding:8px 14px 8px 58px;
    margin:0; border-radius:0;
    color:rgba(255,255,255,.65);
    cursor:pointer; font-weight:400; font-size:12.5px;
    position:relative;
  }
  .nav-grandchild:hover{background:rgba(0,0,0,.1); color:#fff;}
  .nav-grandchild.active{background:rgba(0,0,0,.18); color:#fff; font-weight:600;}
  .nav-grandchild.active::after{content:''; position:absolute; top:0; bottom:0; right:0; width:3px; background:#FFD400;}

  /* ── MAIN ──────────────────────────────────────────────── */
  .main{flex:1; overflow-y:auto; padding:20px;}
  .page-head{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .page-title{font-size:16px; font-weight:600; color:var(--text);}
  .page-sub{color:var(--text-mut); margin-bottom:14px;}

  .btn{padding:8px 14px; border:1px solid var(--border-strong); border-radius:20px; background:#fff; color:var(--text-2); font-weight:500;}
  .btn:hover{border-color:var(--accent); color:var(--accent-text);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
  .btn-primary:hover{background:var(--accent-dark); border-color:var(--accent-dark);}

  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:0 1px 2px rgba(20,30,25,.03);}
  .grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}

  .filter-row{display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .period-nav{display:flex; align-items:center; gap:2px; background:#fff; border:1px solid var(--border); border-radius:20px; padding:4px 6px;}
  .period-nav .nav-btn{width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-2); cursor:pointer;}
  .period-nav .nav-btn:hover{background:var(--bg); color:var(--accent-text);}
  .period-nav .label{padding:0 8px; font-weight:600; color:var(--text); min-width:130px; text-align:center; font-size:12.5px;}

  .widget-title{font-weight:700; font-size:12.5px; color:var(--text); margin-bottom:12px;}
  .stat-bars{display:flex; flex-direction:column; gap:14px;}
  .stat-bar-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px; font-size:12px;}
  .stat-bar-name{color:var(--text-2); font-weight:500;}
  .stat-bar-val{color:var(--text); font-weight:700; white-space:nowrap;}
  .metric-card{background:#fff; border:1px solid var(--border); border-radius:12px; padding:14px; box-shadow:0 1px 2px rgba(20,30,25,.03);}
  .metric-label{color:var(--text-mut); font-size:12px; margin-bottom:6px;}
  .metric-value{font-size:21px; font-weight:700; color:var(--text);}

  .summary-banner{background:var(--accent); border-radius:12px; padding:18px 20px; display:flex; align-items:center; gap:16px; margin-bottom:12px; flex-wrap:wrap;}
  .summary-total{color:#fff; min-width:220px; flex-shrink:0;}
  .summary-total .lbl{font-size:12.5px; opacity:.92;}
  .summary-total .val{font-size:30px; font-weight:800; margin:2px 0;}
  .summary-total .sub{font-size:11.5px; opacity:.85;}
  .summary-mini-wrap{display:flex; flex:0 1 790px; background:#fff; border-radius:10px; overflow:hidden; margin-left:auto;}
  .summary-mini{padding:11px 14px; flex:1; border-right:1px solid var(--border); min-width:0;}
  .summary-mini:last-child{border-right:none;}
  .summary-mini .lbl{font-size:10.5px; color:var(--text-mut); margin-bottom:4px; line-height:1.3;}
  .summary-mini .val{font-size:17px; font-weight:700; color:var(--text);}

  table{width:100%; border-collapse:collapse;}
  th{text-align:left; color:var(--text-mut); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.02em; padding:10px 12px; border-bottom:1px solid var(--border); background:#FAFAF8;}
  td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr.varian-row td{background:var(--bg); color:var(--text-2);}
  .badge{padding:3px 10px; border-radius:12px; font-weight:700; font-size:11px; display:inline-block;}
  .badge-success{background:var(--success-bg); color:var(--success-text);}
  .badge-warn{background:var(--warn-bg); color:var(--warn-text);}
  .badge-role{background:var(--accent-bg); color:var(--accent-text); margin-right:4px;}
  .chevron{display:inline-block; cursor:pointer; color:var(--text-mut);}

  .toolbar{display:flex; gap:8px; margin-bottom:12px; align-items:center;}
  .search-input{flex:1; padding:9px 12px; border:1px solid var(--border-strong); border-radius:20px;}
  .tabs{display:flex; gap:4px; margin-bottom:12px; background:#fff; border:1px solid var(--border); border-radius:20px; padding:4px; width:fit-content;}
  .tab{padding:7px 14px; border-radius:16px; color:var(--text-mut); cursor:pointer; font-weight:500;}
  .tab.active{background:var(--accent-bg); color:var(--accent-text); font-weight:700;}
  .tab-track{position:relative;}
  .tab-thumb{position:absolute; top:4px; bottom:4px; left:4px; width:0; border-radius:16px; background:var(--accent-bg); transition:left .22s cubic-bezier(.4,0,.2,1), width .22s cubic-bezier(.4,0,.2,1); z-index:0;}
  .tab-track .tab{position:relative; z-index:1; background:transparent; transition:color .15s;}
  .tab-track .tab.active{background:transparent; color:var(--accent-text); font-weight:700;}

  .form-section-title{color:var(--text-mut); font-weight:600; margin:18px 0 8px; text-transform:uppercase; font-size:11px; letter-spacing:.03em;}
  .form-section-title:first-child{margin-top:0;}
  .section-heading{color:var(--text); font-weight:700; font-size:15.5px; margin:0 0 18px;}
  .req{color:var(--danger-text);}
  .field{margin-bottom:10px;}
  .field label{display:block; margin-bottom:5px; color:var(--text-2); font-size:12px; font-weight:500;}
  .field input,.field select,.field textarea{width:100%; padding:9px 11px; border:1px solid var(--border-strong); border-radius:8px; background:#fff;}
  .field input[type="checkbox"],.field input[type="radio"]{width:14px; height:14px; flex:0 0 auto; padding:0; border:none; background:none;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg);}
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .toggle{width:32px; height:18px; border-radius:10px; background:var(--border-strong); position:relative; cursor:pointer; flex-shrink:0; transition:background .15s;}
  .toggle.on{background:var(--accent);}
  .toggle::after{content:''; position:absolute; width:14px; height:14px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .15s;}
  .toggle.on::after{left:16px;}
  .toggle-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .placeholder-box{padding:60px 20px; text-align:center; color:var(--text-mut); border:1px dashed var(--border-strong); border-radius:10px;}
  .form-actions{display:flex; gap:8px; margin-top:20px; padding-top:14px; border-top:1px solid var(--border);}
  .toast{position:fixed; bottom:20px; right:20px; background:var(--text); color:#fff; padding:10px 16px; border-radius:8px; font-weight:600; opacity:0; transform:translateY(8px); transition:all .25s; z-index:200;}
  .toast.show{opacity:1; transform:translateY(0);}

  .icon-btn{width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--text-mut); cursor:pointer; border:1px solid transparent;}
  .icon-btn:hover{border-color:var(--border-strong); color:var(--danger-text);}

  .chip-field{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 10px; border:1px solid var(--border-strong); border-radius:8px; min-height:42px;}
  .chip{display:flex; align-items:center; gap:6px; background:var(--accent-bg); color:var(--accent-text); padding:5px 8px 5px 12px; border-radius:16px; font-weight:600; font-size:12px;}
  .chip .chip-x{cursor:pointer; color:var(--accent-text); font-size:13px; line-height:1; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .chip-add-select{border:none; outline:none; color:var(--text-mut); font-size:12px; background:transparent; flex:1; min-width:120px;}
  .attr-pill{display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border-strong); color:var(--text-2); padding:5px 8px 5px 12px; border-radius:16px; font-weight:600; font-size:12px; margin:0 6px 6px 0;}
  .attr-pill .chip-x{cursor:pointer; font-size:13px; line-height:1; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-mut);}
  .attr-add-input{border:1px dashed var(--border-strong); border-radius:16px; padding:5px 12px; font-size:12px; width:140px;}
  .upload-box{border:1px dashed var(--border-strong); border-radius:10px; padding:22px; text-align:center; color:var(--text-mut); cursor:pointer;}
  .upload-box:hover{border-color:var(--accent);}
  .upload-box .up-icon{font-size:20px; margin-bottom:6px;}
  .upload-box .up-label{color:var(--accent-text); font-weight:600;}
  .row-4{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .link-btn{color:var(--accent-text); font-weight:600; cursor:pointer;}
  .checkbox-row{display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:12.5px; color:var(--text-2);}
  .help-icon{width:17px; height:17px; border-radius:50%; border:1px solid var(--border-strong); color:var(--text-mut); display:inline-flex; align-items:center; justify-content:center; font-size:10.5px; cursor:default;}
  .help-text{color:var(--text-mut); font-size:11.5px; margin:-2px 0 8px; font-style:italic;}
  .subfield-title{font-size:12px; font-weight:600; color:var(--text-2); margin:12px 0 6px;}

  .kebab-wrap{position:relative; display:inline-block;}
  .kebab-menu{position:absolute; right:0; top:110%; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 10px 24px rgba(0,0,0,.14); min-width:130px; padding:6px; z-index:60; display:none;}
  .kebab-menu.open{display:block;}
  .kebab-menu .mi{padding:8px 10px; border-radius:6px; cursor:pointer; color:var(--text);}
  .kebab-menu .mi:hover{background:var(--bg);}
  .kebab-menu .mi.danger{color:var(--danger-text);}

  /* ── Date-range calendar dropdown (filter Periode) ── */
  .cal-dropdown{position:absolute; left:0; top:110%; display:flex; background:#fff; border:1px solid var(--border); border-radius:10px; box-shadow:0 14px 30px rgba(0,0,0,.16); z-index:70; overflow:hidden;}
  .cal-presets{width:150px; flex-shrink:0; border-right:1px solid var(--border); padding:8px; display:flex; flex-direction:column;}
  .cal-preset-item{padding:8px 10px; border-radius:6px; cursor:pointer; font-size:12.5px; color:var(--text-2); white-space:nowrap;}
  .cal-preset-item:hover{background:var(--bg); color:var(--text);}
  .cal-body{width:520px; display:flex; flex-direction:column;}
  .cal-nav{display:flex; align-items:center; padding:10px 16px 0;}
  .cal-nav-btn{cursor:pointer; font-size:16px; font-weight:700; color:var(--text-2); padding:2px 8px; border-radius:6px;}
  .cal-nav-btn:hover{background:var(--bg);}
  .cal-months{display:flex; gap:18px; padding:8px 16px;}
  .cal-month{flex:1; min-width:0;}
  .cal-month-title{text-align:center; font-weight:700; font-size:12.5px; margin-bottom:8px;}
  .cal-dow{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10.5px; color:var(--text-mut); margin-bottom:4px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); row-gap:2px;}
  .cal-day{display:flex; align-items:center; justify-content:center; height:26px; font-size:11.5px; color:var(--text); cursor:pointer; border-radius:6px;}
  .cal-day.out{color:var(--text-mut); opacity:.45;}
  .cal-day:hover{background:var(--accent-bg);}
  .cal-day.in-range{background:var(--accent-bg); border-radius:0;}
  .cal-day.sel-start,.cal-day.sel-end{background:var(--accent); color:#fff; font-weight:700;}
  .cal-footer{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px; border-top:1px solid var(--border);}
  .cal-range-label{font-size:11.5px; color:var(--text-2);}

  .pagination{display:flex; align-items:center; gap:12px; margin-top:12px; color:var(--text-2);}
  .pagination select{padding:6px 8px; border:1px solid var(--border-strong); border-radius:6px; background:#fff;}
  .pagination .info{color:var(--text-mut);}
  .pagination .pages{display:flex; gap:4px; margin-left:auto;}
  .pagination .pg-btn{padding:6px 10px; border:1px solid var(--border-strong); border-radius:6px; color:var(--text-2); cursor:pointer; background:#fff;}
  .pagination .pg-btn.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
  .pagination .pg-btn.disabled{opacity:.4; cursor:default;}

  .overlay{position:fixed; inset:0; background:rgba(20,25,20,.42); z-index:100; display:none; align-items:stretch; justify-content:flex-end;}
  .overlay.open{display:flex;}
  .overlay.center{align-items:center; justify-content:center;}
  #confirmModalRoot{z-index:150;}
  .slideover-head{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--border); flex-shrink:0;}
  .slideover-head .title{font-size:15px; font-weight:700;}
  .slideover-head .close{cursor:pointer; color:var(--text-mut); font-size:15px; padding:4px;}
  .slideover-foot{display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--border); justify-content:flex-end; flex-shrink:0;}
  .btn-text{background:transparent; border:1px solid transparent; color:var(--accent-text); font-weight:600; padding:8px 6px;}
  .btn-text:hover{text-decoration:underline; color:var(--accent-dark);}

  /* ── PROMO MODAL (Tambah/Ubah Promosi) ───────────────────── */
  .confirm-box.promo-modal{width:660px; max-width:94vw; max-height:88vh; display:flex; flex-direction:column;}
  .promo-modal .slideover-head{padding:14px 20px;}
  .promo-modal .slideover-foot{justify-content:space-between; padding:12px 20px;}
  .promo-modal-body{display:flex; flex:1; min-height:0;}
  .promo-modal-nav{width:172px; flex-shrink:0; border-right:1px solid var(--border); padding:22px 0; background:#FDFDFC;}
  .promo-modal-content{flex:1; min-width:0; overflow-y:auto; padding:20px 24px;}
  .promo-modal-content .section-heading{font-size:14.5px; margin-bottom:16px;}
  .promo-step{position:relative; display:flex; align-items:flex-start; gap:10px; padding:0 20px 26px; font-size:12.5px;}
  .promo-step:last-child{padding-bottom:0;}
  .promo-step::before{content:''; position:absolute; left:27px; top:18px; bottom:-2px; width:1px; background:var(--border-strong);}
  .promo-step:last-child::before{display:none;}
  .promo-step .dot{width:16px; height:16px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:9.5px; margin-top:1px; position:relative; z-index:1; background:#FDFDFC;}
  .promo-step .lbl{line-height:1.3;}

  .kategori-picker{border:1px solid var(--border-strong); border-radius:8px; overflow:hidden; background:#fff;}
  .kategori-picker .search-wrap{position:relative; border-bottom:1px solid var(--border);}
  .kategori-picker .search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-mut); pointer-events:none;}
  .kategori-picker .search{padding:9px 10px 9px 34px; border:none; width:100%; font-size:12.5px;}
  .kategori-picker .search:focus{outline:none;}
  .kategori-picker .list{max-height:220px; overflow-y:auto;}
  .kategori-opt{display:flex; align-items:center; gap:10px; padding:9px 12px; border-top:1px solid var(--border); cursor:pointer; font-size:12.5px; color:var(--text-2);}
  .kategori-opt:first-child{border-top:none;}
  .kategori-opt:hover{background:var(--bg);}
  .kategori-opt input[type="checkbox"]{width:15px; height:15px; accent-color:var(--accent); cursor:pointer; flex-shrink:0;}

  .confirm-box{width:360px; background:#fff; border-radius:12px; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.2);}
  .confirm-box h4{margin:0 0 6px; font-size:14px;}
  .confirm-box p{margin:0 0 16px; color:var(--text-2);}
  .confirm-actions{display:flex; gap:8px; justify-content:flex-end;}
  .btn-danger{background:var(--danger-text); border-color:var(--danger-text); color:#fff; font-weight:700;}
  .btn-danger:hover{background:#a52f22; border-color:#a52f22; color:#fff;}

  .body.form-mode .sidebar{display:none;}
  .body.form-mode{justify-content:center;}
  .body.form-mode .main{max-width:1000px; margin:0 auto; width:100%;}
  .body.form-mode .card{padding:28px 32px;}
  .body.form-mode .card > .field{display:grid; grid-template-columns:200px 1fr; column-gap:24px; align-items:start; margin-bottom:22px;}
  .body.form-mode .card > .field:last-of-type{margin-bottom:0;}
  .body.form-mode .card > .field label{padding-top:9px; margin-bottom:0; grid-column:1; font-size:13px; color:var(--text);}
  .body.form-mode .card > .field label .help-text{font-weight:400; font-style:normal; color:var(--text-mut); font-size:11.5px; margin:5px 0 0; line-height:1.5;}
  .body.form-mode .card > .field > *:not(label){grid-column:2;}
  .back-btn{display:inline-flex; align-items:center; gap:6px; color:var(--text-2); cursor:pointer; font-weight:600; font-size:13px; margin-bottom:14px;}
  .back-btn:hover{color:var(--accent-text);}
  .back-btn .arrow{font-size:16px; line-height:1;}

  .bar-row{display:flex; align-items:center; gap:8px; margin-bottom:9px; font-size:12px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-track{flex:1; height:8px; background:var(--bg); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:6px;}
  .bar-row.danger .bar-fill{background:var(--danger-text);}
  .bar-row.danger .val{color:var(--danger-text);}

  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3); border-radius:4px;}
  .main::-webkit-scrollbar-thumb{background:var(--border-strong);}
</style>

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  let html = `
    <div class="outlet-switch">
      <div class="outlet-btn" data-toggle-outlet>
        <span class="icon">🏬</span>
        <div class="labels"><div class="lbl">Outlet</div><div class="name">${state.outletMode==='all'?'Semua Outlet':state.outlet}</div></div>
        <span class="caret">▾</span>
      </div>
      <div class="outlet-panel ${state.outletPanelOpen?'open':''}">
        <input class="search" placeholder="Cari outlet...">
        <div class="outlet-opt ${state.outletMode==='all'?'sel':''}" data-set-outlet="__ALL__"><span class="dot"></span>Semua Outlet <span style="color:var(--text-mut);margin-left:auto;">2 outlet</span></div>
        ${OUTLETS.map(o=>`<div class="outlet-opt ${state.outletMode==='single'&&state.outlet===o?'sel':''}" data-set-outlet="${o}"><span class="dot"></span>${o}</div>`).join('')}
        <div class="outlet-add">+ Tambah Outlet</div>
      </div>
    </div>`;

  const isDescendantActive = item => item.children ? item.children.some(c=>c.id===state.view || isDescendantActive(c)) : false;

  const renderLevel2 = children => children.map(c=>{
    if(c.children){
      const open = state.openSubGroups[c.id];
      const isActive = isDescendantActive(c);
      return `
        <div class="nav-child-parent ${isActive?'active':''}" data-toggle-subgroup="${c.id}">
          <span class="nc-label">${c.label}</span>
          <span class="chevron sub ${open?'open':''}">▾</span>
        </div>
        <div class="nav-grandchildren" style="display:${open?'block':'none'}">
          ${c.children.map(g=>`<div class="nav-grandchild ${state.view===g.id?'active':''}" data-nav="${g.id}" data-ph="${g.placeholder?g.label:''}">${g.label}</div>`).join('')}
        </div>`;
    }
    return `<div class="nav-child ${state.view===c.id?'active':''}" data-nav="${c.id}" data-ph="${c.placeholder?c.label:''}">${c.label}</div>`;
  }).join('');

  NAV.forEach(item=>{
    if(item.children){
      const open = state.openGroups[item.id];
      const isActive = item.children ? isDescendantActive(item) : state.view===item.id;
      html += `<div class="nav-group">
        <div class="nav-head ${isActive?'active':''}" data-toggle-group="${item.id}">
          <span class="nh-icon icon-${item.icon}">${ICONS[item.icon]||''}</span>
          <span class="nh-label">${item.label}</span>
          <span class="chevron ${open?'open':''}">▾</span>
        </div>
        <div class="nav-children" style="display:${open?'block':'none'}">${renderLevel2(item.children)}</div>
      </div>`;
    } else {
      html += `<div class="nav-group"><div class="nav-head ${state.view===item.id?'active':''}" data-nav="${item.id}" data-ph="${item.placeholder?item.label:''}"><span class="nh-icon icon-${item.icon}">${ICONS[item.icon]||''}</span><span class="nh-label">${item.label}</span></div></div>`;
    }
  });
  sb.innerHTML = html;
}

const INDO_MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const INDO_MONTHS_SHORT=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function formatShortYear(d){ return `${d.getDate()} ${INDO_MONTHS_SHORT[d.getMonth()]} ${String(d.getFullYear()).slice(-2)}`; }
function formatTimestampID(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getDate()} ${INDO_MONTHS[d.getMonth()]} ${d.getFullYear()}, ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function getWeekRange(d){ const day=d.getDay()===0?7:d.getDay(); const s=new Date(d); s.setDate(d.getDate()-(day-1)); const e=new Date(s); e.setDate(s.getDate()+6); return `${formatShortYear(s)} - ${formatShortYear(e)}`; }
function getPeriodLabel(){ const {periode,refDate}=state.dashboard; if(periode==='Harian') return `${formatShortYear(refDate)} - ${formatShortYear(refDate)}`; if(periode==='Mingguan') return getWeekRange(refDate); return `${INDO_MONTHS[refDate.getMonth()]} ${refDate.getFullYear()}`; }
function shiftPeriod(dir){ const d=new Date(state.dashboard.refDate); if(state.dashboard.periode==='Harian') d.setDate(d.getDate()+dir); else if(state.dashboard.periode==='Mingguan') d.setDate(d.getDate()+dir*7); else d.setMonth(d.getMonth()+dir); state.dashboard.refDate=d; }

function statBarsHTML(items,opts){
  opts=opts||{}; if(!items.length) return '';
  const key=opts.valueKey||'persen';
  const max=Math.max(...items.map(it=>Math.abs(it[key])));
  return `<div class="stat-bars">${items.map(it=>{ const raw=it[key]; const pct=max?Math.round((Math.abs(raw)/max)*100):0; const valLabel=opts.valueFmt?opts.valueFmt(raw):`${raw}%`; return `<div class="bar-row ${opts.danger?'danger':''}" style="display:block;"><div class="stat-bar-top"><span class="stat-bar-name">${it.nama}</span><span class="stat-bar-val">${valLabel}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></div>`; }).join('')}</div>`;
}

/* ── Date-range picker (dipakai filter periode Daftar Stok) ── */
const ID_MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const ID_DOW=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const STOK_TODAY=new Date(2026,7,11);
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function dateFromYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDateShortID(s){ const d=dateFromYmd(s); return `${d.getDate()} ${ID_MONTHS[d.getMonth()].slice(0,3)} ${String(d.getFullYear()).slice(2)}`; }
function fmtDateFullID(s){ const d=dateFromYmd(s); return `${d.getDate()} ${ID_MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfWeek(d){ const r=new Date(d); const dow=(r.getDay()+6)%7; r.setDate(r.getDate()-dow); return r; } /* Senin=awal minggu */
function startOfMonth(d){ return new Date(d.getFullYear(),d.getMonth(),1); }
function endOfMonth(d){ return new Date(d.getFullYear(),d.getMonth()+1,0); }
const STOK_PERIOD_PRESETS=[
  {key:'hari-ini', label:'Hari Ini', fn:()=>[STOK_TODAY,STOK_TODAY]},
  {key:'kemarin', label:'Kemarin', fn:()=>{const y=addDays(STOK_TODAY,-1); return [y,y];}},
  {key:'7hari', label:'7 Hari Terakhir', fn:()=>[addDays(STOK_TODAY,-6),STOK_TODAY]},
  {key:'minggu-ini', label:'Minggu Ini', fn:()=>[startOfWeek(STOK_TODAY),STOK_TODAY]},
  {key:'minggu-lalu', label:'Minggu Lalu', fn:()=>{const s=addDays(startOfWeek(STOK_TODAY),-7); return [s,addDays(s,6)];}},
  {key:'30hari', label:'30 Hari Terakhir', fn:()=>[addDays(STOK_TODAY,-29),STOK_TODAY]},
  {key:'bulan-ini', label:'Bulan Ini', fn:()=>[startOfMonth(STOK_TODAY),STOK_TODAY]},
  {key:'bulan-lalu', label:'Bulan Lalu', fn:()=>{const s=new Date(STOK_TODAY.getFullYear(),STOK_TODAY.getMonth()-1,1); return [s,endOfMonth(s)];}},
];
function monthGridHTML(y,m,tempStart,tempEnd){
  const first=new Date(y,m,1); const leading=(first.getDay()+6)%7; const total=endOfMonth(first).getDate();
  const cells=[];
  for(let i=0;i<leading;i++){ const d=addDays(first,-(leading-i)); cells.push({d,out:true}); }
  for(let day=1;day<=total;day++){ cells.push({d:new Date(y,m,day),out:false}); }
  while(cells.length%7!==0 || cells.length<42){ const d=addDays(cells[cells.length-1].d,1); cells.push({d,out:true}); if(cells.length>=42) break; }
  const ts=tempStart?dateFromYmd(tempStart).getTime():null, te=tempEnd?dateFromYmd(tempEnd).getTime():null;
  const rows=[]; for(let r=0;r<cells.length/7;r++){ rows.push(cells.slice(r*7,r*7+7)); }
  return `<div class="cal-month">
    <div class="cal-month-title">${ID_MONTHS[m]} ${y}</div>
    <div class="cal-dow">${ID_DOW.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${cells.map(c=>{
      const t=c.d.getTime(); const val=ymd(c.d);
      let cls='cal-day'; if(c.out) cls+=' out';
      if(ts!==null && t===ts) cls+=' sel-start'; if(te!==null && t===te) cls+=' sel-end';
      if(ts!==null && te!==null && t>ts && t<te) cls+=' in-range';
      if(ts!==null && te===null && t===ts) cls+=' sel-start';
      return `<span class="${cls}" data-pick-stok-date="${val}">${c.d.getDate()}</span>`;
    }).join('')}</div>
  </div>`;
}
function stokPeriodeDropdownHTML(){
  const y=state.stokPeriodeBaseY, m=state.stokPeriodeBaseM;
  const ts=state.stokPeriodeTempStart, te=state.stokPeriodeTempEnd;
  let y2=y, m2=m+1; if(m2>11){ m2=0; y2=y+1; }
  const rangeLabel = ts&&te ? `${fmtDateFullID(ts)} - ${fmtDateFullID(te)}` : ts ? `${fmtDateFullID(ts)} - ...` : 'Pilih rentang tanggal';
  return `<div class="cal-dropdown">
    <div class="cal-presets">
      ${STOK_PERIOD_PRESETS.map(p=>`<div class="cal-preset-item" data-stok-preset="${p.key}">${p.label}</div>`).join('')}
    </div>
    <div class="cal-body">
      <div class="cal-nav">
        <span class="cal-nav-btn" data-stok-cal-nav="-1">‹</span>
        <div class="spacer"></div>
        <span class="cal-nav-btn" data-stok-cal-nav="1">›</span>
      </div>
      <div class="cal-months">
        ${monthGridHTML(y,m,ts,te)}
        ${monthGridHTML(y2,m2,ts,te)}
      </div>
      <div class="cal-footer">
        <span class="cal-range-label">${rangeLabel}</span>
        <div style="display:flex;gap:8px;">
          <button class="btn" data-stok-periode-cancel>Batal</button>
          <button class="btn btn-primary" data-stok-periode-apply>Proses</button>
        </div>
      </div>
    </div>
  </div>`;
}

function getFilteredStok(){ const q=state.stokSearch.trim().toLowerCase(); let items=state.stokItems.filter(it=>it.nama.toLowerCase().includes(q)||it.sku.toLowerCase().includes(q)); if(state.stokTab==='produk') items=items.filter(it=>it.jenis==='Produk'); if(state.stokTab==='bahan') items=items.filter(it=>it.jenis==='Bahan'); if(state.stokKategoriFilter) items=items.filter(it=>it.kategori===state.stokKategoriFilter); if(state.stokTampilkanMinim) items=items.filter(it=>it.akhir<=3); const min=state.stokJumlahMin!==''?Number(state.stokJumlahMin):null; const max=state.stokJumlahMax!==''?Number(state.stokJumlahMax):null; if(min!==null) items=items.filter(it=>it.akhir>=min); if(max!==null) items=items.filter(it=>it.akhir<=max); return items; }

function opnameItemsHTML(){
  const f = state.opnameForm;
  const items = f.items.filter(it => {
    const qOk = !f.cariBarang || it.nama.toLowerCase().includes(f.cariBarang.toLowerCase()) || it.sku.toLowerCase().includes(f.cariBarang.toLowerCase());
    const tabOk = f.filterTab==='semua' || it.jenis.toLowerCase()===f.filterTab;
    const katOk = !f.filterKategori || it.kategori===f.filterKategori;
    return qOk && tabOk && katOk;
  });

  if(!items.length) return `<tr><td colspan="6" style="text-align:center;color:var(--text-mut);padding:24px;">Tidak ada data yang ditampilkan</td></tr>`;

  return items.map((it,i) => {
    const selisih = (Number(it.stokAktual)||0) - it.stokSistem;
    const selisihColor = selisih > 0 ? 'var(--success-text)' : selisih < 0 ? 'var(--danger-text)' : 'var(--text-mut)';
    const colCount = f.isDraft!==false ? 7 : 6;
    return `<tr>
      <td style="padding:14px 12px 6px;font-size:12px;color:var(--text-2);border-bottom:none;">${it.sku}</td>
      <td style="padding:14px 12px 6px;border-bottom:none;">${it.nama}<div style="font-size:11px;color:var(--text-mut);">${it.kategori}</div></td>
      <td style="padding:14px 12px 6px;border-bottom:none;">${it.stokSistem} <span style="font-size:11px;color:var(--text-mut);">${it.satuan}</span></td>
      <td style="padding:14px 12px 6px;border-bottom:none;">
        ${f.isDraft===false
          ? `<span>${it.stokAktual||0}</span>`
          : `<div style="display:flex;align-items:center;gap:6px;">
              <input type="number" value="${it.stokAktual!==null?it.stokAktual:''}" placeholder="0"
                style="width:74px;padding:7px 9px;border:1px solid var(--border-strong);border-radius:6px;"
                data-opname-aktual="${i}">
              <span style="font-size:11px;color:var(--text-mut);">${it.satuan}</span>
            </div>`
        }
      </td>
      <td style="padding:14px 12px 6px;font-weight:600;color:${selisihColor};border-bottom:none;">${it.stokAktual!==null && it.stokAktual!=='' ? (selisih>0?'+':'')+selisih : '-'}</td>
      <td style="padding:14px 12px 6px;border-bottom:none;">${fmt(it.hargaModal)}</td>
      ${f.isDraft!==false ? `<td style="padding:14px 12px 6px;border-bottom:none;"><div class="icon-btn" data-del-opname-item="${i}">🗑</div></td>` : '<td style="border-bottom:none;"></td>'}
    </tr>
    ${f.isDraft!==false ? `<tr>
      <td style="padding:2px 12px 16px;font-size:12.5px;font-weight:600;color:var(--text-2);vertical-align:top;white-space:nowrap;">Catatan</td>
      <td colspan="${colCount-1}" style="padding:2px 12px 16px;">
        <textarea rows="1" placeholder="Contoh: Barang Hilang"
          style="width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:12.5px;color:var(--text);resize:vertical;min-height:38px;font-family:inherit;"
          data-opname-catatan="${i}">${it.catatan||''}</textarea>
      </td>
    </tr>` : `<tr><td colspan="${colCount}" style="padding:0;border-bottom:1px solid var(--border);"></td></tr>`}`;
  }).join('');
}

function nextReturNomor(){
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const base = `PR/${String(now.getFullYear()).slice(-2)}${pad(now.getMonth()+1)}${pad(now.getDate())}`;
  const count = state.returList.filter(r=>r.nomor.startsWith(base)).length + 1;
  return `${base}/${String(count).padStart(4,'0')}`;
}
function nextRekonNomor(){
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const base = `PF/${String(now.getFullYear()).slice(-2)}${pad(now.getMonth()+1)}${pad(now.getDate())}`;
  const count = state.rekonList.filter(r=>r.nomor.startsWith(base)).length + 1;
  return `${base}/${String(count).padStart(4,'0')}`;
}

const PROMO_DAYS = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];

function promoStatusBadge(s){
  const map = {
    'Aktif': ['var(--success-bg)','var(--success-text)'],
    'Tidak Aktif': ['var(--warn-bg)','var(--warn-text)'],
    'Kadaluarsa': ['var(--danger-bg)','var(--danger-text)'],
  };
  const [bg,color] = map[s] || ['var(--bg)','var(--text-mut)'];
  return `<span class="badge" style="background:${bg};color:${color};">${s}</span>`;
}

function productChipsHTML(f, key, rmAttr, addAttr){
  const options = state.products.map(p=>p.nama);
  const sel = f[key]||[];
  const chips = sel.map(o=>`<span class="chip">${o}<span class="chip-x" data-${rmAttr}="${o}">✕</span></span>`).join('');
  const rem = options.filter(o=>!sel.includes(o));
  const add = rem.length ? `<select class="chip-add-select" data-${addAttr}><option value="">+ Pilih Produk</option>${rem.map(o=>`<option value="${o}">${o}</option>`).join('')}</select>` : '';
  return `<div class="chip-field">${chips}${add}</div>`;
}

function getFilteredPromoProduk(){
  const q = state.promoProdukSearch.trim().toLowerCase();

    <div class="field"><label style="display:flex;align-items:center;gap:6px;font-weight:500;"><input type="checkbox" ${f.maksimalPotongan?'checked':''} data-toggle-promoTotal-maksimalPotongan> Maksimal Potongan</label>
      ${f.maksimalPotongan?`<input id="promoTotalMaksimalNominalInput" style="margin-top:6px;max-width:200px;" placeholder="Rp 10.000" value="${f.maksimalPotonganNominal}">`:''}
    </div>
    <div class="field"><label>Minimal Pembelian<span class="req">*</span></label><input id="promoTotalMinPembelianInput" placeholder="Rp 20.000" value="${f.minPembelian}"></div>`;
  } else if(f.jenisBonus==='rp'){
    html += `
    <div class="field"><label>Besaran Potongan (Rp)<span class="req">*</span></label><input id="promoTotalBesaranInput" placeholder="Contoh: Rp 5.000" value="${f.besaranPotongan}"></div>
    <div class="field"><label style="display:flex;align-items:center;gap:6px;font-weight:500;"><input type="checkbox" ${f.berlakuKelipatan?'checked':''} data-toggle-promoTotal-berlakuKelipatan> Berlaku Kelipatan</label></div>
    <div class="field"><label>Minimal Pembelian<span class="req">*</span></label><input id="promoTotalMinPembelianInput" placeholder="Rp 20.000" value="${f.minPembelian}"></div>`;
  } else if(f.jenisBonus==='bonus-produk'){
    html += `
    <div class="field"><label>Produk Bonus<span class="req">*</span></label>${productChipsHTML(f,'produkPromo','remove-promoTotal-produk','add-promoTotal-produk')}</div>
    <div class="field"><label style="display:flex;align-items:center;gap:6px;font-weight:500;"><input type="checkbox" ${f.berlakuKelipatan?'checked':''} data-toggle-promoTotal-berlakuKelipatan> Berlaku Kelipatan</label></div>

  }
  return html;
}

/* ── Modal "Tambah/Ubah Promosi" (dipakai oleh Promo Per Produk & Promo Per Total Pembelian) ── */
function renderPromoFormModal(){
  const root = document.getElementById('promoFormRoot');
  let f=null, prefix=null, kind=null;
  if(state.promoProdukForm){ f=state.promoProdukForm; prefix='promoProduk'; kind='produk'; }
  else if(state.promoTotalForm){ f=state.promoTotalForm; prefix='promoTotal'; kind='total'; }
  if(!f){ root.classList.remove('open','center'); root.innerHTML=''; return; }
  root.classList.add('open','center');
  const step = f.step||1;
  const title = f.mode==='edit' ? 'Ubah Promo' : 'Tambah Promosi';
  const closeAttr = kind==='produk' ? 'data-close-promoProduk-form' : 'data-close-promoTotal-form';
  const draftAttr = kind==='produk' ? 'data-save-draft-promoProduk' : 'data-save-draft-promoTotal';
  const nextAttr  = kind==='produk' ? 'data-promoProduk-next-1' : 'data-promoTotal-next-1';
  const backAttr  = kind==='produk' ? 'data-promoProduk-back-2' : 'data-promoTotal-back-2';
  const saveAttr  = kind==='produk' ? 'data-request-save-promoProduk' : 'data-request-save-promoTotal';
  const ketentuanHTML = kind==='produk' ? promoProdukKetentuanStepHTML(f) : promoTotalKetentuanStepHTML(f);
  root.innerHTML = `
    <div class="confirm-box promo-modal" style="padding:0;overflow:hidden;">
      <div class="slideover-head">
        <span class="close" ${closeAttr}>✕</span>
        <span class="title" style="flex:1;">${title}</span>
        <span class="brand" style="font-weight:800;color:var(--accent-text);font-size:13px;">Hikayat</span>
      </div>
      <div class="promo-modal-body">
        ${promoStepsNav(['Informasi Promo','Ketentuan Promo'], step-1)}
        <div class="promo-modal-content">
          <div class="section-heading">${step===1?'Informasi Promosi':'Ketentuan Promo'}</div>
          ${step===1 ? promoInformasiStepHTML(f,prefix) : ketentuanHTML}
        </div>
      </div>
      <div class="slideover-foot">
        <button class="btn btn-text" ${draftAttr}>Simpan Draft</button>
        <div style="display:flex;gap:8px;">
          ${step===1
            ? `<button class="btn" ${closeAttr}>Batal</button><button class="btn btn-primary" ${nextAttr}>Selanjutnya</button>`
            : `<button class="btn" ${backAttr}>Kembali</button><button class="btn btn-primary" ${saveAttr}>Simpan</button>`}
        </div>
      </div>
    </div>`;
}

  if(f.promoBerdasarkan==='pembelian') return `Min Pembelian : Rp ${f.minPembelian||0}`;
  if(f.promoBerdasarkan==='kuantitas') return `Min Kuantitas : ${f.minKuantitas||0}`;
  return '-';
}
function promoKriteriaLabelTotal(f){
  return `Min Pembelian : Rp ${f.minPembelian||0}`;
}
function promoBonusLabel(f){
  if(f.jenisBonus==='persen') return `${f.besaranPotongan||0} %`;
  if(f.jenisBonus==='rp') return `Rp ${f.besaranPotongan||0}`;
  if(f.jenisBonus==='bonus-produk') return 'Bonus Produk';

const _tabThumbPos = {};
function syncTabThumbs(){
  document.querySelectorAll('.tab-track').forEach(track=>{
    const gid = track.getAttribute('data-tab-group');
    const thumb = track.querySelector('.tab-thumb');
    const activeTab = track.querySelector('.tab.active');
    if(!thumb || !activeTab) return;
    const targetLeft = activeTab.offsetLeft;
    const targetWidth = activeTab.offsetWidth;
    const prev = _tabThumbPos[gid];
    if(prev){
      thumb.style.transition = 'none';
      thumb.style.left = prev.left + 'px';
      thumb.style.width = prev.width + 'px';
      void thumb.offsetWidth;
      thumb.style.transition = '';
      requestAnimationFrame(()=>{ thumb.style.left = targetLeft + 'px'; thumb.style.width = targetWidth + 'px'; });
    } else {
      thumb.style.transition = 'none';
      thumb.style.left = targetLeft + 'px';
      thumb.style.width = targetWidth + 'px';
      void thumb.offsetWidth;
      thumb.style.transition = '';
    }
    _tabThumbPos[gid] = {left:targetLeft, width:targetWidth};
  });
}

<script>
/* ════════════════════════════════════════════════════════════

(function(){

const PO_SALURAN = ['Shopee','Tokopedia','Lainnya'];

const PO_FIELDS = [

];

/* contoh file, meniru bentuk ekspor seller center (nama kolom asli bisa beda, makanya ada langkah cocokkan kolom) */
const PO_SAMPLES = {
  Shopee:{fileName:'contoh_pesanan_shopee.csv', rows:[

    ['2610010A1B2C','Selesai','2026-10-01 09:12','rizky.h','Topi Bordir','','TB-002','35.000','2','70.000','11.920'],

    ['2610020G5H6I','Batal','2026-10-02 19:05','andre.p','Tas Kanvas','','TK-003','65.000','1','65.000','0'],
    ['2610030J7K8L','Selesai','2026-10-03 08:30','nadia.m','Stiker Hikayat Pack','','STK-010','15.000','4','60.000','4.800'],
  ]},
  Tokopedia:{fileName:'contoh_pesanan_tokopedia.csv', rows:[
    ['Nomor Invoice','Status Terakhir','Tanggal Pembayaran','Nama Pembeli','Nama Produk','Nomor SKU','Jumlah Produk Dibeli','Harga Jual (IDR)','Biaya Layanan'],
    ['INV/20261001/MPL/3456789012','Pesanan Selesai','01-10-2026 10:21','Fajar','Kemeja Flanel - S Hitam','KF-001-S-HTM','1','69000','5520'],
    ['INV/20261002/MPL/3456789555','Pesanan Selesai','02-10-2026 16:02','Lia','Topi Bordir','TB-002','1','40000','6800'],
    ['INV/20261002/MPL/3456789555','Pesanan Selesai','02-10-2026 16:02','Lia','Kaos Polos','KP-004','2','45000','6800'],
    ['INV/20261004/MPL/3456790001','Dibatalkan Penjual','04-10-2026 11:45','Yusuf','Tas Kanvas','TK-003','1','65000','0'],
  ]},
};

/* ── registrasi ke struktur prototype ── */
ICONS.penjualan = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M6.5 8h2.6l2 10.2h10.2l1.9-7.2H10"/><circle cx="12.4" cy="21.6" r="1.4" fill="currentColor"/><circle cx="20" cy="21.6" r="1.4" fill="currentColor"/></svg>`;
const laporanIdx = NAV.findIndex(n=>n.id==='laporan');
NAV.splice(laporanIdx+1, 0, {id:'penjualan-online', label:'Penjualan Online', icon:'penjualan', children:[
  {id:'pesanan-online', label:'Daftar Pesanan'},
  {id:'riwayat-impor', label:'Riwayat Impor'},
]});
FORM_VIEWS['pesanan-online-form'] = 'pesanan-online';
state.openGroups['penjualan-online'] = false;

state.po = {
  orders:[
    {id:'po1', saluran:'Shopee', noPesanan:'2609280X9Y8Z', tanggal:'2026-09-28T13:05', pembeli:'hanif.r', status:'Selesai', potongan:8000, sumber:'Manual', batchId:null, moves:[], items:[{sku:'KP-004', nama:'Kaos Polos', qty:2, harga:45000}]},
    {id:'po2', saluran:'Tokopedia', noPesanan:'INV/20260929/MPL/3450001122', tanggal:'2026-09-29T20:14', pembeli:'Dewi', status:'Selesai', potongan:5520, sumber:'Manual', batchId:null, moves:[], items:[{sku:'KF-001-M-HTM', nama:'Kemeja Flanel M · Hitam', qty:1, harga:69000}]},
  ],
  batches:[], presets:{}, seq:3,
  search:'', saluran:'Semua', kebab:null,
  importer:null, form:null, modal:null,
};

/* ── util ── */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function parseNum(v){
  if(typeof v==='number') return v;
  let s = String(v||'').replace(/rp/ig,'').replace(/\s/g,'');
  if(!s) return NaN;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,'').replace(',', '.');
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g,'');
  else s = s.replace(',', '.');
  return Number(s);
}
function toIsoLocal(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function parseTanggal(v){
  if(v instanceof Date) return isNaN(v)?'':toIsoLocal(v);
  const s=String(v||'').trim(); if(!s) return '';
  let m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m) return toIsoLocal(new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0)));
  m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})(?:[ ,]+(\d{1,2})[:.](\d{2}))?/);
  if(m) return toIsoLocal(new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)));
  const d=new Date(s); return isNaN(d)?'':toIsoLocal(d);
}
function fmtTgl(iso){ if(!iso) return '-'; const [d,t]=iso.split('T'); const [y,mo,da]=d.split('-'); return `${+da} ${INDO_MONTHS_SHORT[+mo-1]} ${y}${t?`, ${t}`:''}`; }
function chanClass(c){ return c==='Shopee'?'shopee':c==='Tokopedia'?'tokopedia':''; }
function chanBadge(c){ return `<span class="po-chan ${chanClass(c)}">${esc(c)}</span>`; }
function orderGross(o){ return o.items.reduce((s,i)=>s+i.qty*i.harga,0); }
function orderNet(o){ return orderGross(o)-(Number(o.potongan)||0); }
function nextId(){ return 'po'+(state.po.seq++); }

/* katalog SKU dari daftar produk (termasuk varian) */
function catalog(){
  const out=[];
  state.products.forEach(p=>{
    if(p.varian&&p.varian.length) p.varian.forEach(v=>out.push({sku:v.sku, nama:`${p.nama} ${v.nama}`, harga:v.jual||0, parent:p.sku}));
    else out.push({sku:p.sku, nama:p.nama, harga:p.jual||0, parent:p.sku});
  });
  return out;
}
function findCat(sku){ return catalog().find(c=>norm(c.sku)===norm(sku)); }
function hargaSaluran(saluran, sku){
  const ch = state.marketplaceChannels.find(m=>m.nama===saluran);
  const p = ch && ch.produk.find(x=>x.sku===sku);
  if(p) return Number(p.hargaJual)||0;
  const c = findCat(sku); return c?c.harga:0;
}
function komisiSaluran(saluran){
  const ch = state.marketplaceChannels.find(m=>m.nama===saluran);
  return ch&&ch.komisiAktif&&Number(ch.komisiPersen)?Number(ch.komisiPersen):0;
}
function isDuplicate(saluran, no, exceptId){
  return state.po.orders.some(o=>o.saluran===saluran && norm(o.noPesanan)===norm(no) && o.id!==exceptId);
}

/* ── stok: kurangi saat pesanan masuk, kembalikan saat dihapus/dibatalkan ── */
function stokItemFor(sku){
  let it = state.stokItems.find(s=>norm(s.sku)===norm(sku));
  if(!it){ const c=findCat(sku); if(c) it=state.stokItems.find(s=>s.sku===c.parent); }
  return it;
}
function applyStock(order, outlet){
  order.moves=[];
  order.items.forEach(i=>{
    const it=stokItemFor(i.sku); if(!it) return;
    it.terjual+=i.qty; it.akhir-=i.qty;
    const po=(it.perOutlet||[]).find(x=>x.outlet===outlet); if(po){ po.terjual+=i.qty; po.akhir-=i.qty; }
    order.moves.push({sku:it.sku, outlet, qty:i.qty});
  });
}
function revertStock(order){
  (order.moves||[]).forEach(m=>{
    const it=state.stokItems.find(s=>s.sku===m.sku); if(!it) return;
    it.terjual-=m.qty; it.akhir+=m.qty;
    const po=(it.perOutlet||[]).find(x=>x.outlet===m.outlet); if(po){ po.terjual-=m.qty; po.akhir+=m.qty; }
  });
  order.moves=[];
}

/* ── baca file CSV / Excel ── */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function readFile(file){
  return new Promise((resolve,reject)=>{
    const isCsv=/\.csv$/i.test(file.name);
    const r=new FileReader();
    r.onerror=()=>reject(new Error('Berkas tidak bisa dibaca'));
    if(isCsv){ r.onload=()=>resolve(parseCSV(r.result)); r.readAsText(file); return; }
    if(!window.XLSX){ reject(new Error('Pembaca Excel belum termuat. Simpan file sebagai CSV lalu coba lagi.')); return; }
    r.onload=()=>{ try{
      const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      resolve(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}));
    }catch(err){ reject(new Error('Format file tidak dikenali')); } };
    r.readAsArrayBuffer(file);
  });
}
function cleanRows(rows){
  rows = rows.map(r=>r.map(c=>String(c==null?'':c).trim())).filter(r=>r.some(c=>c!==''));
  if(!rows.length) return {headers:[], data:[]};
  return {headers:rows[0], data:rows.slice(1)};
}
function guessMapping(headers, saluran){
  const preset=state.po.presets[saluran];
  if(preset && Object.values(preset).every(h=>!h||headers.includes(h))) return {...preset, _fromPreset:true};
  /* 1) judul kolom yang sama persis, 2) kolom wajib yang mengandung kata kunci, 3) kolom opsional */
  const map={}, used=new Set(), H=headers.map(norm);
  PO_FIELDS.forEach(f=>map[f.k]='');
  const pass=(fields, match)=>fields.forEach(f=>{ if(map[f.k]) return;
    for(const s of f.syn){ const hit=H.findIndex((h,i)=>!used.has(i)&&match(h,s)); if(hit>-1){ used.add(hit); map[f.k]=headers[hit]; return; } } });
  pass(PO_FIELDS, (h,s)=>h===s);
  pass(PO_FIELDS.filter(f=>f.req), (h,s)=>h.includes(s));
  pass(PO_FIELDS.filter(f=>!f.req), (h,s)=>h.includes(s));
  return map;
}

/* ── olah baris jadi kandidat pesanan (langkah 3) ── */
function buildPreview(){
  const im=state.po.importer, map=im.mapping, H=im.headers;
  const col=k=>map[k]?H.indexOf(map[k]):-1;
  const get=(row,k)=>{ const i=col(k); return i>-1?(row[i]||''):''; };
  const groups=new Map();
  im.data.forEach((row,ri)=>{
    const no=get(row,'noPesanan');
    const line={rowNo:ri+2, sku:get(row,'sku'), nama:[get(row,'nama'),get(row,'variasi')].filter(Boolean).join(' · '), qty:parseNum(get(row,'jumlah')), harga:parseNum(get(row,'harga')), errors:[]};
    const sub=parseNum(get(row,'subtotal'));
    if(isNaN(line.harga) && !isNaN(sub) && line.qty>0) line.harga=Math.round(sub/line.qty);
    if(!no) line.errors.push('No. pesanan kosong');
    if(!line.sku) line.errors.push('SKU kosong');
    if(!(line.qty>0)) line.errors.push('Jumlah tidak valid');
    if(isNaN(line.harga)) line.errors.push('Harga tidak terbaca');
    const key=no||`__baris${ri}`;
    if(!groups.has(key)) groups.set(key,{noPesanan:no, tanggalRaw:get(row,'tanggal'), tanggal:parseTanggal(get(row,'tanggal')), pembeli:get(row,'pembeli'), statusRaw:get(row,'status'), potongan:parseNum(get(row,'potongan'))||0, lines:[]});
    groups.get(key).lines.push(line);
  });
  const orders=[...groups.values()].map(g=>{
    g.batal=/batal|cancel|gagal|dikembalikan|refund/i.test(g.statusRaw);
    g.duplikat=!!g.noPesanan && isDuplicate(im.saluran, g.noPesanan);
    g.include = !!g.noPesanan && !!g.tanggal && !g.batal && !g.duplikat;
    return g;
  });
  const unknown=new Set();
  orders.filter(o=>o.include).forEach(o=>o.lines.forEach(l=>{ if(l.sku && !l.errors.length && !findCat(l.sku)) unknown.add(l.sku); }));
  im.orders=orders;
  im.unknown=[...unknown];
  im.skuMap = im.skuMap||{};
  im.unknown.forEach(s=>{ if(!(s in im.skuMap)) im.skuMap[s]=''; });
}
function resolvedLines(o){
  const im=state.po.importer;
  return o.lines.filter(l=>!l.errors.length).map(l=>{
    const c=findCat(l.sku) || (im.skuMap[l.sku] ? findCat(im.skuMap[l.sku]) : null);
    return c ? {sku:c.sku, nama:c.nama, qty:l.qty, harga:l.harga} : null;
  }).filter(Boolean);
}
function orderVerdict(o){
  if(!o.noPesanan) return {cls:'err', txt:'Tanpa no. pesanan'};
  if(!o.tanggal) return {cls:'err', txt:'Tanggal tidak terbaca'};
  if(o.duplikat) return {cls:'skip', txt:'Sudah pernah masuk'};
  if(o.batal) return {cls:'skip', txt:'Dibatalkan'};
  const ok=resolvedLines(o).length, all=o.lines.length;
  if(!ok) return {cls:'err', txt:o.lines.some(l=>l.errors.length)?'Tidak ada baris valid':'SKU belum dipasangkan'};
  if(ok<all) return {cls:'warn', txt:`${all-ok} baris dilewati`};
  return {cls:'ok', txt:'Siap'};
}
function importStats(){
  const im=state.po.importer; let siap=0, dup=0, batal=0, gagal=0;
  im.orders.forEach(o=>{
    if(o.duplikat) dup++; else if(o.batal) batal++;
    else if(!o.noPesanan || !o.tanggal || !resolvedLines(o).length) gagal++;
    if(o.include && resolvedLines(o).length) siap++;
  });
  return {siap,dup,batal,gagal};
}

/* ════════ VIEWS ════════ */
function filteredOrders(){
  const q=norm(state.po.search);
  return [...state.po.orders].sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).filter(o=>(state.po.saluran==='Semua'||o.saluran===state.po.saluran) &&
    (!q || norm(o.noPesanan).includes(q) || norm(o.pembeli).includes(q) || o.items.some(i=>norm(i.nama).includes(q)||norm(i.sku).includes(q))));

  const missing=PO_FIELDS.filter(f=>f.req&&!m[f.k]).map(f=>f.label);
  const noPrice=!m.harga&&!m.subtotal;
  return importShell(1, `
    <div class="po-src" style="margin-bottom:10px;">${m._fromPreset?`Memakai pengaturan kolom ${im.saluran} dari impor sebelumnya.`:`Sistem menebak kolom dari judulnya. Periksa sekali, nanti pengaturan ini dipakai lagi untuk file ${im.saluran} berikutnya.`}</div>

    ${missing.length||noPrice?`<div style="color:var(--danger-text);margin-top:8px;font-size:12px;">Belum dipilih: ${[...missing, ...(noPrice?['Harga Satuan atau Subtotal']:[])].join(', ')}</div>`:''}`,
    `<button class="btn" data-po-back1>Kembali</button><button class="btn btn-primary" data-po-step3 ${missing.length||noPrice?'disabled style="opacity:.5;"':''}>Lanjut</button>`);

function importStep3(){
  const im=state.po.importer, st=importStats(), cat=catalog();
  const rows=im.orders.map((o,i)=>{ const v=orderVerdict(o); const lines=resolvedLines(o);
    const can=o.noPesanan&&o.tanggal&&!o.duplikat&&!o.batal&&lines.length;
    return `<tr><td style="width:30px;"><input type="checkbox" ${o.include&&can?'checked':''} ${can?'':'disabled'} data-po-imp-toggle="${i}"></td>
      <td><b>${esc(o.noPesanan||'-')}</b><div class="po-src">${esc(o.tanggalRaw)}${o.statusRaw?` · ${esc(o.statusRaw)}`:''}</div></td>
      <td>${o.lines.map(l=>`<div>${esc(l.nama||l.sku)} <span class="po-mut">× ${isNaN(l.qty)?'?':l.qty}</span>${l.errors.length?` <span class="po-flag err">${esc(l.errors[0])}</span>`:''}</div>`).join('')}</td>
      <td class="po-num">${fmt(lines.reduce((s,l)=>s+l.qty*l.harga,0))}</td>
      <td><span class="po-flag ${v.cls}">${v.txt}</span></td></tr>`; }).join('');
  return importShell(2, `

      ${im.unknown.map(s=>`<div class="r"><code>${esc(s)}</code><select data-po-skumap="${esc(s)}"><option value="">Lewati</option>${cat.map(c=>`<option value="${esc(c.sku)}" ${im.skuMap[s]===c.sku?'selected':''}>${esc(c.nama)} (${esc(c.sku)})</option>`).join('')}</select></div>`).join('')}</div>`:''}
    <div class="po-scroll"><table><thead><tr><th></th><th>No. Pesanan</th><th>Produk</th><th class="po-num">Kotor</th><th>Keterangan</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="po-inline" style="margin-top:12px;"><label><input type="checkbox" id="poImpKurangiStok" ${im.kurangiStok?'checked':''}> Kurangi stok outlet</label>
      <select id="poImpOutlet" style="padding:7px 9px;border:1px solid var(--border-strong);border-radius:8px;">${OUTLETS.map(o=>`<option ${im.outlet===o?'selected':''}>${o}</option>`).join('')}</select></div>`,
    `<button class="btn" data-po-back2>Kembali</button><button class="btn btn-primary" data-po-do-import ${st.siap?'':'disabled style="opacity:.5;"'}>${st.siap?`Impor ${st.siap} Pesanan`:'Tidak ada pesanan baru'}</button>`);

function confirmHTML(title, text, okLabel, okAttr, danger){

function renderPoModal(){
  const P=state.po, im=P.importer, md=P.modal;
  if(!im && !md){ poRoot.classList.remove('open','center'); poRoot.innerHTML=''; return; }
  poRoot.classList.add('open','center');
  if(md){
    if(md.type==='detail'){ const o=P.orders.find(x=>x.id===md.id); poRoot.innerHTML=o?detailHTML(o):''; }
    else if(md.type==='save'){ const f=P.form; poRoot.innerHTML=confirmHTML(f.mode==='edit'?'Simpan Perubahan?':'Simpan Pesanan?', `Pesanan <b>${esc(f.noPesanan)}</b> dari ${f.saluran} akan ${f.mode==='edit'?'diperbarui':'dicatat'}${f.kurangiStok?` dan stok ${esc(f.outlet)} disesuaikan`:''}. Lanjutkan?`, 'Ya, Simpan', 'data-po-confirm-save'); }
    else if(md.type==='delete'){ const o=P.orders.find(x=>x.id===md.id); poRoot.innerHTML=confirmHTML('Hapus Pesanan?', `Pesanan <b>${esc(o.noPesanan)}</b> akan dihapus${o.moves&&o.moves.length?' dan stoknya dikembalikan':''}.`, 'Hapus', 'data-po-confirm-delete', true); }
    else if(md.type==='rollback'){ const b=P.batches.find(x=>x.id===md.id); poRoot.innerHTML=confirmHTML('Batalkan Impor?', `${b.masuk} pesanan dari <b>${esc(b.fileName)}</b> akan dihapus dan stoknya dikembalikan. Pesanan yang sudah kamu ubah manual ikut terhapus.`, 'Batalkan Impor', 'data-po-confirm-rollback', true); }
    return;
  }
  poRoot.innerHTML = im.step===1?importStep1():im.step===2?importStep2():importStep3();
}

renderMain = function(){
  const m=document.getElementById('main');
  if(state.view==='pesanan-online') m.innerHTML=viewPesananOnline();
  else if(state.view==='riwayat-impor') m.innerHTML=viewRiwayatImpor();
  else if(state.view==='pesanan-online-form') m.innerHTML=state.po.form?viewPesananForm():viewPesananOnline();
  else _renderMain();
};
const _render = render;
render = function(){ _render(); renderPoModal(); };

/* ════════ AKSI ════════ */
function openImporter(){ state.po.importer={step:1, saluran:'Shopee', fileName:'', headers:[], data:[], mapping:{}, error:'', kurangiStok:true, outlet:state.outlet}; renderPoModal(); }
function loadRows(rows, fileName){
  const im=state.po.importer, {headers,data}=cleanRows(rows);
  if(!headers.length||!data.length){ im.error='File kosong atau tidak punya baris data.'; im.data=[]; im.fileName=fileName; renderPoModal(); return; }
  Object.assign(im,{headers,data,fileName,error:'',skuMap:{}}); renderPoModal();
}
fileInput.addEventListener('change', async ()=>{
  const file=fileInput.files[0]; fileInput.value=''; if(!file||!state.po.importer) return;
  try{ loadRows(await readFile(file), file.name); }
  catch(err){ state.po.importer.error=err.message; renderPoModal(); }
});
function doImport(){
  const P=state.po, im=P.importer, batchId='b'+Date.now();
  let masuk=0;
  im.orders.forEach(o=>{
    const lines=resolvedLines(o);
    if(!o.include||!lines.length||!o.noPesanan||!o.tanggal||o.duplikat||o.batal) return;
    const order={id:nextId(), saluran:im.saluran, noPesanan:o.noPesanan, tanggal:o.tanggal, pembeli:o.pembeli, status:'Selesai', potongan:o.potongan, sumber:'Impor', batchId, moves:[], items:lines};
    if(im.kurangiStok) applyStock(order, im.outlet);
    P.orders.unshift(order); masuk++;
  });
  const {_fromPreset,...preset}=im.mapping; P.presets[im.saluran]=preset;
  P.batches.unshift({id:batchId, fileName:im.fileName, saluran:im.saluran, waktu:formatTimestampID(new Date()), masuk, dilewati:im.orders.length-masuk, dibatalkan:false});
  P.importer=null; P.saluran='Semua'; state.view='pesanan-online';
  toast(`${masuk} pesanan diimpor`); render();
}
function fromForm(){
  const f=state.po.form;
  return {saluran:f.saluran, noPesanan:f.noPesanan.trim(), tanggal:f.tanggal, pembeli:f.pembeli.trim(), status:f.status, potongan:Number(f.potongan)||0,
    items:f.items.filter(i=>i.sku).map(i=>{ const c=findCat(i.sku); return {sku:i.sku, nama:c?c.nama:i.sku, qty:Number(i.qty)||0, harga:Number(i.harga)||0}; })};
}

document.addEventListener('click', e=>{
  const P=state.po, t=e.target;
  if(!P) return;
  const q=s=>t.closest(s);

  if(q('[data-po-kebab]')){ const id=q('[data-po-kebab]').getAttribute('data-po-kebab'); P.kebab=P.kebab===id?null:id; renderMain(); return; }
  if(P.kebab && !q('.kebab-wrap')){ P.kebab=null; if(state.view==='pesanan-online') renderMain(); }

  if(q('[data-po-edit]')){ const o=P.orders.find(x=>x.id===q('[data-po-edit]').getAttribute('data-po-edit')); P.kebab=null;
    P.form={mode:'edit', id:o.id, saluran:o.saluran, noPesanan:o.noPesanan, tanggal:o.tanggal, pembeli:o.pembeli||'', status:o.status, potongan:o.potongan||'', kurangiStok:!!(o.moves&&o.moves.length)||o.sumber==='Manual', outlet:(o.moves&&o.moves[0]&&o.moves[0].outlet)||state.outlet, items:o.items.map(i=>({...i}))};
    state.view='pesanan-online-form'; render(); return; }
  if(q('[data-po-delete]')){ P.kebab=null; P.modal={type:'delete', id:q('[data-po-delete]').getAttribute('data-po-delete')}; render(); return; }
  if(q('[data-po-detail]')){ P.kebab=null; P.modal={type:'detail', id:q('[data-po-detail]').getAttribute('data-po-detail')}; render(); return; }
  const chan=q('[data-po-chan]'); if(chan){ P.saluran=chan.getAttribute('data-po-chan'); renderMain(); return; }

  /* modal umum */
  if(q('[data-po-close]') || t.id==='poModalRoot'){ P.importer=null; P.modal=null; renderPoModal(); return; }
  if(q('[data-po-confirm-delete]')){ const i=P.orders.findIndex(x=>x.id===P.modal.id); revertStock(P.orders[i]); P.orders.splice(i,1); P.modal=null; toast('Pesanan dihapus'); render(); return; }
  if(q('[data-po-rollback]')){ P.modal={type:'rollback', id:q('[data-po-rollback]').getAttribute('data-po-rollback')}; renderPoModal(); return; }
  if(q('[data-po-confirm-rollback]')){ const b=P.batches.find(x=>x.id===P.modal.id);
    P.orders.filter(o=>o.batchId===b.id).forEach(revertStock); P.orders=P.orders.filter(o=>o.batchId!==b.id);
    b.dibatalkan=true; P.modal=null; toast(`Impor ${b.fileName} dibatalkan`); render(); return; }

  /* impor */
  if(q('[data-po-open-import]')){ openImporter(); return; }
  const ic=q('[data-po-imp-chan]'); if(ic){ const im=P.importer; im.saluran=ic.getAttribute('data-po-imp-chan'); renderPoModal(); return; }
  if(q('[data-po-pick-file]')){ fileInput.click(); return; }
  if(q('[data-po-sample]')){ const s=PO_SAMPLES[P.importer.saluran]; loadRows(JSON.parse(JSON.stringify(s.rows)), s.fileName); return; }
  if(q('[data-po-step2]')){ const im=P.importer; if(!im.data.length) return; im.mapping=guessMapping(im.headers, im.saluran); im.step=2; renderPoModal(); return; }
  if(q('[data-po-back1]')){ P.importer.step=1; renderPoModal(); return; }
  if(q('[data-po-step3]')){ const im=P.importer, m=im.mapping; if(PO_FIELDS.some(f=>f.req&&!m[f.k])||(!m.harga&&!m.subtotal)) return; buildPreview(); im.step=3; renderPoModal(); return; }
  if(q('[data-po-back2]')){ P.importer.step=2; renderPoModal(); return; }
  if(q('[data-po-do-import]')){ if(importStats().siap) doImport(); return; }

  /* form manual */
  if(q('[data-po-new]')){ P.form=newForm(); state.view='pesanan-online-form'; render(); return; }
  const fc=q('[data-po-form-chan]'); if(fc){ const f=P.form; f.saluran=fc.getAttribute('data-po-form-chan'); f.items.forEach(i=>{ if(i.sku) i.harga=hargaSaluran(f.saluran,i.sku); }); renderMain(); return; }
  if(q('[data-po-item-add]')){ P.form.items.push({sku:'',qty:1,harga:0}); refreshItems(); return; }
  if(q('[data-po-item-del]')){ P.form.items.splice(Number(q('[data-po-item-del]').getAttribute('data-po-item-del')),1); refreshItems(); return; }
  if(q('[data-po-hitung-komisi]')){ const f=P.form; const g=f.items.reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.harga)||0),0); f.potongan=Math.round(g*komisiSaluran(f.saluran)/100); const el=document.getElementById('poPotonganInput'); if(el) el.value=f.potongan; refreshFormTotals(); return; }
  if(q('[data-po-request-save]')){
    const f=P.form, d=fromForm();
    if(!d.noPesanan){ toast('No. Pesanan wajib diisi'); return; }
    if(!f.tanggal){ toast('Tanggal wajib diisi'); return; }
    if(!d.items.length){ toast('Pilih minimal satu produk'); return; }
    if(d.items.some(i=>i.qty<1)){ toast('Jumlah produk minimal 1'); return; }
    if(isDuplicate(d.saluran, d.noPesanan, f.id)){ toast(`No. Pesanan ini sudah tercatat di ${d.saluran}`); return; }
    P.modal={type:'save'}; renderPoModal(); return;
  }
  if(q('[data-po-confirm-save]')){
    const f=P.form, d=fromForm();
    if(f.mode==='edit'){ const o=P.orders.find(x=>x.id===f.id); revertStock(o); Object.assign(o,d); if(f.kurangiStok && d.status!=='Dibatalkan') applyStock(o,f.outlet); toast('Pesanan diperbarui'); }
    else { const o={id:nextId(), ...d, sumber:'Manual', batchId:null, moves:[]}; if(f.kurangiStok && d.status!=='Dibatalkan') applyStock(o,f.outlet); P.orders.unshift(o); toast('Pesanan tersimpan'); }
    P.modal=null; P.form=null; state.view='pesanan-online'; render(); return;
  }
});

document.addEventListener('input', e=>{
  const P=state.po, t=e.target; if(!P) return;
  if(t.id==='poSearchInput'){ P.search=t.value; const pos=t.selectionStart; renderMain(); const n=document.getElementById('poSearchInput'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } return; }
  const f=P.form; if(!f) return;
  if(t.id==='poNoInput'){ f.noPesanan=t.value; return; }
  if(t.id==='poTglInput'){ f.tanggal=t.value; return; }
  if(t.id==='poPembeliInput'){ f.pembeli=t.value; return; }
  if(t.id==='poPotonganInput'){ f.potongan=t.value; refreshFormTotals(); return; }
  const qi=t.closest('[data-po-item-qty]'); if(qi){ const i=+qi.getAttribute('data-po-item-qty'); f.items[i].qty=t.value; const s=document.querySelector(`[data-po-item-sub="${i}"]`); if(s) s.textContent=fmt((+f.items[i].qty||0)*(+f.items[i].harga||0)); refreshFormTotals(); return; }
  const hi=t.closest('[data-po-item-harga]'); if(hi){ const i=+hi.getAttribute('data-po-item-harga'); f.items[i].harga=t.value; const s=document.querySelector(`[data-po-item-sub="${i}"]`); if(s) s.textContent=fmt((+f.items[i].qty||0)*(+f.items[i].harga||0)); refreshFormTotals(); return; }
});

document.addEventListener('change', e=>{
  const P=state.po, t=e.target; if(!P) return;
  const mp=t.closest('[data-po-map]'); if(mp && P.importer){ P.importer.mapping[mp.getAttribute('data-po-map')]=t.value; delete P.importer.mapping._fromPreset; renderPoModal(); return; }
  const sm=t.closest('[data-po-skumap]'); if(sm && P.importer){ P.importer.skuMap[sm.getAttribute('data-po-skumap')]=t.value; renderPoModal(); return; }
  const tg=t.closest('[data-po-imp-toggle]'); if(tg && P.importer){ P.importer.orders[+tg.getAttribute('data-po-imp-toggle')].include=t.checked; renderPoModal(); return; }
  if(t.id==='poImpKurangiStok' && P.importer){ P.importer.kurangiStok=t.checked; return; }
  if(t.id==='poImpOutlet' && P.importer){ P.importer.outlet=t.value; return; }
  const f=P.form; if(!f) return;
  if(t.id==='poStatusInput'){ f.status=t.value; return; }
  if(t.id==='poKurangiStok'){ f.kurangiStok=t.checked; return; }
  if(t.id==='poOutletInput'){ f.outlet=t.value; return; }
  const si=t.closest('[data-po-item-sku]'); if(si){ const i=+si.getAttribute('data-po-item-sku'); f.items[i].sku=t.value; f.items[i].harga=t.value?hargaSaluran(f.saluran,t.value):0; refreshItems(); return; }
});

render();
})();
</script>
