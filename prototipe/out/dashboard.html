/* ── angka penjualan gabungan (offline + online) untuk dashboard dan laporan ── */
function hkSales(data, dari, sampai){
  const cat=hkCatalog(data.produk), bySku={}; cat.forEach(c=>bySku[c.sku]=c);
  const hppOf=sku=>{ const c=bySku[sku]; return c?c.hpp:0; };
  const katOf=sku=>{ const c=bySku[sku]; return c?c.kategori:'Lainnya'; };
  const out=[];
  data.trx.filter(t=>t.status==='Lunas').forEach(t=>{
    const ev=hkTempat(data, t.eventId);
    out.push({waktu:t.waktu, jenis:'Offline', saluran:ev?ev.nama:t.lokasi, eventId:t.eventId, kasir:t.kasir, metode:t.metode, bayar:hkBayar(t), terbayar:true,
      items:t.items.map(i=>({...i, hpp:i.hpp!=null?i.hpp:hppOf(i.sku), kategori:katOf(i.sku)})), kotor:t.subtotal-t.diskon, potongan:0});
  });
  hkReturList(data).forEach(r=>{ const ev=hkTempat(data, r.eventId), uang=r.cara==='Uang kembali';
    out.push({waktu:r.waktu, jenis:'Offline', saluran:ev?ev.nama:r.lokasi, eventId:r.eventId, kasir:r.oleh, metode:'Retur', bayar:uang?[{metode:r.metode, jumlah:-r.nilai}]:[], terbayar:true, retur:true,
      items:uang?r.items.map(i=>({sku:i.sku, nama:i.nama, qty:-i.qty, harga:i.harga, hpp:0, kategori:katOf(i.sku)})):[], hppExtra:uang?0:r.items.reduce((a,i)=>a+i.qty*hppOf(i.sku),0), kotor:uang?-r.nilai:0, potongan:0}); });
  data.orders.filter(o=>o.status!=='Dibatalkan').forEach(o=>{
    const kotor=o.items.reduce((s,i)=>s+i.qty*i.harga,0);
    out.push({waktu:o.tanggal, jenis:'Online', saluran:o.saluran, eventId:null, kasir:o.oleh||'Tanpa nama', metode:o.saluran, bayar:[{metode:o.saluran, jumlah:kotor}], terbayar:o.status==='Selesai',
      items:o.items.map(i=>({...i, hpp:hppOf(i.sku), kategori:katOf(i.sku)})), kotor, potongan:Number(o.potongan)||0});
  });
  return out.filter(s=>{ const d=s.waktu.slice(0,10); return (!dari||d>=dari)&&(!sampai||d<=sampai); })
    .map(s=>{ const hpp=s.items.reduce((a,i)=>a+i.qty*(i.hpp||0),0)+(s.hppExtra||0); return {...s, qty:s.items.reduce((a,i)=>a+i.qty,0), hpp, bersih:s.kotor-s.potongan, laba:s.kotor-s.potongan-hpp}; });
}
/* retur barang cacat: hanya untuk barang rusak. Barang cacat tidak kembali ke stok jual (dicatat rusak). */
function hkReturList(data){ const out=[]; data.trx.forEach(t=>(t.retur||[]).forEach(r=>out.push({...r, trx:t}))); return out.sort((a,b)=>b.waktu.localeCompare(a.waktu)); }
function hkSudahRetur(t, sku){ return (t.retur||[]).reduce((a,r)=>a+r.items.filter(i=>i.sku===sku).reduce((b,i)=>b+i.qty,0),0); }
function hkNilaiRetur(t, i, qty){ return Math.round(i.harga*qty*(t.subtotal?t.total/t.subtotal:1)); }
function hkRetur(data, t, r){
  r.items.forEach(i=>{ const it=hkStokRow(data.stok,i.sku); if(!it) return; const po=hkPO(it,r.lokasi);
    po.rusak=(po.rusak||0)+i.qty; it.rusak=(it.rusak||0)+i.qty;
    if(r.cara==='Tukar barang'){ po.akhir-=i.qty; it.akhir-=i.qty; } });
  t.retur=t.retur||[]; t.retur.push(r); }
/* ── faktur pembelian: barang selalu masuk Gudang Pusat ── */
function hkFakturDibayar(f){ return (f.bayar||[]).reduce((a,b)=>a+b.jumlah,0); }
function hkFakturSisa(f){ return f.batal?0:Math.max(0, f.total-hkFakturDibayar(f)); }
function hkFakturStatus(f){ if(f.batal) return 'Dibatalkan'; if(hkFakturSisa(f)<=0) return 'Lunas'; if(f.jatuhTempo&&f.jatuhTempo<hkYmd(new Date())) return 'Lewat jatuh tempo'; return 'Belum lunas'; }
/* HPP rata-rata tertimbang: (stok lama x HPP lama + barang masuk x harga beli) / total stok */
function hkStokTotal(stok, sku){ const it=hkStokRow(stok,sku); return it?Math.max(0,(it.akhir||0)+(it.transit||0)):0; }
function hkTerimaFaktur(data, f){
  const ubah=[];
  const perProduk={}; f.items.forEach(i=>{ const p=data.produk.find(p=>p.sku===i.sku||(p.varian||[]).some(v=>v.sku===i.sku)); if(!p) return; (perProduk[p.sku]=perProduk[p.sku]||{p, items:[]}).items.push(i); });
  Object.values(perProduk).forEach(({p,items})=>{ const skus=p.varian&&p.varian.length?p.varian.map(v=>v.sku):[p.sku];
    const stokLama=skus.reduce((a,sku)=>a+hkStokTotal(data.stok,sku),0), lama=Number(p.modal)||0, q=items.reduce((a,i)=>a+i.qty,0), nilai=items.reduce((a,i)=>a+i.qty*i.harga,0);
    const baru=stokLama+q>0?Math.round((stokLama*lama+nilai)/(stokLama+q)):lama;
    if(baru!==lama){ p.modal=baru; p.beli=baru; ubah.push({produk:p.nama, lama, baru}); } });
  f.items.forEach(i=>{ const it=hkStokRow(data.stok,i.sku); if(!it) return; const g=hkPO(it,HK_GUDANG); g.masuk+=i.qty; g.akhir+=i.qty; it.masuk+=i.qty; it.akhir+=i.qty; });
  f.hpp=ubah; data.faktur.unshift(f); return f; }
/* batal faktur: hanya kalau semua barangnya masih ada di Gudang Pusat (belum dikirim, dijual, atau terbuang).
   Stok gudang dikurangi lagi dan HPP dihitung mundur dari rata-rata tertimbang. */
function hkFakturKurang(data, f){ const per={}; f.items.forEach(i=>per[i.sku]=(per[i.sku]||0)+i.qty);
  return Object.entries(per).map(([sku,q])=>{ const it=hkStokRow(data.stok,sku), ada=it?hkPO(it,HK_GUDANG).akhir:0; return {sku, nama:(f.items.find(i=>i.sku===sku)||{}).nama, ada, butuh:q}; }).filter(x=>x.ada<x.butuh); }
function hkBatalFaktur(data, f, alasan, oleh){
  const ubah=[], perProduk={}; f.items.forEach(i=>{ const p=data.produk.find(p=>p.sku===i.sku||(p.varian||[]).some(v=>v.sku===i.sku)); if(!p) return; (perProduk[p.sku]=perProduk[p.sku]||{p, items:[]}).items.push(i); });
  Object.values(perProduk).forEach(({p,items})=>{ const skus=p.varian&&p.varian.length?p.varian.map(v=>v.sku):[p.sku];
    const stok=skus.reduce((a,sku)=>a+hkStokTotal(data.stok,sku),0), now=Number(p.modal)||0, q=items.reduce((a,i)=>a+i.qty,0), nilai=items.reduce((a,i)=>a+i.qty*i.harga,0);
    const awal=((f.hpp||[]).find(h=>h.produk===p.nama)||{lama:now}).lama, hitung=stok-q>0?Math.round((stok*now-nilai)/(stok-q)):awal, baru=hitung>0?hitung:awal;
    if(baru!==now){ p.modal=baru; p.beli=baru; ubah.push({produk:p.nama, lama:now, baru}); } });
  f.items.forEach(i=>{ const it=hkStokRow(data.stok,i.sku); if(!it) return; const g=hkPO(it,HK_GUDANG); g.masuk-=i.qty; g.akhir-=i.qty; it.masuk-=i.qty; it.akhir-=i.qty; });
  f.batal={alasan, oleh, waktu:hkIso(new Date()), hpp:ubah, kembali:hkFakturDibayar(f)}; return f; }
/* ── akun karyawan: semua didaftarkan Owner di dashboard ──
   Dashboard: email + password. POS: PIN 6 angka. Keduanya sementara sampai diganti karyawan saat pertama masuk.
   Prototipe: password disimpan sebagai hash sederhana di localStorage; versi produksi memakai server dengan hash yang kuat. */
function hkHashPw(pw){ const s='hikayat:'+pw; let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'h$'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16); }
function hkCekPw(staff, pw){ return !!staff&&!!staff.pw&&staff.pw===hkHashPw(pw); }
function hkAksesDashboard(staff){ return !!staff&&staff.role.some(r=>r==='Admin'||r==='Owner'); }
/* aturan password baru: minimal 8 karakter, ada huruf dan angka */
function hkPwLemah(pw){ if((pw||'').length<8) return 'Password minimal 8 karakter'; if(!/[a-zA-Z]/.test(pw)||!/\d/.test(pw)) return 'Password harus berisi huruf dan angka'; return null; }
/* aturan PIN: 6 angka, tidak boleh angka sama semua atau berurutan, dan tidak dipakai karyawan lain */
function hkPinLemah(pin, staffList, namaSendiri){ if(!/^\d{6}$/.test(pin||'')) return 'PIN harus 6 angka';
  if(/^(\d)\1{5}$/.test(pin)) return 'PIN tidak boleh 6 angka yang sama';
  if('0123456789'.includes(pin)||'9876543210'.includes(pin)) return 'PIN tidak boleh angka berurutan';
  if((staffList||[]).some(x=>x.pin===pin&&x.nama!==namaSendiri)) return 'PIN sudah dipakai karyawan lain';
  return null; }
function hkSum(list, f){ return list.reduce((s,x)=>s+(typeof f==='function'?f(x):x[f]),0); }
function hkGroup(list, keyFn){ const m=new Map(); list.forEach(x=>{ const k=keyFn(x); if(!m.has(k)) m.set(k,[]); m.get(k).push(x); }); return m; }

function hkBayar(t){ return t.pembayaran&&t.pembayaran.length?t.pembayaran:[{metode:t.metode, jumlah:t.total}]; }
/* QRIS statis: kasir mencatat 4 digit terakhir no. referensi dari notifikasi dana masuk */
function hkRefQris(t){ return hkBayar(t).filter(b=>b.ref).map(b=>'ref …'+b.ref).join(', '); }
function hkShiftKas(data, sh){
  const trx=data.trx.filter(t=>t.shiftId===sh.id&&t.status!=='Void');

  trx.forEach(t=>hkBayar(t).forEach(b=>{ by[b.metode]=(by[b.metode]||0)+b.jumlah; }));
  const kas=sh.kas||[];
  const masuk=kas.filter(k=>k.jenis==='masuk').reduce((a,k)=>a+k.jumlah,0), keluar=kas.filter(k=>k.jenis==='keluar').reduce((a,k)=>a+k.jumlah,0);
  const refund=data.trx.filter(t=>t.shiftId===sh.id&&t.status==='Void').reduce((a,t)=>a+t.total,0);
  const retur=hkReturList(data).filter(r=>r.shiftId===sh.id&&r.cara==='Uang kembali'&&r.metode==='Tunai').reduce((a,r)=>a+r.nilai,0);
  const harus=sh.modal+(by.Tunai||0)+masuk-keluar-retur;

    harus, selisih:sh.tutup?sh.kasHitung-harus:null};
}

/* ── promo dari dashboard (tanggal "26 Mar 2026" atau "26 Mar 26") ── */
function hkParseTgl(s){
  const m=String(s||'').trim().match(/^(\d{1,2})\s+([A-Za-z]{3})\w*\s+(\d{2,4})$/); if(!m) return null;
  const bln=HK_BULAN.findIndex(b=>b.toLowerCase()===m[2].toLowerCase()); if(bln<0) return null;
  const th=m[3].length===2?2000+Number(m[3]):Number(m[3]);
  return `${th}-${hkPad(bln+1)}-${hkPad(Number(m[1]))}`;
}
function hkNum(s){ return Number(String(s==null?'':s).replace(/[^\d]/g,''))||0; }
const HK_HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
/* promo yang berlaku di POS untuk lokasi dan waktu tertentu (tanggal, hari, jam) */
function hkPromoAktif(data, lokasi, ymd, jam){
  const now=new Date(); ymd=ymd||hkYmd(now); jam=jam||`${hkPad(now.getHours())}:${hkPad(now.getMinutes())}`;
  const hari=HK_HARI[new Date(ymd+'T12:00').getDay()];
  const ok=p=>{ const d=p.detail||{}; if(p.status!=='Aktif'||d.statusPromo===false) return false;
    if(d.platform&&d.platform.length&&!d.platform.includes('POS')) return false;
    if(Array.isArray(d.lokasi)){ if(!d.lokasiSemua&&d.lokasi.length&&!d.lokasi.includes(lokasi)) return false; }
    else if(d.outlet&&d.outlet!==lokasi&&d.outlet!=='Semua Lokasi'&&d.outlet!=='Semua lokasi') return false;
    const a=hkParseTgl(d.tglMulai), b=hkParseTgl(d.tglSelesai)||a; if(a&&ymd<a) return false; if(b&&ymd>b) return false;
    if(d.hari&&d.hari.length&&!d.hari.includes(hari)) return false;
    if(d.jamMulai&&jam<d.jamMulai) return false; if(d.jamSelesai&&jam>d.jamSelesai) return false;
    return ['persen','nominal','rp','bonus-produk','bundling'].includes(d.jenisBonus); };
  const map=(p,scope)=>{ const d=p.detail, persen=d.jenisBonus==='persen', qty=d.promoBerdasarkan==='kuantitas';
    return {id:(scope==='order'?'pt-':'pp-')+p.nama, name:p.nama, scope, parents:scope==='product'?(d.produkPromo||[]):undefined, type:persen?'percent':'nominal', percent:hkNum(d.besaranPotongan), nominal:hkNum(d.besaranPotongan),
      maxPotongan:persen&&d.maksimalPotongan?hkNum(d.maksimalPotonganNominal):0, minPembelian:qty&&scope==='product'?0:hkNum(d.minPembelian), minQty:qty?hkNum(d.minKuantitas):0,
      kelipatan:!persen&&!!d.berlakuKelipatan, auto:d.aktivasi==='otomatis', editable:!!d.izinkanKasirUbah&&persen, maxPercent:hkNum(d.batasKasirPersen)||100,
      ...(d.jenisBonus==='bonus-produk'?{type:'bonus', minPembelian:0, minQty:hkNum(d.minKuantitas)||1, bonusParents:d.bonusProduk||[], bonusQty:hkNum(d.jumlahBonus)||1, kelipatan:!!d.berlakuKelipatan, editable:false}:{}),
      ...(d.jenisBonus==='bundling'?{type:'bundle', minPembelian:0, minQty:0, hargaPaket:hkNum(d.hargaPaket), kelipatan:!!d.berlakuKelipatan, editable:false}:{}),
      desc:d.deskripsi||'', periode:p.durasi+(d.jamMulai&&(d.jamMulai!=='00:00'||d.jamSelesai!=='23:59')?` · ${d.jamMulai}–${d.jamSelesai}`:'')+(d.hari&&d.hari.length&&d.hari.length<7?` · ${d.hari.join(', ')}`:'')}; };
  return [...(data.promoTotal||[]).filter(ok).map(p=>map(p,'order')), ...(data.promoProduk||[]).filter(ok).map(p=>map(p,'product'))];
}

/* ── harga khusus per event (kosong = harga normal) ── */
function hkHarga(ev, sku, normal){ const h=ev&&ev.harga&&ev.harga[sku]; return h?Number(h):normal; }
/* pre-sale: event yang belum mulai dengan mode "ambil nanti" tidak mengurangi stok saat transaksi */
function hkAmbilNanti(ev){ return !!ev&&!ev.gudang&&ev.presaleAktif!==false&&ev.presale==='ambil'&&hkStatusEvent(ev)==='Akan Datang'; }
/* event belum mulai dan pre-sale dimatikan: belum boleh berjualan */
function hkPreSaleTutup(ev){ return !!ev&&!ev.gudang&&ev.presaleAktif===false&&hkStatusEvent(ev)==='Akan Datang'; }
function hkPreSaleMenunggu(data, evId){ return data.trx.filter(t=>t.eventId===evId&&t.status!=='Void'&&t.pengambilan&&t.pengambilan.status==='Menunggu'); }

/* ── tutup event: dipakai dashboard (Admin/Owner) dan POS (Owner) ── */
/* pesanan pre-sale yang lewat batas ambil otomatis jadi Perlu Refund. Dipanggil saat dashboard/POS memuat data. */
function hkCekBatasPreSale(data){ const now=hkIso(new Date()); let n=0;
  data.trx.forEach(t=>{ const g=t.pengambilan; if(t.status==='Lunas'&&g&&g.status==='Menunggu'&&g.batas&&g.batas<now){ g.status='Perlu Refund'; g.catatan=`Tidak diambil ${HK_BATAS_AMBIL_HARI} hari setelah event ditutup`; n++; } });
  return n; }
/* kerugian dari selisih stok tutup event, beserta pertanggungjawabannya */
function hkKerugianList(data){ return data.opname.filter(o=>o.jenis==='Tutup Event'&&o.kerugian>0); }
/* semua kerugian yang perlu pertanggungjawaban: selisih stok (opname) dan kas kurang (tutup kasir) */
function hkKerugianSemua(data){
  const stok=data.opname.filter(o=>o.kerugian>0&&o.tanggungJawab).map(o=>({key:o.no, jenis:'Stok', waktu:o.disetujui?o.disetujui.waktu:o.waktu, lokasi:o.lokasi, oleh:o.disetujui?o.disetujui.oleh:o.oleh, no:o.no, kerugian:o.kerugian, tanggungJawab:o.tanggungJawab,
    rincian:o.produk.filter(x=>x.selisih<0).map(x=>`${x.nama} ${x.selisih}`)}));
  const kas=data.shift.filter(s=>s.tutup&&s.kasKurang).map(s=>{ const ev=hkTempat(data,s.eventId)||{nama:'-'}, K=hkShiftKas(data,s);
    return {key:'KAS:'+s.id, jenis:'Kas', waktu:s.tutup, lokasi:ev.nama, oleh:s.ditutupOleh||s.kasir, no:'Laci '+s.kasir, kerugian:Math.max(0,-K.selisih), tanggungJawab:s.kasKurang, rincian:[`Kas kurang ${Math.max(0,-K.selisih).toLocaleString('id-ID')}`]}; });
  const buang=(data.terbuang||[]).filter(t=>t.kerugian>0&&t.tanggungJawab).map(t=>({key:'TB:'+t.no, jenis:'Terbuang', waktu:t.waktu, lokasi:t.lokasi, oleh:t.oleh, no:t.no, kerugian:t.kerugian, tanggungJawab:t.tanggungJawab,
    rincian:t.items.map(i=>`${i.nama} -${i.qty}`)}));
  return [...stok, ...kas, ...buang].sort((a,b)=>b.waktu.localeCompare(a.waktu));
}
function hkKerugianRiwayat(o){ return (o.tanggungJawab&&o.tanggungJawab.riwayat)||[]; }
function hkKerugianJumlah(o, jenis){ return hkKerugianRiwayat(o).filter(r=>!jenis||r.jenis===jenis).reduce((a,r)=>a+(+r.jumlah||0),0); }
function hkKerugianSisa(o){ return Math.max(0, o.kerugian-hkKerugianJumlah(o)); }
/* catat satu langkah penyelesaian; riwayat tidak pernah ditimpa */
function hkSelesaikanKerugian(o, r){ const tj=o.tanggungJawab, sisa=hkKerugianSisa(o); tj.riwayat=tj.riwayat||[];
  tj.riwayat.push({...r, jumlah:Math.min(sisa, r.jenis==='Dibebankan perusahaan'?sisa:(+r.jumlah||0))});
  const s2=hkKerugianSisa(o); tj.status=s2>0?'Diganti sebagian':hkKerugianJumlah(o,'Dibebankan perusahaan')?'Dibebankan perusahaan':'Diganti'; }
/* stok opname akhir event dari POS: dikirim kasir, disetujui atau diminta ulang saat Tutup Event */
function hkSOAkhir(data, evId){ return data.opname.find(o=>o.eventId===evId&&o.jenis==='Akhir Event'&&o.status!=='Diganti')||null; }
/* fisik untuk ditutup: stok sistem sekarang + selisih hasil opname (kalau ada penjualan setelah opname, selisihnya tetap) */
function hkSOFisik(data, so){ const ev=hkTempat(data,so.eventId), out={}; so.produk.forEach(p=>{ out[p.sku]=Math.max(0,hkStokDi(data.stok,p.sku,ev.nama)+(p.fisik-p.sistem)); }); return out; }
/* setujui opname di tengah event: stok event disesuaikan, kerugian (kalau ada) masuk Selisih & Kerugian; event tetap berjalan */
function hkSetujuiSO(data, soNo, oleh, pj){
  const so=data.opname.find(o=>o.no===soNo); if(!so||so.status!=='Menunggu persetujuan') return false;
  const ev=hkTempat(data,so.eventId), fisik=hkSOFisik(data,so); let kerugian=0;
  so.produk.forEach(p=>{ const it=hkStokRow(data.stok,p.sku); if(!it) return; const po=hkPO(it,ev.nama), d=po.akhir-fisik[p.sku];
    if(d){ po.akhir-=d; it.akhir-=d; po.terbuang=(po.terbuang||0)+d; it.terbuang=(it.terbuang||0)+d; } if(d>0) kerugian+=d*(p.hpp||0); });
  so.status='Disetujui'; so.disetujui={oleh, waktu:hkIso(new Date())}; so.kerugian=kerugian;
  so.tanggungJawab=kerugian?{pj:pj&&pj.nama||so.oleh, alasan:pj&&pj.alasan||so.catatan||'', status:'Belum diselesaikan', riwayat:[]}:null;
  return true; }
function hkSORingkas(so){ const kurang=so.produk.filter(p=>p.fisik<p.sistem).reduce((a,p)=>a+p.sistem-p.fisik,0), lebih=so.produk.filter(p=>p.fisik>p.sistem).reduce((a,p)=>a+p.fisik-p.sistem,0);
  return {kurang, lebih, kerugian:so.produk.reduce((a,p)=>a+Math.max(0,p.sistem-p.fisik)*(p.hpp||0),0)}; }
function hkCekTutupEvent(data, evId){
  const ev=data.events.find(e=>e.id===evId);
  return {ev, shiftBuka:data.shift.filter(s=>s.eventId===evId&&!s.tutup), mutasiTunda:data.mutasi.filter(m=>m.eventId===evId&&m.status==='Dikirim'),
    sisa:data.stok.map(it=>({it, q:hkStokDi(data.stok,it.sku,ev.nama)})).filter(x=>x.q>0), preSale:hkPreSaleMenunggu(data, evId)};
}
/* batas ambil pre-sale di Gudang Pusat setelah event ditutup */
const HK_BATAS_AMBIL_HARI = 7;
/* fisik: {sku: jumlah hasil hitung}. Kosong berarti sama dengan stok sistem.
   Selisih dicatat sebagai stok opname tutup event (kerugian = selisih x HPP), lalu stok fisik kembali ke gudang. */
function hkTutupEvent(data, evId, oleh, fisik, pj, soNo){
  const c=hkCekTutupEvent(data, evId), ev=c.ev; if(c.shiftBuka.length) return false;
  const kembali={}, selisih={}, items=[]; let kerugian=0;
  const hppOf=sku=>{ const k=hkCatalog(data.produk).find(x=>x.sku===sku); return k?k.hpp:0; };
  c.sisa.forEach(x=>{ const sku=x.it.sku, f=fisik&&fisik[sku]!=null&&fisik[sku]!==''?Math.max(0,Math.round(+fisik[sku])||0):x.q, d=x.q-f, hpp=hppOf(sku);
    items.push({sku, nama:x.it.nama, sistem:x.q, fisik:f, selisih:f-x.q, hpp, kerugian:Math.max(0,d)*hpp});
    if(d){ const p=hkPO(x.it,ev.nama); p.akhir-=d; x.it.akhir-=d; p.terbuang=(p.terbuang||0)+d; x.it.terbuang=(x.it.terbuang||0)+d; selisih[sku]=-d; kerugian+=Math.max(0,d)*hpp; }
    if(f>0){ kembali[sku]=f; hkPindah(data.stok, sku, ev.nama, HK_GUDANG, f); } });
  if(items.length) data.opname.unshift({no:'SO/'+hkYmd(new Date()).replace(/-/g,'').slice(2)+'/'+String(data.opname.length+1).padStart(2,'0'), jenis:'Tutup Event', eventId:ev.id, lokasi:ev.nama, status:'Berhasil', waktu:hkIso(new Date()), tanggal:hkTgl(new Date()), oleh, produk:items, kerugian,
    tanggungJawab:kerugian?{pj:pj&&pj.nama||'', alasan:pj&&pj.alasan||'', status:'Belum diselesaikan', riwayat:[]}:null, dariSO:soNo||null});
  const so=soNo&&data.opname.find(o=>o.no===soNo); if(so){ so.status='Disetujui'; so.disetujui={oleh, waktu:hkIso(new Date())}; if(items.length) data.opname[0].dihitungOleh=so.oleh; }
  c.mutasiTunda.forEach(m=>{ m.items.forEach(i=>{ const it=hkStokRow(data.stok,i.sku), g=hkPO(it,HK_GUDANG); it.transit-=i.dikirim; g.keluar-=i.dikirim; g.akhir+=i.dikirim; }); m.status='Batal'; m.catatan='Event ditutup sebelum diterima'; });
  const batas=hkIso(hkAddDays(new Date(),HK_BATAS_AMBIL_HARI));
  c.preSale.forEach(t=>{ t.pengambilan.batas=batas; t.pengambilan.catatan=`Event ditutup. Bisa diambil di ${HK_GUDANG} sampai ${hkTgl(batas)}`; });
  ev.ditutup=true; ev.tutup={waktu:hkIso(new Date()), oleh, kembali, selisih, kerugian, pj:kerugian&&pj?pj.nama:null, opnameNo:items.length?data.opname[0].no:null};
  return true;
}

const DASH_KEY='hk2dash:sesi';
function akunSesi(){ try{ return JSON.parse(localStorage.getItem(DASH_KEY)); }catch(e){ return null; } }
function akunLogin(){ const s=akunSesi(); return s&&state.staff.find(x=>x.nama===s.nama&&x.aktif!==false&&hkAksesDashboard(x))||null; }
function akun(){ const st=akunLogin(); return st&&!st.pwBaru?st:null; }
const akunNama=()=>(akun()||{nama:'Admin'}).nama;
window.hkAkun=akun;
const loginRoot=document.createElement('div'); loginRoot.id='hkDashLogin'; document.body.appendChild(loginRoot);
let dashLogin={email:'', pw:'', err:'', ganti:false, lama:'', baru:'', ulang:''};
const pwInput=(id,label,val,ph)=>`<div class="hk-lf"><label for="${id}">${label}</label><div class="hk-pwbox"><input type="password" id="${id}" value="${hkEsc(val)}" placeholder="${ph||''}" autocomplete="off"><span class="hk-pwlihat" data-hk-lihat="${id}">Lihat</span></div></div>`;
function renderLogin(){
  const st=akunLogin(), wajib=st&&st.pwBaru, D=dashLogin;
  if(akun()&&!D.ganti){ loginRoot.innerHTML=''; loginRoot.className=''; return; }
  loginRoot.className='hk-login-bg';
  const brand=`<div class="hk-login-brand"><div class="hk-login-logo">HK</div><div><b>Hikayat Merchandise</b><div class="hk-sub">Dashboard admin</div></div></div>`;
  const err=D.err?`<div class="hk-login-err">${hkEsc(D.err)}</div>`:'';
  if(wajib||D.ganti){ const u=wajib?st:akun();
    loginRoot.innerHTML=`<div class="hk-login">${brand}
      <div class="hk-login-judul">${wajib?'Buat password baru':'Ganti password'}</div>
      <div class="hk-sub" style="margin-bottom:14px;">${wajib?`Halo ${hkEsc(u.nama.split(' ')[0])}. Password dari Owner hanya sementara. Buat password Anda sendiri untuk melanjutkan.`:`Akun ${hkEsc(u.email)}`}</div>
      ${wajib?'':pwInput('hkPwLama','Password sekarang',D.lama)}
      ${pwInput('hkPwBaru','Password baru',D.baru,'Minimal 8 karakter, huruf dan angka')}
      ${pwInput('hkPwUlang','Ulangi password baru',D.ulang)}
      ${err}<button class="btn btn-primary" style="width:100%;padding:11px;margin-top:4px;" data-hk-pw-simpan>${wajib?'Simpan dan masuk':'Simpan password'}</button>
      <div style="text-align:center;margin-top:12px;"><span class="hk-row-link hk-sub" data-hk-pw-batal>${wajib?'Keluar':'Batal'}</span></div></div>`;
    const f=document.getElementById(wajib?'hkPwBaru':'hkPwLama'); if(f&&!document.activeElement.closest('#hkDashLogin')) f.focus(); return; }
  loginRoot.innerHTML=`<div class="hk-login">${brand}
    <div class="hk-login-judul">Masuk</div>
    <div class="hk-lf"><label for="hkDashEmail">Email</label><input type="email" id="hkDashEmail" value="${hkEsc(D.email)}" placeholder="nama@hikayat.id" autocomplete="username"></div>
    ${pwInput('hkDashPw','Password',D.pw)}
    ${err}<button class="btn btn-primary" style="width:100%;padding:11px;margin-top:4px;" data-hk-login-ok>Masuk</button>
    <div class="hk-sub" style="margin-top:14px;">Akun dibuat oleh Owner di menu Karyawan. Lupa password? Minta Owner meresetnya. Kasir tidak masuk dashboard, cukup PIN di POS.</div>
    <div class="hk-sub" style="margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px;">Demo: rina@hikayat.id (Owner), dimas@hikayat.id, budi@hikayat.id, password <b>hikayat123</b>. Karyawan baru: laila@hikayat.id, password sementara <b>sementara1</b>.</div></div>`;
  const f=document.getElementById(D.email?'hkDashPw':'hkDashEmail'); if(f&&!document.activeElement.closest('#hkDashLogin')) f.focus();
}
function cobaLogin(){
  const D=dashLogin, email=D.email.trim().toLowerCase(), st=state.staff.find(x=>(x.email||'').toLowerCase()===email);
  if(!email||!D.pw){ D.err='Isi email dan password'; renderLogin(); return; }
  if(!st||!hkCekPw(st,D.pw)){ D.err='Email atau password salah'; D.pw=''; renderLogin(); return; }
  if(st.aktif===false){ D.err='Akun ini sudah dinonaktifkan. Hubungi Owner.'; D.pw=''; renderLogin(); return; }
  if(!hkAksesDashboard(st)){ D.err='Akun ini hanya untuk POS'; D.pw=''; renderLogin(); return; }
  localStorage.setItem(DASH_KEY, JSON.stringify({nama:st.nama, email:st.email, waktu:hkIso(new Date())}));
  dashLogin={email:'', pw:'', err:'', ganti:false, lama:'', baru:'', ulang:''};
  if(st.pwBaru){ renderLogin(); return; }
  render(); toast(`Masuk sebagai ${st.nama}`);
}
function simpanPwBaru(){
  const D=dashLogin, st=akunLogin(), wajib=st&&st.pwBaru;
  if(!st){ D.ganti=false; renderLogin(); return; }
  if(!wajib&&!hkCekPw(st,D.lama)){ D.err='Password sekarang salah'; renderLogin(); return; }
  const lemah=hkPwLemah(D.baru); if(lemah){ D.err=lemah; renderLogin(); return; }
  if(D.baru!==D.ulang){ D.err='Ulangi password baru belum sama'; renderLogin(); return; }
  if(hkCekPw(st,D.baru)){ D.err='Password baru tidak boleh sama dengan yang lama'; renderLogin(); return; }
  st.pw=hkHashPw(D.baru); st.pwBaru=false; st.pwDiganti=hkIso(new Date()); hkSaveAll(data());
  dashLogin={email:'', pw:'', err:'', ganti:false, lama:'', baru:'', ulang:''};
  render(); toast(wajib?`Password tersimpan. Selamat datang, ${st.nama}`:'Password berhasil diganti');
}
loginRoot.addEventListener('click', e=>{

});

function download(name, rows){

function periodeRange(){
  const {periode,refDate}=state.dashboard; const d=new Date(refDate);
  if(periode==='Harian') return [hkYmd(d),hkYmd(d)];
  if(periode==='Mingguan'){ const day=d.getDay()||7; const s=hkAddDays(d,1-day); return [hkYmd(s),hkYmd(hkAddDays(s,6))]; }
  return [hkYmd(new Date(d.getFullYear(),d.getMonth(),1)), hkYmd(new Date(d.getFullYear(),d.getMonth()+1,0))];
}
function bars(map, fmtV){
  const items=[...map.entries()].map(([nama,v])=>({nama,v})).sort((a,b)=>b.v-a.v).slice(0,6);
  return items.length?statBarsHTML(items,{valueKey:'v',valueFmt:fmtV}):`<div class="hk-empty" style="padding:16px;">Belum ada data di periode ini</div>`;
}
function liveEventsHTML(){

      <div class="hk-sub">${hkEsc(e.venue)} · ${tglRange(e.mulai,e.selesai)}</div>
      <div class="nums"><div><span class="hk-sub">Hari ini</span><b>${hkRp(hkSum(sToday,'kotor'))}</b></div><div><span class="hk-sub">Total event</span><b>${hkRp(hkSum(s,'kotor'))}</b></div><div><span class="hk-sub">Shift terbuka</span><b>${buka.length?buka.map(b=>b.kasir.split(' ')[0]).join(', '):'–'}</b></div></div>

viewDashboard=function(){
  const d=state.dashboard; const [dari,sampai]=periodeRange();
  const S=filterLokasi(hkSales(data(),dari,sampai));
  const off=S.filter(s=>s.jenis==='Offline'), on=S.filter(s=>s.jenis==='Online');
  const kotor=hkSum(S,'kotor'), nTrx=S.filter(x=>!x.retur).length, qty=hkSum(S,'qty'), laba=hkSum(S,'laba');
  const metode=new Map(), saluran=new Map(), kategori=new Map(), produk=new Map(), kasir=new Map();
  off.forEach(s=>s.bayar.forEach(b=>metode.set(b.metode,(metode.get(b.metode)||0)+b.jumlah)));
  S.forEach(s=>{ saluran.set(s.saluran,(saluran.get(s.saluran)||0)+s.kotor);
    s.items.forEach(i=>{ kategori.set(i.kategori,(kategori.get(i.kategori)||0)+i.qty*i.harga); const c=cat().find(x=>x.sku===i.sku); const n=c?c.produk:i.nama; produk.set(n,(produk.get(n)||0)+i.qty); }); });
  off.forEach(s=>kasir.set(s.kasir,(kasir.get(s.kasir)||0)+s.kotor));
  const totKat=[...kategori.values()].reduce((a,b)=>a+b,0)||1;
  kategori.forEach((v,k)=>kategori.set(k,Math.round(v/totKat*100)));
  const minim=state.stokItems.filter(it=>it.jenis==='Produk').map(it=>{ const p=state.products.find(x=>x.sku===it.parent||x.sku===it.sku); return {it, min:p?(p.stokMin||0):0, aktif:p&&p.status==='Aktif'}; })
    .filter(x=>x.aktif&&x.it.akhir<=x.min).sort((a,b)=>a.it.akhir-b.it.akhir).slice(0,6);

    <div class="metric-card"><div class="metric-label">Belum diselesaikan</div><div class="metric-value" style="color:var(--danger-text);">${hkRp(sisa)}</div></div>
    <div class="metric-card"><div class="metric-label">Sudah diganti</div><div class="metric-value">${hkRp(diganti)}</div></div>
    <div class="metric-card"><div class="metric-label">Dibebankan perusahaan</div><div class="metric-value">${hkRp(beban)}</div></div>
  </div>
  <div class="card" style="padding:0;overflow:auto;"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Lokasi</th><th>Rincian</th><th>Penanggung jawab</th><th class="hk-num">Kerugian</th><th>Status & riwayat</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="8" class="hk-empty">Belum ada kerugian. Kerugian muncul dari selisih stok opname, barang terbuang yang dicatat manual, dan kas laci yang kurang saat tutup kasir.</td></tr>'}</tbody></table></div>`;
}

    <div class="metric-card"><div class="metric-label">Modal barang rusak</div><div class="metric-value">${hkRp(rusak)}</div><div class="hk-sub">HPP barang cacat</div></div>
    <div class="metric-card"><div class="metric-label">Paling sering cacat</div><div class="metric-value" style="font-size:16px;">${top.length?hkEsc(top[0][0]):'–'}</div>${top.length?`<div class="hk-sub">${top[0][1]} pcs</div>`:''}</div>
  </div>
  <div class="card" style="padding:0;overflow:auto;"><table><thead><tr><th>Waktu retur</th><th>Transaksi</th><th>Lokasi</th><th>Barang</th><th>Kerusakan</th><th>Penyelesaian</th><th class="hk-num">Uang kembali</th><th>Kasir</th></tr></thead>

/* ════════ PROMOSI: validasi, draf, status, pemakaian ════════ */
const hkHargaTermurah=nama=>{ const p=state.products.find(x=>x.nama===nama); if(!p) return 0; return p.varian&&p.varian.length?Math.min(...p.varian.map(v=>hkNum(v.jual))):hkNum(p.jual); };
window.hkPaketNormal=f=>{ const L=f.produkPromo||[]; if(L.length<2) return ''; const n=L.reduce((a,x)=>a+hkHargaTermurah(x),0), h=hkNum(f.hargaPaket);
  return `<div class="help-text" style="margin-top:4px;">Harga normal paket (varian termurah): ${hkRp(n)}${h?` · pembeli hemat ${hkRp(Math.max(0,n-h))}`:''}</div>`; };
/* "Berlaku di": bisa pilih beberapa lokasi, atau Semua lokasi */
function lokasiAwal(f){ if(Array.isArray(f.lokasi)) return; f.lokasi=f.outlet&&!/^semua/i.test(f.outlet)?f.outlet.split(', ').filter(Boolean):[]; f.lokasiSemua=!f.lokasi.length; }
window.hkLokasiPilih=(f,prefix)=>{ lokasiAwal(f); const chip=(arg,label,on,sub)=>`<div class="hk-check ${on?'on':''}" data-hk-act="pr-lok" data-hk-arg="${prefix}|${hkEsc(arg)}"><input type="checkbox" ${on?'checked':''} style="pointer-events:none;"><div><b>${hkEsc(label)}</b>${sub?`<div class="hk-sub">${sub}</div>`:''}</div></div>`;
  return `<div id="${prefix}LokasiPilih" class="hk-lokasi" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;border-radius:8px;">${chip('*','Semua lokasi',f.lokasiSemua,'Semua event dan Gudang Pusat')}${OUTLETS.map(o=>chip(o,o,!f.lokasiSemua&&f.lokasi.includes(o),o===HK_GUDANG?'Jual langsung dari gudang':'Event')).join('')}</div>`; };
/* halaman 1 promo: semua isian wajib harus terisi sebelum Selanjutnya */
window.hkPromoCek1=(f,prefix)=>{ lokasiAwal(f); const a=hkParseTgl(f.tglMulai), b=hkParseTgl(f.tglSelesai);
  const cek=[[!f.lokasiSemua&&!f.lokasi.length,'LokasiPilih','Pilih lokasi promo berlaku (boleh lebih dari satu)'],[!(f.nama||'').trim(),'NamaInput','Isi nama promo'],[!(f.deskripsi||'').trim(),'DeskripsiInput','Isi deskripsi promo'],
    [!a,'TglMulaiInput','Isi tanggal mulai dengan benar, contoh: 6 Okt 2026'],[!b,'TglSelesaiInput','Isi tanggal berakhir dengan benar, contoh: 6 Okt 2026'],[a&&b&&b<a,'TglSelesaiInput','Tanggal berakhir tidak boleh sebelum tanggal mulai'],
    [!/^\d{1,2}:\d{2}$/.test(f.jamMulai||''),'JamMulaiInput','Isi jam mulai, contoh: 08:00'],[!/^\d{1,2}:\d{2}$/.test(f.jamSelesai||''),'JamSelesaiInput','Isi jam selesai, contoh: 21:00'],[(f.jamSelesai||'')<=(f.jamMulai||''),'JamSelesaiInput','Jam selesai harus setelah jam mulai'],
    [!(f.hari||[]).length,'HariPilih','Pilih minimal satu hari']];
  document.querySelectorAll('.hk-invalid').forEach(x=>x.classList.remove('hk-invalid'));
  const salah=cek.filter(c=>c[0]); if(!salah.length) return true;
  salah.forEach(c=>{ const el=c[1]==='HariPilih'?document.querySelector(`[data-toggle-${prefix}-semua-hari]`)?.closest('.field'):document.getElementById(prefix+c[1]); if(el) el.classList.add('hk-invalid'); });
  const first=document.querySelector('.hk-invalid'); if(first){ first.scrollIntoView({block:'center',behavior:'smooth'}); if(first.tagName==='INPUT') first.focus(); }
  toast(salah.length>1?`${salah[0][2]}. Masih ada ${salah.length-1} isian wajib lain yang ditandai merah`:salah[0][2]); return false; };
document.addEventListener('input',e=>{ if(e.target.classList&&e.target.classList.contains('hk-invalid')) e.target.classList.remove('hk-invalid'); });
window.hkPromoCek=(f,kind)=>{
  { const px=kind==='produk'?'promoProduk':'promoTotal'; if(!hkPromoCek1(f,px)){ f.step=1; renderPromoFormModal(); setTimeout(()=>hkPromoCek1(f,px),30); return 'Lengkapi isian wajib di halaman Informasi Promo'; } }
  const besar=hkNum(f.besaranPotongan), persen=f.jenisBonus==='persen';
  if(f.jenisBonus==='bonus-produk'){
    if(!(f.produkPromo||[]).length) return 'Pilih produk yang harus dibeli';
    if(!hkNum(f.minKuantitas)) return 'Isi jumlah minimal beli';
    if((f.bonusProduk||[]).length!==1) return 'Pilih satu produk bonus';
    if(!hkNum(f.jumlahBonus)) f.jumlahBonus='1';
    f.promoBerdasarkan='kuantitas'; f.besaranPotongan=''; }
  else if(f.jenisBonus==='bundling'){
    if((f.produkPromo||[]).length<2) return 'Paket minimal berisi dua produk';
    const h=hkNum(f.hargaPaket), n=(f.produkPromo||[]).reduce((a,x)=>a+hkHargaTermurah(x),0);
    if(!h) return 'Isi harga paket';
    if(h>=n) return `Harga paket harus lebih murah dari harga normal ${hkRp(n)}`;
    f.promoBerdasarkan=''; f.besaranPotongan=''; }
  else if(!besar) return 'Isi besaran potongan';
  if(f.jenisBonus==='bonus-produk'||f.jenisBonus==='bundling'){
    const a=hkParseTgl(f.tglMulai), b=hkParseTgl(f.tglSelesai);
    if(!a||!b) return 'Isi tanggal mulai dan selesai';
    if(b<a) return 'Tanggal selesai tidak boleh sebelum tanggal mulai';
    if((f.jamSelesai||'23:59')<=(f.jamMulai||'00:00')) return 'Jam selesai harus setelah jam mulai';
    if(!(f.hari||[]).length) return 'Pilih minimal satu hari';
    return null; }
  if(persen&&besar>100) return 'Potongan persen maksimal 100%';
  if(kind==='produk'&&!(f.produkPromo||[]).length) return 'Pilih minimal satu produk promo';
  const a=hkParseTgl(f.tglMulai), b=hkParseTgl(f.tglSelesai);
  if(!a||!b) return 'Isi tanggal mulai dan selesai';
  if(b<a) return 'Tanggal selesai tidak boleh sebelum tanggal mulai';
  if((f.jamSelesai||'23:59')<=(f.jamMulai||'00:00')) return 'Jam selesai harus setelah jam mulai';
  if(!(f.hari||[]).length) return 'Pilih minimal satu hari';
  if(persen&&f.izinkanKasirUbah){ const bt=hkNum(f.batasKasirPersen); if(!bt) return 'Isi batas potongan yang boleh diubah kasir'; if(bt>100) return 'Batas potongan kasir maksimal 100%'; if(bt<besar) return 'Batas potongan kasir tidak boleh lebih kecil dari potongan promo'; }
  if(persen&&f.maksimalPotongan&&!hkNum(f.maksimalPotonganNominal)) return 'Isi nominal maksimal potongan';
  if(f.promoBerdasarkan==='kuantitas'&&kind==='produk'&&!hkNum(f.minKuantitas)) return 'Isi minimal kuantitas';
  if(!persen&&hkNum(f.minPembelian)&&besar>hkNum(f.minPembelian)) return 'Potongan tidak boleh lebih besar dari minimal pembelian';
  return null; };
window.hkPromoDraf=kind=>{
  const f=kind==='produk'?state.promoProdukForm:state.promoTotalForm; if(!f) return false;
  if(!f.nama.trim()){ toast('Isi nama promo dulu'); return false; }
  const row={nama:f.nama, tipe:f.aktivasi==='otomatis'?'Otomatis':'Manual', ...(kind==='produk'?{produk:(f.produkPromo||[]).join(', ')||'-'}:{}),

/* ════════ LAPORAN ════════ */
function lapRange(){
  const t=hkToday(), p=state.hk.lapPeriode;
  if(p==='hari') return [hkYmd(t),hkYmd(t)];
  if(p==='7') return [hkYmd(hkAddDays(t,-6)),hkYmd(t)];
  if(p==='bulan') return [hkYmd(new Date(t.getFullYear(),t.getMonth(),1)),hkYmd(t)];
  if(p==='30') return [hkYmd(hkAddDays(t,-29)),hkYmd(t)];
  if(p==='rentang') return [state.hk.lapDari||null, state.hk.lapSampai||null];
  return [null,null];
}
function lapTable(head, rows, foot){
  return `<div class="card" style="padding:0;overflow:auto;"><table><thead><tr>${head.map((h,i)=>`<th class="${i?'hk-num':''}">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'hk-num':''}">${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${head.length}" class="hk-empty">Tidak ada penjualan di periode ini</td></tr>`}</tbody>
    ${foot&&rows.length?`<tfoot><tr>${foot.map((c,i)=>`<td class="${i?'hk-num':''}" style="font-weight:700;background:#FAFAF8;">${c}</td>`).join('')}</tr></tfoot>`:''}</table></div>`;
}
function lapData(){
  const [dari,sampai]=lapRange(); const S=hkSales(data(),dari,sampai); const tab=state.hk.lapTab;
  const agg=list=>({n:list.filter(x=>!x.retur).length, qty:hkSum(list,'qty'), kotor:hkSum(list,'kotor'), pot:hkSum(list,'potongan'), bersih:hkSum(list,'bersih'), hpp:hkSum(list,'hpp'), laba:hkSum(list,'laba')});
  const moneyRow=(nama,a)=>[nama,a.n,a.qty,hkRp(a.kotor),hkRp(a.pot),hkRp(a.bersih),hkRp(a.hpp),hkRp(a.laba),a.bersih?Math.round(a.laba/a.bersih*100)+'%':'–'];
  const head=['','Transaksi','Qty','Penjualan Kotor','Potongan','Bersih','HPP','Laba Kotor','Margin'];
  const tot=agg(S);
  if(tab==='saluran'){ const g=hkGroup(S,s=>s.jenis==='Offline'?(s.eventId===HK_GUDANG_ID?`Jual langsung · ${s.saluran}`:`Event · ${s.saluran}`):s.saluran);
    return {head:['Saluran',...head.slice(1)], rows:[...g.entries()].map(([k,l])=>moneyRow(hkEsc(k),agg(l))).sort((a,b)=>b[1]-a[1]), foot:moneyRow('Total',tot), csv:'saluran'}; }
  if(tab==='event'){ const evs=[...state.events, hkTempat(data(),HK_GUDANG_ID)].filter(e=>S.some(s=>s.eventId===e.id));
    return {head:['Event','Transaksi','Qty','Penjualan','Tunai','QRIS','Transfer','Laba Kotor','Selisih Kas'], rows:evs.map(e=>{ const l=S.filter(s=>s.eventId===e.id); const by=m=>hkRp(l.reduce((a,s)=>a+s.bayar.filter(b=>b.metode===m).reduce((x,b)=>x+b.jumlah,0),0));
      const sel=state.posShift.filter(x=>x.eventId===e.id&&x.tutup).reduce((a,x)=>a+hkShiftKas(data(),x).selisih,0);
      return [e.gudang?`${hkEsc(e.nama)} <span class="hk-sub">(jual langsung)</span>`:`<span class="hk-row-link" data-hk-act="ev-open" data-hk-arg="${e.id}" style="color:var(--accent-text);font-weight:600;">${hkEsc(e.nama)}</span>`,l.length,hkSum(l,'qty'),hkRp(hkSum(l,'kotor')),by('Tunai'),by('QRIS'),by('Transfer'),hkRp(hkSum(l,'laba')),`<span style="color:${sel?'var(--danger-text)':'inherit'}">${sel?hkRp(sel):'Pas'}</span>`]; })}; }
  if(tab==='kasir'){ const g=hkGroup(S,s=>s.kasir), inR=w=>{ const d=w.slice(0,10); return (!dari||d>=dari)&&(!sampai||d<=sampai); };
    const nama=[...new Set([...state.staff.map(x=>x.nama), ...g.keys()])].filter(n=>g.has(n)||state.posShift.some(x=>x.kasir===n&&inR(x.buka)));
    const by=(l,m)=>l.reduce((a,s)=>a+s.bayar.filter(b=>b.metode===m).reduce((x,b)=>x+b.jumlah,0),0);
    const rows=nama.map(n=>{ const l=g.get(n)||[], st=state.staff.find(x=>x.nama===n), off=l.filter(s=>s.jenis==='Offline'), on=l.filter(s=>s.jenis==='Online');
      const tempat=[...new Set(off.map(s=>s.saluran))], sh=state.posShift.filter(x=>x.kasir===n&&x.tutup&&inR(x.buka)), sel=sh.reduce((a,x)=>a+hkShiftKas(data(),x).selisih,0);
      const vd=state.posTrx.filter(t=>t.status==='Void'&&t.kasir===n&&inR(t.waktu)).length;
      return {k:hkSum(l,'kotor'), r:[`<div style="min-width:240px;"><b>${hkEsc(n)}</b><div class="hk-sub">${st?st.role.join(', '):''}${tempat.length?' · '+tempat.map(hkEsc).join(', '):''}${on.length?(tempat.length?', ':' · ')+'input online':''}</div></div>`,
        l.length, hkSum(l,'qty'), hkRp(hkSum(l,'kotor')), hkRp(hkSum(off,'kotor')), hkRp(hkSum(on,'kotor')), hkRp(by(off,'Tunai')), hkRp(by(off,'QRIS')+by(off,'Transfer')),
        `${sh.length} shift${sel?` · <span style="color:var(--danger-text);font-weight:700;">${sel>0?'+':''}${hkRp(sel)}</span>`:''}`, vd?`<span style="color:var(--danger-text);font-weight:700;">${vd}</span>`:'0', hkRp(hkSum(l,'laba'))]}; }).sort((a,b)=>b.k-a.k).map(x=>x.r);
    const off=S.filter(s=>s.jenis==='Offline'), on=S.filter(s=>s.jenis==='Online');
    return {head:['Kasir / Admin','Transaksi','Qty','Penjualan','Offline','Online','Tunai','QRIS + Transfer','Shift & Selisih Kas','Void','Laba Kotor'], rows,
      foot:['Total',S.length,hkSum(S,'qty'),hkRp(hkSum(S,'kotor')),hkRp(hkSum(off,'kotor')),hkRp(hkSum(on,'kotor')),hkRp(by(off,'Tunai')),hkRp(by(off,'QRIS')+by(off,'Transfer')),'',state.posTrx.filter(t=>t.status==='Void'&&inR(t.waktu)).length,hkRp(hkSum(S,'laba'))]}; }
  if(tab==='produk'){ const m=new Map(); S.forEach(s=>s.items.forEach(i=>{ const k=i.sku; if(!m.has(k)) m.set(k,{nama:i.nama,qty:0,kotor:0,hpp:0,off:0,on:0}); const x=m.get(k); x.qty+=i.qty; x.kotor+=i.qty*i.harga; x.hpp+=i.qty*(i.hpp||0); if(s.jenis==='Offline') x.off+=i.qty; else x.on+=i.qty; }));
    const rows=[...m.entries()].sort((a,b)=>b[1].qty-a[1].qty).map(([sku,x])=>[`${hkEsc(x.nama)}<div class="hk-sub">${sku}</div>`,x.qty,x.off,x.on,hkRp(x.kotor),hkRp(x.hpp),hkRp(x.kotor-x.hpp),hkStokRow(state.stokItems,sku)?hkStokRow(state.stokItems,sku).akhir:'–']);
    return {head:['Produk','Qty','Di Event','Online','Penjualan','HPP','Laba Kotor','Sisa Stok'], rows}; }
  const g=hkGroup(S,s=>s.waktu.slice(0,10));
  return {head:['Tanggal','Transaksi','Qty','Penjualan Kotor','Potongan','Bersih','HPP','Laba Kotor','Margin'], rows:[...g.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([d,l])=>moneyRow(hkTgl(d),agg(l))), foot:moneyRow('Total',tot)};
}

viewProdukList=function(){
  const h=state.hk, q=h.prodSearch.toLowerCase();
  let list=state.products.map((p,i)=>({p,i}));
  if(h.prodTab==='pos') list=list.filter(x=>x.p.tampilPos!==false&&x.p.status==='Aktif');
  if(h.prodTab==='tidak') list=list.filter(x=>!(x.p.tampilPos!==false&&x.p.status==='Aktif'));
  if(h.prodKat) list=list.filter(x=>x.p.kategori===h.prodKat);
  if(q) list=list.filter(x=>x.p.nama.toLowerCase().includes(q)||x.p.sku.toLowerCase().includes(q));
  const lok=lokasiTerpilih();
  const stokOf=sku=>lok?hkStokDi(state.stokItems,sku,lok):(hkStokRow(state.stokItems,sku)||{akhir:0}).akhir;
  const rows=list.map(({p,i})=>{
    const vs=p.varian&&p.varian.length?p.varian:null;
    const harga=vs?(()=>{ const a=vs.map(v=>+v.jual); const mn=Math.min(...a), mx=Math.max(...a); return mn===mx?hkRp(mn):`${hkRp(mn)} – ${hkRp(mx)}`; })():hkRp(p.jual);
    const minJual=vs?Math.min(...vs.map(v=>+v.jual)):+p.jual;
    const margin=minJual?Math.round((minJual-p.modal)/minJual*100):0;
    const stok=vs?vs.reduce((a,v)=>a+stokOf(v.sku),0):stokOf(p.sku);
    let row=`<tr><td>${vs?`<span class="chevron" data-toggle-varian="${i}" style="display:inline-block;transform:rotate(${p.expanded?90:0}deg);">›</span>`:''}</td>
      <td><span class="hk-row-link" data-hk-act="prod-edit" data-hk-arg="${i}" style="font-weight:600;">${hkEsc(p.nama)}</span>${vs?`<div class="hk-sub">${vs.length} varian</div>`:''}</td><td>${p.sku}</td><td>${hkEsc(p.kategori)}</td>
      <td class="hk-num">${hkRp(p.modal)}</td><td class="hk-num">${harga}</td><td class="hk-num">${margin}%</td><td class="hk-num" style="${stok<=(p.stokMin||0)?'color:var(--danger-text);font-weight:700;':''}">${stok}</td>
      <td>${mpProduk(p).map(n=>`<span class="badge badge-mp">${hkEsc(n)}</span>`).join(' ')||'<span class="hk-sub">–</span>'}</td><td>${tg('products.'+i+'.tampilPos',p.tampilPos!==false)}</td><td><span class="badge ${p.status==='Aktif'?'badge-success':'badge-warn'}">${p.status}</span></td></tr>`;
    if(vs&&p.expanded) vs.forEach(v=>{ row+=`<tr class="varian-row"><td></td><td style="padding-left:26px;">${hkEsc(v.nama)}</td><td>${v.sku}</td><td></td><td></td><td class="hk-num">${hkRp(v.jual)}</td><td></td><td class="hk-num">${stokOf(v.sku)}</td><td>${state.marketplaceChannels.filter(ch=>ch.produk.some(x=>x.sku===v.sku)).map(ch=>{ const e=ch.produk.find(x=>x.sku===v.sku); return `<span class="hk-sub">${hkEsc(ch.nama)} ${hkRp(e.hargaJual)}</span>`; }).join('<br>')}</td><td></td><td></td></tr>`; });
    return row; }).join('');
  return `<div class="page-head"><span class="page-title">Daftar Produk</span><div class="spacer"></div><button class="btn" data-hk-act="harga-open" data-hk-arg="gudang">Harga Jual Langsung Gudang${Object.keys(state.posSettings.hargaGudang||{}).length?` (${Object.keys(state.posSettings.hargaGudang).length})`:''}</button><button class="btn btn-primary" data-hk-act="prod-new">+ Tambah Produk</button></div>
  <div class="page-sub">${state.products.length} produk · Stok: ${lok?hkEsc(lok):'semua lokasi'} · Klik nama produk untuk mengubah</div>
  <div class="toolbar"><input class="search-input" placeholder="Cari nama atau SKU..." value="${hkEsc(h.prodSearch)}" data-hk-bind="hk.prodSearch" data-hk-live="1"><select class="btn" data-hk-bind="hk.prodKat"><option value="">Semua Kategori</option>${categoryNames().map(c=>`<option ${h.prodKat===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="tabs">${[['semua','Semua'],['pos','Tampil di POS'],['tidak','Tidak Tampil di POS']].map(([k,l])=>`<div class="tab ${h.prodTab===k?'active':''}" data-hk-act="prod-tab" data-hk-arg="${k}">${l}</div>`).join('')}</div>
  <div class="card" style="padding:0;overflow:hidden;"><table><thead><tr><th></th><th>Nama Produk</th><th>SKU</th><th>Kategori</th><th class="hk-num">HPP</th><th class="hk-num">Harga Jual</th><th class="hk-num">Margin</th><th class="hk-num">Stok</th><th>Marketplace</th><th>Tampil di POS</th><th>Status</th></tr></thead><tbody>${rows||`<tr><td colspan="11" class="hk-empty">Tidak ada produk</td></tr>`}</tbody></table></div>`;
};

window.hkDiSaluran=(saluran,sku)=>{ const ch=state.marketplaceChannels.find(m=>m.nama===saluran); return !ch||ch.produk.some(x=>x.sku===sku); };
function mpDari(p){ const cat=p?hkCatalog([p]):[];
  return state.marketplaceChannels.map(ch=>{ const harga={}; let aktif=false;
    cat.forEach(c=>{ const e=ch.produk.find(x=>x.sku===c.sku); if(!e) return; aktif=true; const key=p.varian&&p.varian.length?'v'+p.varian.findIndex(v=>v.sku===c.sku):'p'; if(+e.hargaJual!==c.harga) harga[key]=String(e.hargaJual); });
    return {aktif, harga}; }); }
/* impor pesanan: SKU yang belum terdaftar di marketplace tujuan */
window.hkMpBelum=()=>{ const im=state.po&&state.po.importer; if(!im||!im.orders) return []; const ch=state.marketplaceChannels.find(m=>m.nama===im.saluran); if(!ch) return [];
  const out=new Map(); im.orders.forEach(o=>{ if(!o.include||o.duplikat||o.batal) return; hkPOImpor.resolvedLines(o).forEach(l=>{ if(!ch.produk.some(x=>x.sku===l.sku)&&!out.has(l.sku)) out.set(l.sku,{sku:l.sku, nama:l.nama, hargaFile:+l.harga||0, pesanan:0}); if(out.has(l.sku)) out.get(l.sku).pesanan++; }); });
  return [...out.values()]; };
window.hkMpBelumHTML=()=>{ const b=hkMpBelum(); if(!b.length) return ''; const sal=state.po.importer.saluran;
  return `<div class="po-unknown" style="background:#FFF6E5;border-color:#F5D9A8;"><b>${b.length} produk belum terdaftar di ${hkEsc(sal)}:</b> ${b.map(x=>hkEsc(x.nama)).join(', ')}. Daftarkan harga ${hkEsc(sal)}-nya dulu. Setelah disimpan, file ini langsung diimpor.
    <div style="margin-top:8px;"><button class="btn btn-primary" data-hk-act="mpreg-open">Daftarkan harga ${hkEsc(sal)}</button></div></div>`; };
function mpregModal(){
  const sal=state.po.importer.saluran, b=hkMpBelum(), m=state.hk.modal, cat=hkCatalog(state.products);
  return `<div class="confirm-box hk-modal hk-page"><div class="hk-mh"><span class="close" data-hk-act="modal-close">✕</span><h4>Daftarkan harga ${hkEsc(sal)}</h4></div>

    ${b.map(x=>{ const c=cat.find(k=>k.sku===x.sku); return `<tr><td>${hkEsc(x.nama)}<div class="hk-sub">${x.sku} · ${x.pesanan} baris di file</div></td><td class="hk-num">${hkRp(c?c.harga:0)}</td><td class="hk-num">${hkRp(x.hargaFile)}</td>

function saveProduk(){
  const f=state.hk.prodForm, baru=f.index==null;
  if(!f.nama.trim()||!f.kategori||!f.sku.trim()||f.modal===''||(f.jual===''&&!f.varianAktif)){ toast('Lengkapi nama, kategori, SKU, HPP, dan harga jual'); return; }
  const sku=f.sku.trim().toUpperCase();
  if(baru&&state.products.some(p=>p.sku===sku)){ toast('SKU sudah dipakai produk lain'); return; }
  const varian=f.varianAktif?f.varian.filter(v=>v.nama.trim()).map(v=>({nama:v.nama.trim(), sku:(v.sku.trim()||`${sku}-${v.nama}`).toUpperCase().replace(/[^A-Z0-9-]+/g,'-'), jual:Number(v.jual||f.jual)||0})):null;
  if(f.varianAktif&&(!varian.length||varian.some(v=>!v.jual))){ toast('Isi minimal satu varian beserta harganya'); return; }
  const prod={nama:f.nama.trim(), sku, kategori:f.kategori, satuan:f.satuan, modal:Number(f.modal)||0, beli:Number(f.modal)||0, jual:varian?null:Number(f.jual)||0,
    status:f.aktif?'Aktif':'Nonaktif', tampilPos:f.tampilPos, stokMin:Number(f.stokMin)||0, deskripsi:f.deskripsi, varian:varian||undefined};
  if(baru) state.products.unshift(prod); else Object.assign(state.products[f.index], prod);
  hkCatalog([prod]).forEach((c,ci)=>{
    let it=hkStokRow(state.stokItems,c.sku);
    if(!it){ it={sku:c.sku, nama:c.nama, parent:c.parent, jenis:'Produk', kategori:c.kategori, awal:0, masuk:0, terjual:0, akhir:0, keluar:0, terbuang:0, terproduksi:0, transit:0, satuan:prod.satuan, perOutlet:[]}; state.stokItems.unshift(it); }
    it.nama=c.nama; it.kategori=c.kategori;
    const awal=Number(baru?(varian?f.stokAwal['v'+f.varian.findIndex(v=>v.nama.trim()===c.varNama)]:f.stokAwal.p):0)||0;
    if(awal){ const p=hkPO(it,HK_GUDANG); p.awal+=awal; p.akhir+=awal; it.awal+=awal; it.akhir+=awal; }
  });
  const catP=hkCatalog([prod]), skusP=new Set([sku,...catP.map(c=>c.sku)]);
  state.marketplaceChannels.forEach((ch,ci)=>{ ch.produk=ch.produk.filter(x=>!skusP.has(x.sku)); const m=f.mp&&f.mp[ci]; if(!m||!m.aktif) return;
    catP.forEach(c=>{ const key=varian?'v'+f.varian.findIndex(v=>v.nama.trim()===c.varNama):'p'; ch.produk.push({sku:c.sku, nama:c.nama, satuan:prod.satuan, hargaAwal:c.harga, hargaJual:Number(m.harga[key])||c.harga}); }); });
  state.hk.prodForm=null; state.view='produk-list'; toast(baru?'Produk ditambahkan dan langsung tersedia di POS':'Produk diperbarui'); render();
}

    case 'staff-edit': { if(!ownerLogin()){ toast('Hanya Owner yang bisa mengubah karyawan'); return; } const s=state.staff[+arg]; H.staffForm={index:+arg,nama:s.nama,telp:s.telp||'',email:s.email||'',role:[...s.role],pw:'',pin:'',resetPw:false,resetPin:false,aktif:s.aktif!==false}; H.modal={type:'staff'}; render(); break; }
    case 'staff-role': { const r=H.staffForm.role, i=r.indexOf(arg); if(i>-1) r.splice(i,1); else r.push(arg); render(); break; }
    case 'staff-acak': if(arg==='pw') H.staffForm.pw=acakPw(); else H.staffForm.pin=acakPin(); render(); break;
    case 'staff-reset': if(arg==='pw'){ H.staffForm.resetPw=true; H.staffForm.pw=acakPw(); } else { H.staffForm.resetPin=true; H.staffForm.pin=acakPin(); } render(); break;
    case 'staff-save': { if(!ownerLogin()){ toast('Hanya Owner yang bisa menyimpan karyawan'); return; }
      const f=H.staffForm, baru=f.index==null, lama=baru?null:state.staff[f.index], nama=(f.nama||'').trim(), dash=f.role.some(r=>r==='Admin'||r==='Owner'), email=(f.email||'').trim().toLowerCase();
      const perluPw=dash&&(baru||f.resetPw||!lama.pw), perluPin=baru||f.resetPin;
      const salah=(id,msg)=>{ document.querySelectorAll('.hk-invalid').forEach(x=>x.classList.remove('hk-invalid')); const el=document.getElementById(id); if(el) el.classList.add('hk-invalid'); toast(msg); };
      if(!nama) return salah('hkStNama','Isi nama karyawan');
      if(state.staff.some((x,i)=>x.nama.toLowerCase()===nama.toLowerCase()&&i!==f.index)) return salah('hkStNama','Nama karyawan sudah ada');
      if(!f.role.length){ toast('Pilih minimal satu role'); return; }
      if(dash){ if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return salah('hkStEmail','Isi email yang benar');
        if(state.staff.some((x,i)=>(x.email||'').toLowerCase()===email&&i!==f.index)) return salah('hkStEmail','Email sudah dipakai karyawan lain'); }
      if(perluPw){ const e=hkPwLemah(f.pw); if(e) return salah('hkStPw',e); }
      if(perluPin){ const e=hkPinLemah(f.pin,state.staff,lama&&lama.nama); if(e) return salah('hkStPin',e); }
      const sisaOwner=state.staff.filter((x,i)=>i!==f.index&&x.aktif!==false&&x.role.includes('Owner')).length;
      if(!baru&&lama.role.includes('Owner')&&(!f.role.includes('Owner')||!f.aktif)&&!sisaOwner){ toast('Harus ada minimal satu Owner yang aktif'); return; }
      const d=baru?{pwBaru:false, pinBaru:true}:{...lama};
      Object.assign(d,{nama, telp:f.telp, role:f.role, email:dash?email:'', aktif:f.aktif});
      if(!dash){ d.pw=''; d.pwBaru=false; }
      if(perluPw){ d.pw=hkHashPw(f.pw); d.pwBaru=true; }
      if(perluPin){ d.pin=f.pin; d.pinBaru=true; }
      if(baru) state.staff.push(d); else { if(lama.nama!==nama){ state.events.forEach(ev=>{ ev.kasir=ev.kasir.map(k=>k===lama.nama?nama:k); if(ev.pj===lama.nama) ev.pj=nama; }); } state.staff[f.index]=d; }
      if(!baru&&akunSesi()&&akunSesi().nama===lama.nama&&lama.nama!==nama) localStorage.setItem(DASH_KEY, JSON.stringify({...akunSesi(), nama}));
      H.staffForm=null; hkSaveAll(data());
      if(perluPw||perluPin){ H.modal={type:'staffinfo', nama, email:perluPw?email:'', pw:perluPw?f.pw:'', pin:perluPin?f.pin:''}; }
      else H.modal=null;
      toast(baru?`${nama} terdaftar`:'Karyawan disimpan'); render(); break; }
  }
});

  if(rg) rg.textContent=d<0?hkRp(-d*(+i.dataset.hpp||0)):'–'; i.style.borderColor=d<0?'var(--danger-text)':d>0?'var(--success-text)':''; });

/* ════════ STOK TERBUANG ════════ */
const TB_JENIS=['Hilang di perjalanan','Selisih opname','Barang cacat (retur)','Dicatat manual'];
const TB_ALASAN=['Rusak','Hilang','Cacat dari pemasok','Berjamur atau lembap','Lainnya'];
function ivTerbuang(){
  const out=[], O=state.posOpname, dipakai=new Set(O.filter(o=>o.jenis==='Tutup Event'&&o.dariSO).map(o=>o.dariSO));
  state.mutasi.filter(m=>m.status==='Diterima'&&m.items.some(i=>(i.diterima||0)<i.dikirim)).forEach(m=>out.push({waktu:m.tglTerima, jenis:'Hilang di perjalanan', no:m.no, lokasi:m.ke,
    items:m.items.filter(i=>(i.diterima||0)<i.dikirim).map(i=>({sku:i.sku, nama:i.nama, qty:i.dikirim-(i.diterima||0)})), penjelasan:m.catatan||'Barang kurang saat diterima kasir di booth', oleh:m.penerima||'-'}));
  O.filter(o=>(o.status==='Disetujui'&&!dipakai.has(o.no)||o.jenis==='Tutup Event'||o.status==='Berhasil')&&o.produk.some(p=>p.selisih<0)).forEach(o=>out.push({waktu:o.disetujui?o.disetujui.waktu:o.waktu, jenis:'Selisih opname', no:o.no, lokasi:o.lokasi,
    items:o.produk.filter(p=>p.selisih<0).map(p=>({sku:p.sku, nama:p.nama, qty:-p.selisih})), penjelasan:(o.tanggungJawab&&o.tanggungJawab.alasan)||o.catatan||'Selisih stok opname', oleh:o.disetujui?o.disetujui.oleh:o.oleh, pj:o.tanggungJawab&&o.tanggungJawab.pj}));
  hkReturList(data()).forEach(r=>out.push({waktu:r.waktu, jenis:'Barang cacat (retur)', no:r.no, lokasi:r.lokasi, items:r.items.map(i=>({sku:i.sku, nama:i.nama, qty:i.qty})), penjelasan:r.alasan, oleh:`${r.oleh} · disetujui ${r.disetujui}`, foto:r.foto,
    trxNo:r.trx.no, penyelesaian:r.cara==='Tukar barang'?'Tukar barang sama':`Uang kembali ${hkRp(r.nilai)} (${r.metode==='Tunai'?'tunai dari laci':'transfer'})`, uang:r.cara==='Uang kembali'?r.nilai:0}));
  state.terbuang.forEach(t=>out.push({waktu:t.waktu, jenis:'Dicatat manual', no:t.no, lokasi:t.lokasi, items:t.items, penjelasan:`${t.alasan}: ${t.penjelasan}`, oleh:t.oleh, foto:t.foto, pj:t.tanggungJawab&&t.tanggungJawab.pj,
    penyelesaian:t.tanggungJawab?(t.tanggungJawab.status||'Belum diselesaikan'):''}));
  out.forEach(x=>{ x.qty=x.items.reduce((a,i)=>a+i.qty,0); x.nilai=x.items.reduce((a,i)=>a+i.qty*ivHpp(i.sku),0); });
  return out.sort((a,b)=>b.waktu.localeCompare(a.waktu)); }
function viewStokTerbuang(){
  const I=IV(); if(I.tDari==null){ I.tDari=''; I.tSampai=''; }
  const all=ivTerbuang(), L=all.filter(x=>(!I.tJenis||x.jenis===I.tJenis)&&(!I.tLok||x.lokasi===I.tLok)&&ivDalam(x.waktu.slice(0,10),I.tDari,I.tSampai));
  const lokasi=[...new Set(all.map(x=>x.lokasi))];
  return `<div class="page-head"><span class="page-title">Stok Terbuang</span><div class="spacer"></div><button class="btn" data-inv="t-csv">⭳ Unduh CSV</button><button class="btn btn-primary" data-inv="t-baru">+ Catat Barang Terbuang</button></div>
  <div class="page-sub">Semua barang yang keluar dari stok tanpa terjual, lengkap dengan penjelasannya. Tercatat otomatis dari kiriman yang kurang, selisih opname, dan retur barang cacat dari POS (beserta penyelesaiannya: tukar barang atau uang kembali). Kerusakan lain (misalnya rusak di gudang) dicatat manual dan wajib diberi penjelasan.</div>
  <div class="hk-kpis">
    <div class="metric-card"><div class="metric-label">Total terbuang</div><div class="metric-value">${L.reduce((a,x)=>a+x.qty,0)} pcs</div><div class="hk-sub">${L.length} catatan</div></div>
    <div class="metric-card"><div class="metric-label">Nilai (HPP)</div><div class="metric-value" style="color:var(--danger-text);">${hkRp(L.reduce((a,x)=>a+x.nilai,0))}</div></div>
    <div class="metric-card"><div class="metric-label">Barang cacat (retur)</div><div class="metric-value">${L.filter(x=>x.jenis==='Barang cacat (retur)').reduce((a,x)=>a+x.qty,0)} pcs</div><div class="hk-sub">uang kembali ${hkRp(L.reduce((a,x)=>a+(x.uang||0),0))}</div></div>
    <div class="metric-card"><div class="metric-label">Paling sering terbuang</div>${(()=>{ const per={}; L.forEach(x=>x.items.forEach(i=>per[i.nama]=(per[i.nama]||0)+i.qty)); const t=Object.entries(per).sort((a,b)=>b[1]-a[1])[0]; return t?`<div class="metric-value" style="font-size:16px;">${hkEsc(t[0])}</div><div class="hk-sub">${t[1]} pcs</div>`:'<div class="metric-value">–</div>'; })()}</div>
  </div>
  <div class="toolbar" style="flex-wrap:wrap;gap:8px;"><select class="hk-sel" style="width:auto;" data-hk-bind="hk.inv.tJenis" data-hk-live="1"><option value="">Semua jenis</option>${TB_JENIS.map(j=>`<option ${I.tJenis===j?'selected':''}>${j}</option>`).join('')}</select>
    <select class="hk-sel" style="width:auto;" data-hk-bind="hk.inv.tLok" data-hk-live="1"><option value="">Semua lokasi</option>${lokasi.map(l=>`<option ${I.tLok===l?'selected':''}>${hkEsc(l)}</option>`).join('')}</select>${ivRentang('hk.inv.tDari','hk.inv.tSampai')}</div>
  <div class="card" style="padding:0;overflow:auto;"><table><thead><tr><th>Waktu</th><th>Jenis</th><th>Sumber</th><th>Lokasi</th><th>Barang</th><th class="hk-num">Nilai</th><th>Penjelasan</th><th>Penyelesaian</th><th>Dicatat oleh</th></tr></thead><tbody>

function viewDaftarStok(){
  const I=IV(); if(I.sDari==null){ I.sDari=ivAwalBulan(); I.sSampai=ivToday(); }
  const evs=state.events.filter(e=>!e.ditutup), q=(I.sCari||'').toLowerCase();
  const prodOf=sku=>state.products.find(p=>p.sku===sku||(p.varian||[]).some(v=>v.sku===sku))||{};
  let L=ivCat().filter(c=>(!q||c.nama.toLowerCase().includes(q)||c.sku.toLowerCase().includes(q))&&(!I.sKat||c.kategori===I.sKat)).map(c=>{ const it=hkStokRow(state.stokItems,c.sku)||{}, g=gdStok(c.sku), per=evs.map(e=>hkStokDi(state.stokItems,c.sku,e.nama)), tr=it.transit||0;
    const total=g+per.reduce((a,b)=>a+b,0)+tr, min=+prodOf(c.sku).stokMin||0; return {c, g, per, tr, total, min, kurang:min&&total<min}; });
  if(I.sMin) L=L.filter(x=>x.kurang);
  const kats=[...new Set(ivCat().map(c=>c.kategori))], nKurang=ivCat().length?L.filter(x=>x.kurang).length:0;
  const tab=t=>`<div class="tab ${I.sTab===t[0]?'active':''}" data-inv="s-tab" data-inv-arg="${t[0]}">${t[1]}</div>`;
  const filter=`<div class="toolbar" style="flex-wrap:wrap;gap:8px;"><input class="search-input" style="max-width:260px;" placeholder="Cari SKU atau nama..." data-hk-bind="hk.inv.sCari" data-hk-live="1" value="${hkEsc(I.sCari||'')}">
    <select class="hk-sel" style="width:auto;" data-hk-bind="hk.inv.sKat" data-hk-live="1"><option value="">Semua kategori</option>${kats.map(k=>`<option ${I.sKat===k?'selected':''}>${hkEsc(k)}</option>`).join('')}</select>
    ${I.sTab==='lokasi'?`<label class="hk-check ${I.sMin?'on':''}" style="padding:6px 10px;" data-inv="s-min"><input type="checkbox" ${I.sMin?'checked':''} style="pointer-events:none;"><span>Hanya di bawah stok minimum</span></label>`:ivRentang('hk.inv.sDari','hk.inv.sSampai')}</div>`;
  let body;
  if(I.sTab==='lokasi'){
    const sum=k=>L.reduce((a,x)=>a+x[k],0);
    body=`<div class="card" style="padding:0;overflow:auto;"><table><thead><tr><th>SKU</th><th>Nama</th><th class="hk-num">${HK_GUDANG}</th>${evs.map(e=>`<th class="hk-num">${hkEsc(e.nama)}</th>`).join('')}<th class="hk-num">Dalam perjalanan</th><th class="hk-num">Total</th><th class="hk-num">Stok min</th><th>Status</th></tr></thead><tbody>
      ${L.map(x=>`<tr><td>${x.c.sku}</td><td>${hkEsc(x.c.nama)}</td><td class="hk-num">${x.g}</td>${x.per.map(n=>`<td class="hk-num">${n||'–'}</td>`).join('')}<td class="hk-num">${x.tr||'–'}</td><td class="hk-num"><b>${x.total}</b></td><td class="hk-num">${x.min||'–'}</td><td>${x.kurang?ivBadge('Di bawah minimum','badge-danger'):x.total===0?ivBadge('Habis','badge-mut'):ivBadge('Aman','badge-success')}</td></tr>`).join('')||`<tr><td colspan="${6+evs.length}" class="hk-empty">Tidak ada barang pada filter ini</td></tr>`}
      ${L.length?`<tr style="font-weight:700;background:var(--bg);"><td colspan="2">Total</td><td class="hk-num">${sum('g')}</td>${evs.map((e,k)=>`<td class="hk-num">${L.reduce((a,x)=>a+x.per[k],0)}</td>`).join('')}<td class="hk-num">${sum('tr')}</td><td class="hk-num">${sum('total')}</td><td colspan="2"></td></tr>`:''}</tbody></table></div>`;
  } else {
    const D=data(), dari=I.sDari, sampai=I.sSampai;
    const masuk={}, kirim={}, jual={}, buang={};
    state.faktur.filter(f=>!f.batal&&ivDalam(f.tanggal,dari,sampai)).forEach(f=>f.items.forEach(i=>masuk[i.sku]=(masuk[i.sku]||0)+i.qty));
    state.mutasi.filter(m=>m.status!=='Batal'&&ivDalam(m.tglKirim.slice(0,10),dari,sampai)).forEach(m=>m.items.forEach(i=>kirim[i.sku]=(kirim[i.sku]||0)+i.dikirim));
    hkSales(D,dari,sampai).forEach(s=>s.items.forEach(i=>{ if(i.sku) jual[i.sku]=(jual[i.sku]||0)+i.qty; }));
    ivTerbuang().filter(x=>ivDalam(x.waktu.slice(0,10),dari,sampai)).forEach(x=>x.items.forEach(i=>buang[i.sku]=(buang[i.sku]||0)+i.qty));
    body=`<div class="card" style="padding:0;overflow:auto;"><table><thead><tr><th>SKU</th><th>Nama</th><th class="hk-num">Masuk (pembelian)</th><th class="hk-num">Dikirim ke event</th><th class="hk-num">Terjual</th><th class="hk-num">Hilang & rusak</th><th class="hk-num">Stok sekarang</th></tr></thead><tbody>
      ${L.map(x=>`<tr><td>${x.c.sku}</td><td>${hkEsc(x.c.nama)}</td><td class="hk-num">${masuk[x.c.sku]||'–'}</td><td class="hk-num">${kirim[x.c.sku]||'–'}</td><td class="hk-num">${jual[x.c.sku]||'–'}</td><td class="hk-num" style="${buang[x.c.sku]?'color:var(--danger-text);':''}">${buang[x.c.sku]||'–'}</td><td class="hk-num"><b>${x.total}</b></td></tr>`).join('')}</tbody></table></div>
      <div class="hk-sub" style="margin-top:6px;">Terjual mencakup event, gudang, dan marketplace, dikurangi retur uang kembali. Hilang & rusak dari halaman Stok Terbuang.</div>`;
  }
  return `<div class="page-head"><span class="page-title">Daftar Stok</span><div class="spacer"></div><button class="btn" data-inv="s-csv">⭳ Unduh CSV</button></div>
  <div class="page-sub">Stok per lokasi: ${HK_GUDANG}, setiap event yang masih berjalan, dan barang yang sedang dikirim. ${nKurang?`<b style="color:var(--danger-text);">${nKurang} barang di bawah stok minimum.</b>`:''}</div>
  <div class="tabs">${tab(['lokasi','Per lokasi'])}${tab(['gerak','Pergerakan'])}</div>${filter}${body}`;
}

const _pilihDefInv=pilihDef;

  if(M.ctx==='faktur'){ const f=IV().faktur;

      simpan:keys=>{ const lama=f.items.filter(i=>keys.includes(i.sku)); keys.filter(k=>!lama.some(i=>i.sku===k)).forEach(k=>lama.push({sku:k, nama:(ivCat().find(c=>c.sku===k)||{}).nama, qty:'', harga:''})); f.items=lama; } }; }
  if(M.ctx==='terbuang'){ const t=IV().tb;

      rows:ivCat().filter(c=>hkStokDi(state.stokItems,c.sku,t.lokasi)>0).map(c=>varRow(c,[hkStokDi(state.stokItems,c.sku,t.lokasi), hkRp(c.hpp)])),
      simpan:keys=>{ const lama=t.items.filter(i=>keys.includes(i.sku)); keys.filter(k=>!lama.some(i=>i.sku===k)).forEach(k=>lama.push({sku:k, nama:(ivCat().find(c=>c.sku===k)||{}).nama, qty:1})); t.items=lama; } }; }

/* total faktur & selisih opname dihitung langsung saat mengetik */
document.addEventListener('input',e=>{ const t=e.target; if(!t.classList) return;
  if(t.classList.contains('iv-og')) hitungOg();
  if(t.hasAttribute('data-iv-f')){ const f=IV().faktur; if(!f) return; let tot=0; f.items.forEach((i,k)=>{ const s=(+i.qty||0)*(+i.harga||0); tot+=s; const el=document.getElementById('ivFSub-'+k); if(el) el.textContent=hkRp(s); }); const el=document.getElementById('ivFTotal'); if(el) el.textContent=hkRp(tot); const dp=document.getElementById('ivFDp'); if(dp) dp.max=Math.max(0,tot-1); }
  if(t.classList.contains('hk-invalid')) t.classList.remove('hk-invalid'); });
document.addEventListener('change',e=>{ if(e.target.id!=='ivTFoto') return; const fl=e.target.files[0]; if(!fl) return; const img=new Image(); img.onload=()=>{ const k=Math.min(1,480/Math.max(img.width,img.height)), cv=document.createElement('canvas'); cv.width=img.width*k; cv.height=img.height*k; cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); IV().tb.foto=cv.toDataURL('image/jpeg',.6); render(); }; img.src=URL.createObjectURL(fl); });

const ivTandai=(ids,msg)=>{ document.querySelectorAll('.hk-invalid').forEach(x=>x.classList.remove('hk-invalid')); ids.forEach(id=>{ const el=document.getElementById(id); if(el) el.classList.add('hk-invalid'); }); const f=document.querySelector('.hk-invalid'); if(f) f.scrollIntoView({block:'center',behavior:'smooth'}); toast(msg); };
const ivOwner=()=>{ const a=akun(); return !!a&&a.role.includes('Owner'); };

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-inv]'); if(!el) return; const act=el.getAttribute('data-inv'), arg=el.getAttribute('data-inv-arg'), I=IV(), H=state.hk;
  switch(act){
    /* faktur */
    case 'f-tab': I.fTab=arg; render(); break;
    case 'f-baru': I.faktur=fakturBaru(); state.view='faktur-form'; render(); break;
    case 'f-batal': I.faktur=null; state.view='faktur-list'; render(); break;
    case 'f-hapus': I.faktur.items.splice(+arg,1); render(); break;
    case 'f-bayar': I.faktur.bayarStatus=arg; render(); break;
    case 'f-simpan': { const f=I.faktur, salah=[]; let msg='';
      const add=(c,id,m)=>{ if(c){ salah.push(id); msg=msg||m; } };
      add(!f.tanggal,'ivFTgl','Isi tanggal faktur'); add(!f.pemasokId,'ivFSup','Pilih pemasok');
      add(!f.items.length,'ivFBarang','Tambahkan barang lewat + Produk');
      add(f.items.some(i=>!(+i.qty>0)),'ivFBarang','Isi jumlah setiap barang'); add(f.items.some(i=>!(+i.harga>0)),'ivFBarang','Isi harga beli setiap barang');
      const total=f.items.reduce((a,i)=>a+(+i.qty||0)*(+i.harga||0),0), dp=+f.uangMuka||0;
      if(f.bayarStatus!=='Lunas'){ add(!f.jatuhTempo,'ivFTempo','Isi tanggal jatuh tempo'); add(f.jatuhTempo&&f.jatuhTempo<f.tanggal,'ivFTempo','Jatuh tempo tidak boleh sebelum tanggal faktur'); add(dp>=total&&total>0,'ivFDp','Uang muka harus lebih kecil dari total. Pilih Lunas kalau dibayar penuh'); }
      if(salah.length){ ivTandai(salah, salah.length>1?`${msg}. Masih ada isian lain yang ditandai merah`:msg); return; }
      const rec={no:f.no, tanggal:f.tanggal, pemasokId:f.pemasokId, items:f.items.map(i=>({sku:i.sku, nama:i.nama, qty:Math.round(+i.qty), harga:Math.round(+i.harga)})), total, jatuhTempo:f.bayarStatus==='Lunas'?null:f.jatuhTempo, catatan:(f.catatan||'').trim(), oleh:akunNama(), waktu:hkIso(new Date()),
        bayar:f.bayarStatus==='Lunas'?[{tanggal:f.tanggal, jumlah:total, cara:f.cara, catatan:'Lunas saat faktur dicatat', oleh:akunNama()}]:dp>0?[{tanggal:f.tanggal, jumlah:dp, cara:f.cara, catatan:'Uang muka', oleh:akunNama()}]:[]};
      hkTerimaFaktur(data(), rec); I.faktur=null; hkSaveAll(data()); state.view='faktur-list'; render();
      toast(`${rec.no} tersimpan. ${rec.items.reduce((a,i)=>a+i.qty,0)} pcs masuk ${HK_GUDANG}${rec.hpp.length?`, HPP ${rec.hpp.map(h=>h.produk).join(', ')} diperbarui`:''}`); break; }
    case 'f-buka': H.modal={type:'faktur', no:arg, jumlah:'', tanggal:ivToday(), cara:'Transfer', catatan:''}; render(); break;
    case 'f-batalkan': H.modal.batalMode=true; H.modal.alasanBatal=''; render(); break;
    case 'f-batal-tidak': H.modal.batalMode=false; render(); break;
    case 'f-batal-ok': { const M=H.modal, f=state.faktur.find(x=>x.no===M.no), al=(M.alasanBatal||'').trim();
      if(hkFakturKurang(data(),f).length){ toast('Sebagian barang sudah terpakai, faktur tidak bisa dibatalkan'); return; }
      if(al.length<5){ ivTandai(['ivFBatalAlasan'],'Tulis alasan pembatalan'); return; }
      hkBatalFaktur(data(), f, al, akunNama()); M.batalMode=false; hkSaveAll(data()); render();
      toast(`${f.no} dibatalkan. Stok ${HK_GUDANG} berkurang ${f.items.reduce((a,i)=>a+i.qty,0)} pcs${f.batal.hpp.length?', HPP dihitung ulang':''}`); break; }
    case 'f-lunasi': { const f=state.faktur.find(x=>x.no===H.modal.no); H.modal.jumlah=String(hkFakturSisa(f)); render(); break; }
    case 'f-bayar-simpan': { const M=H.modal, f=state.faktur.find(x=>x.no===M.no), j=Math.round(+M.jumlah||0), sisa=hkFakturSisa(f);
      if(!(j>0)){ toast('Isi jumlah pembayaran'); return; } if(j>sisa){ toast(`Maksimal ${hkRp(sisa)} (sisa tagihan)`); return; } if(!M.tanggal){ toast('Isi tanggal pembayaran'); return; }
      f.bayar.push({tanggal:M.tanggal, jumlah:j, cara:M.cara, catatan:(M.catatan||'').trim(), oleh:akunNama()}); hkSaveAll(data());
      M.jumlah=''; M.catatan=''; render(); toast(hkFakturSisa(f)?`Pembayaran ${hkRp(j)} tercatat. Sisa ${hkRp(hkFakturSisa(f))}`:`Faktur ${f.no} lunas`); break; }
    /* pemasok */
    case 'p-baru': I.pem={id:null, nama:'', telp:'', alamat:'', barang:'', rekening:'', catatan:''}; I.pemBalik=arg==='faktur'?'faktur-form':'pemasok'; FORM_VIEWS['pemasok-form']=I.pemBalik; state.view='pemasok-form'; render(); break;
    case 'p-ubah': I.pem={...state.pemasok.find(s=>s.id===arg)}; I.pemBalik='pemasok'; FORM_VIEWS['pemasok-form']='pemasok'; state.view='pemasok-form'; render(); break;
    case 'p-batal': state.view=I.pemBalik||'pemasok'; I.pem=null; render(); break;
    case 'p-simpan': { const p=I.pem, nama=(p.nama||'').trim(), salah=[];
      if(!nama) salah.push('ivPNama'); if(!(p.telp||'').trim()) salah.push('ivPTelp');
      if(salah.length){ ivTandai(salah, !nama?'Isi nama pemasok':'Isi nomor telepon pemasok'); return; }

    case 'o-kirim': { const O=I.og, cat=ivCat(), produk=cat.map(c=>{ const q=gdStok(c.sku), v=O.fisik[c.sku], f=v==null||v===''?q:Math.max(0,Math.round(+v||0)); return {sku:c.sku, nama:c.nama, sistem:q, fisik:f, selisih:f-q, hpp:c.hpp, kerugian:Math.max(0,q-f)*c.hpp}; }).filter(p=>p.sistem>0||p.fisik>0);

      const ada=produk.some(p=>p.selisih); if(ada&&!(O.catatan||'').trim()){ toast('Ada selisih. Tulis catatannya dulu'); return; }
      state.posOpname.filter(o=>o.jenis==='Gudang'&&['Menunggu persetujuan','Perlu opname ulang'].includes(o.status)).forEach(o=>o.status='Diganti');
      const pre='SO/'+hkYmd(new Date()).slice(2).replace(/-/g,'')+'/', n=state.posOpname.filter(o=>o.no.startsWith(pre)).reduce((a,o)=>Math.max(a,+o.no.slice(pre.length)||0),0)+1;

    case 'o-periksa': { const so=state.posOpname.find(o=>o.no===arg), e=so.eventId===HK_GUDANG_ID?null:evById(so.eventId);

    case 'o-detail': H.modal={type:'sodetail', no:arg}; render(); break;
    case 'o-csv': ivCsv('stok-opname.csv',[['Waktu','Nomor','Lokasi','Jenis','Dihitung oleh','Disetujui oleh','Kurang','Lebih','Kerugian','Status'],...state.posOpname.map(o=>{ const r=hkSORingkas(o); return [o.waktu,o.no,o.lokasi,SO_JENIS[o.jenis]||o.jenis,o.dihitungOleh||o.oleh,o.disetujui?o.disetujui.oleh:'',r.kurang,r.lebih,o.kerugian||0,o.status]; })]); break;
    /* terbuang */
    case 't-baru': I.tb={lokasi:HK_GUDANG, tanggal:ivToday(), alasan:'', penjelasan:'', items:[], foto:null}; state.view='terbuang-form'; render(); break;
    case 't-hapus': I.tb.items.splice(+arg,1); render(); break;
    case 't-simpan': { const t=I.tb, salah=[]; let msg=''; const add=(c,id,m)=>{ if(c){ salah.push(id); msg=msg||m; } };
      add(!t.alasan,'ivTAlasan','Pilih alasan'); add(!t.pj,'ivTPj','Pilih penanggung jawab'); add((t.penjelasan||'').trim().length<10,'ivTPenj','Tulis penjelasan yang jelas (minimal 10 huruf)'); add(!t.items.length,'ivTBarang','Tambahkan barang lewat + Produk');

      if(salah.length){ ivTandai(salah, salah.length>1?`${msg}. Masih ada isian lain yang ditandai merah`:msg); return; }
      const pre='ST/'+hkYmd(new Date()).slice(2).replace(/-/g,'')+'/', n=state.terbuang.reduce((a,x)=>Math.max(a,+x.no.split('/').pop()||0),0)+1;

      rec.kerugian=rec.items.reduce((a,i)=>a+i.qty*ivHpp(i.sku),0); rec.tanggungJawab={pj:t.pj, alasan:`${rec.alasan}: ${rec.penjelasan}`, riwayat:[]};
      rec.items.forEach(i=>{ const it=hkStokRow(state.stokItems,i.sku), p=hkPO(it,rec.lokasi); p.akhir-=i.qty; it.akhir-=i.qty; p.terbuang=(p.terbuang||0)+i.qty; it.terbuang=(it.terbuang||0)+i.qty; });
      state.terbuang.unshift(rec); I.tb=null; hkSaveAll(data()); state.view='stok-terbuang'; render(); toast(`${rec.no} tercatat. Stok ${rec.lokasi} berkurang ${rec.items.reduce((a,i)=>a+i.qty,0)} pcs`); break; }
    case 't-csv': ivCsv('stok-terbuang.csv',[['Waktu','Jenis','Sumber','Lokasi','Barang','Pcs','Nilai HPP','Penjelasan','Penyelesaian','Dicatat oleh'],...ivTerbuang().map(x=>[x.waktu,x.jenis,x.no,x.lokasi,x.items.map(i=>`${i.qty}x ${i.nama}`).join('; '),x.qty,x.nilai,x.penjelasan,x.penyelesaian||'',x.oleh])]); break;
    /* daftar stok */
    case 's-tab': I.sTab=arg; render(); break;
    case 's-min': I.sMin=!I.sMin; render(); break;
    case 's-csv': { const evs=state.events.filter(e=>!e.ditutup); ivCsv('daftar-stok.csv',[['SKU','Nama',HK_GUDANG,...evs.map(e=>e.nama),'Dalam perjalanan','Total'],...ivCat().map(c=>{ const it=hkStokRow(state.stokItems,c.sku)||{}, per=evs.map(e=>hkStokDi(state.stokItems,c.sku,e.nama)); return [c.sku,c.nama,gdStok(c.sku),...per,it.transit||0,gdStok(c.sku)+per.reduce((a,b)=>a+b,0)+(it.transit||0)]; })]); break; }
    /* pemilih produk */
    case 'pilih': { const sel={}; (arg==='faktur'?I.faktur.items:I.tb.items).forEach(i=>sel[i.sku]=true); H.modal={type:'pilih', ctx:arg, cari:'', sel}; render(); break; }
  }
});

/* ════════ KARYAWAN › BERTUGAS HARI INI: siapa ditugaskan, siapa membuka kasir, siapa belum datang, per lokasi ════════ */
function viewBertugas(){
  const hari=ivToday(), M=(state.masukPos||[]).filter(m=>m.waktu.slice(0,10)===hari&&!m.aksi.startsWith('PIN salah'));
  const shiftBuka=state.posShift.filter(s=>!s.tutup);
  const lokasi=[{id:HK_GUDANG_ID, nama:HK_GUDANG, gudang:true, kasir:[], pj:''}, ...state.events.filter(e=>!e.ditutup&&e.mulai<=hari&&e.selesai>=hari||!e.ditutup&&e.selesai<hari)];
  const st=n=>state.staff.find(x=>x.nama===n)||{role:[]};
  const hadir=(nama,tempat)=>M.filter(m=>m.nama===nama&&m.tempat===tempat).sort((a,b)=>a.waktu.localeCompare(b.waktu));
  let nBuka=0, nBelum=0;
  const kartu=lokasi.map(e=>{
    const laci=shiftBuka.filter(s=>s.eventId===e.id); nBuka+=laci.length;
    const statusOrang=nama=>{ const sh=laci.find(s=>s.kasir===nama), h=hadir(nama,e.nama), terakhir=h[h.length-1];
      if(sh) return {k:'buka', t:`Membuka kasir sejak ${hkJam(sh.buka)}`, b:'badge-success'};
      if(h.some(x=>x.aksi==='Gabung kasir')) return {k:'gabung', t:`Bergabung ke laci, masuk ${hkJam(h[0].waktu)}`, b:'badge-success'};
      if(terakhir&&terakhir.aksi==='Keluar') return {k:'keluar', t:`Sudah keluar ${hkJam(terakhir.waktu)}`, b:'badge-mut'};
      if(h.length) return {k:'hadir', t:`Masuk POS ${hkJam(h[0].waktu)}`, b:'badge-success'};
      return {k:'belum', t:'Belum masuk POS hari ini', b:'badge-danger'}; };
    const ditugaskan=e.gudang?[]:e.kasir.map(n=>({n, s:statusOrang(n)}));
    nBelum+=ditugaskan.filter(x=>x.s.k==='belum').length;
    const lain=[...new Set([...M.filter(m=>m.tempat===e.nama).map(m=>m.nama), ...laci.map(s=>s.kasir)])].filter(n=>!e.kasir.includes(n)).map(n=>({n, s:statusOrang(n)}));
    const baris=(x,tamu)=>`<tr><td><b>${hkEsc(x.n)}</b><div class="hk-sub">${hkEsc(st(x.n).role.join(', '))}${tamu?' · tidak ditugaskan, ikut berjualan':''}${!e.gudang&&e.pj===x.n?' · penanggung jawab':''}</div></td><td>${ivBadge(x.s.t,x.s.b)}</td></tr>`;
    const sts=e.gudang?'':hkStatusEvent(e);
    return `<div class="card" style="margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;"><b style="font-size:15px;">${hkEsc(e.nama)}</b>${e.gudang?ivBadge('Gudang','badge-mut'):ivBadge(sts,sts==='Berlangsung'?'badge-success':'badge-warn')}
        <span class="hk-sub">${e.gudang?'Jual langsung (Owner) dan serah terima pre-sale (Admin)':`${hkEsc(e.venue||'')} · ${tglRange(e.mulai,e.selesai)}`}</span><div class="spacer" style="flex:1;"></div>
        ${e.gudang?'':`<span class="hk-sub">Penanggung jawab: <b>${hkEsc(e.pj||'-')}</b></span><span class="hk-row-link" style="color:var(--accent-text);font-weight:600;" data-inv="bt-event" data-inv-arg="${e.id}">Detail event ›</span>`}</div>
      <div class="hk-sub" style="margin:8px 0;">${laci.length?`Laci terbuka: ${laci.map(s=>{ const K=hkShiftKas(data(),s); return `<b>${hkEsc(s.kasir)}</b> sejak ${hkJam(s.buka)} (${hkTgl(s.buka)}) · ${K.n} transaksi · ${hkRp(K.penjualan)}`; }).join('; ')}`:'Belum ada laci terbuka.'}</div>
      ${e.gudang?(lain.length?`<table class="hk-varian"><thead><tr><th>Ada di Gudang Pusat hari ini</th><th>Status</th></tr></thead><tbody>${lain.map(x=>baris(x,false)).join('')}</tbody></table>`:'<div class="hk-sub">Belum ada yang memakai POS di Gudang Pusat hari ini. Gudang tidak punya petugas tetap: Owner bisa jual langsung, Admin bisa serah terima pre-sale.</div>')
        :`<table class="hk-varian"><thead><tr><th>Ditugaskan</th><th>Status hari ini</th></tr></thead><tbody>${ditugaskan.map(x=>baris(x,false)).join('')||'<tr><td colspan="2" class="hk-empty">Belum ada kasir ditugaskan. Atur di Ubah Event.</td></tr>'}${lain.map(x=>baris(x,true)).join('')}</tbody></table>`}
    </div>`; }).join('');
  /* satu orang ditugaskan di lebih dari satu event yang berlangsung hari ini */
  const ganda=state.staff.map(s=>({n:s.nama, ev:lokasi.filter(e=>!e.gudang&&e.kasir.includes(s.nama)&&hkStatusEvent(e)==='Berlangsung')})).filter(x=>x.ev.length>1);
  return `<div class="hk-sub" style="margin-bottom:12px;">Per ${hkTgl(hari)}. Status diambil dari riwayat masuk POS hari ini dan laci kasir yang sedang terbuka.</div>
  <div class="hk-kpis"><div class="metric-card"><div class="metric-label">Lokasi aktif</div><div class="metric-value">${lokasi.length}</div><div class="hk-sub">Gudang Pusat + event</div></div>
    <div class="metric-card"><div class="metric-label">Laci terbuka</div><div class="metric-value">${nBuka}</div></div>
    <div class="metric-card"><div class="metric-label">Ditugaskan, belum masuk POS</div><div class="metric-value" style="${nBelum?'color:var(--danger-text);':''}">${nBelum}</div></div>
    <div class="metric-card"><div class="metric-label">Ditugaskan di 2 event sekaligus</div><div class="metric-value" style="${ganda.length?'color:var(--danger-text);':''}">${ganda.length}</div>${ganda.length?`<div class="hk-sub">${ganda.map(x=>hkEsc(x.n)).join(', ')}</div>`:''}</div></div>
  ${kartu}`;
}
