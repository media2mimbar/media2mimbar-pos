<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF6100">
<title>Hikayat POS</title>
<style>
:root{--accent:#FF6100;--accent-dark:#E5570A;--accent-bg:#FFF0E5;--bg:#F4F5F3;--border:#E7E8E4;--border-strong:#D6D8D1;--text:#1E2321;--text-2:#5B615C;--text-mut:#93988F;--danger-bg:#FDECEA;--danger-text:#C0392B;--success-bg:#E4F7EF;--success-text:#00734E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
[hidden]{display:none!important}
.bar{background:var(--accent);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.bar b{flex:1;font-size:17px}
.bar button{background:none;border:0;color:#fff;font:inherit;font-weight:600}
.wrap{max-width:420px;margin:0 auto;padding:20px 16px}
h1{font-size:20px;margin:0 0 6px}
.muted{color:var(--text-mut)}.small{font-size:13px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}
input.kode{width:100%;font:700 26px ui-monospace,Menlo,monospace;letter-spacing:4px;text-align:center;text-transform:uppercase;padding:14px;border:1px solid var(--border-strong);border-radius:10px;margin:16px 0}
.btn{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border-strong);background:#fff;font:inherit;font-weight:700;margin-top:10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5}
.err{background:var(--danger-bg);color:var(--danger-text);padding:10px 12px;border-radius:10px;margin-top:12px}
.ok{background:var(--success-bg);color:var(--success-text);padding:10px 12px;border-radius:10px;margin-top:12px}
.orang{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.orang button{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font:inherit;text-align:left}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-bg);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.titik{display:flex;justify-content:center;gap:14px;margin:22px 0}
.titik span{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong)}
.titik span.isi{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{padding:18px 0;font-family:inherit;font-size:24px;font-weight:600;background:#fff;border:1px solid var(--border);border-radius:12px;color:var(--text)}
.pad button:active{background:var(--accent-bg)}
.pad .kosong{visibility:hidden}
.center{text-align:center}
</style>
</head>
<body>
<div class="bar"><b>Hikayat POS</b><span id="kodeHp" class="small"></span><button id="ganti" hidden>Ganti kasir</button></div>

<div class="wrap" id="lDaftar" hidden>
  <div class="card">
    <h1>Daftarkan HP ini</h1>
    <p class="muted">Minta Owner atau Admin membuka Dashboard › Perangkat POS › Daftarkan HP, lalu ketik kode yang muncul.</p>
    <form id="fDaftar">
      <input class="kode" name="kode" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" autocapitalize="characters" required>
      <div class="err" hidden></div>
      <button class="btn primary">Daftarkan</button>
    </form>
  </div>
</div>

<div class="wrap" id="lPilih" hidden>
  <h1>Siapa yang bertugas?</h1>
  <div class="orang" id="daftarOrang"></div>
</div>

<div class="wrap center" id="lPin" hidden>
  <div class="av" style="margin:10px auto;width:56px;height:56px;font-size:20px" id="pinAv"></div>
  <h1 id="pinJudul"></h1>
  <div class="muted" id="pinInfo"></div>
  <div class="titik" id="titik"></div>
  <div class="err" id="pinErr" hidden></div>
  <div class="pad" id="pad"></div>
  <button class="btn" id="pinBatal">Kembali</button>
</div>

<div class="wrap" id="lBeranda" hidden>
  <div class="card">
    <div class="muted small">Masuk sebagai</div>
    <h1 id="berandaNama"></h1>
    <div class="muted" id="berandaRole"></div>
    <div class="ok" id="berandaPesan" hidden></div>
    <p class="small muted" style="margin-top:16px">Ini versi awal (tahap 1): HP terdaftar dan masuk dengan PIN sudah bekerja. Fitur jualan, shift, dan stok menyusul di tahap 3.</p>
    <button class="btn" id="gantiPin">Ganti PIN</button>
    <button class="btn" id="keluar">Keluar</button>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const NAMA_ROLE = { owner: "Owner", admin: "Admin", kasir: "Kasir" };
const inisial = (n) => n.split(/\s+/).slice(0, 2).map((x) => x[0]).join("").toUpperCase();

// Token perangkat disimpan di IndexedDB. Sesi kasir hanya untuk tab ini.
const idb = () => new Promise((ok, gagal) => {
  const r = indexedDB.open("hikayat-pos", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onsuccess = () => ok(r.result);
  r.onerror = () => gagal(r.error);
});
async function kv(kunci, nilai) {
  const db = await idb();
  return new Promise((ok, gagal) => {
    const tx = db.transaction("kv", nilai === undefined ? "readonly" : "readwrite");
    const st = tx.objectStore("kv");
    const r = nilai === undefined ? st.get(kunci) : nilai === null ? st.delete(kunci) : st.put(nilai, kunci);
    r.onsuccess = () => ok(r.result);
    r.onerror = () => gagal(r.error);
  });
}

let tokenHp = null;
let sesi = sessionStorage.getItem("hk_pos_sesi");
let staff = null;

async function api(method, path, body) {
  const h = {};
  if (tokenHp) h["x-perangkat"] = tokenHp;
  if (sesi) h["x-sesi"] = sesi;
  if (body !== undefined) h["content-type"] = "application/json";
  const res = await fetch(path, { method, headers: h, body: body !== undefined ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && data.kode === "perangkat_tidak_dikenal") {
    await kv("token", null);
    tokenHp = null;
    setSesi(null);
    tampil("lDaftar");
  }
  if (!res.ok) throw Object.assign(new Error(data.error || "Gagal menghubungi server"), { status: res.status, kode: data.kode });
  return data;
}

function setSesi(s) {
  sesi = s;
  if (s) sessionStorage.setItem("hk_pos_sesi", s);
  else sessionStorage.removeItem("hk_pos_sesi");
}

function tampil(id) {
  for (const l of ["lDaftar", "lPilih", "lPin", "lBeranda"]) $("#" + l).hidden = l !== id;
  $("#ganti").hidden = id !== "lBeranda";
}

// ---------- Daftar HP ----------

$("#fDaftar").kode.addEventListener("input", (e) => {
  const v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  e.target.value = v.length > 4 ? v.slice(0, 4) + "-" + v.slice(4) : v;
});
$("#fDaftar").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, err = f.querySelector(".err");
  err.hidden = true;
  try {
    const r = await api("POST", "/api/pos/daftar", { kode: f.kode.value });
    tokenHp = r.token;
    await kv("token", r.token);
    f.reset();
    $("#kodeHp").textContent = "HP " + r.perangkat.kode;
    pilihOrang();
  } catch (x) { err.textContent = x.message; err.hidden = false; }
});

// ---------- Pilih nama dan PIN ----------

async function pilihOrang() {
  tampil("lPilih");
  $("#daftarOrang").innerHTML = '<p class="muted">Memuat…</p>';
  const { karyawan } = await api("GET", "/api/pos/karyawan");
  $("#daftarOrang").innerHTML = karyawan.map((k) => `<button data-id="${k.id}" data-nama="${esc(k.nama)}">
    <span class="av">${esc(inisial(k.nama))}</span><span><b>${esc(k.nama)}</b><br><span class="small muted">${k.role.map((r) => NAMA_ROLE[r]).join(", ")}${k.petunjuk ? " · " + esc(k.petunjuk) : ""}</span></span></button>`).join("");
  $("#daftarOrang").querySelectorAll("button").forEach((b) => (b.onclick = () => mintaPin({
    judul: b.dataset.nama, info: "Masukkan PIN 6 angka", av: inisial(b.dataset.nama), batal: pilihOrang,
    selesai: async (pin) => {
      const r = await api("POST", "/api/pos/masuk", { staff_id: b.dataset.id, pin });
      setSesi(r.sesi);
      staff = r.staff;
      if (staff.wajib_ganti_pin) return gantiPin(true);
      beranda();
    },
  })));
}

let pinAksi = null;
function mintaPin(o) {
  pinAksi = o;
  $("#pinJudul").textContent = o.judul;
  $("#pinInfo").textContent = o.info;
  $("#pinAv").textContent = o.av || "";
  $("#pinAv").hidden = !o.av;
  $("#pinErr").hidden = true;
  $("#pinBatal").hidden = !o.batal;
  pinIsi = "";
  gambarTitik();
  tampil("lPin");
}

let pinIsi = "";
function gambarTitik() {
  $("#titik").innerHTML = [0, 1, 2, 3, 4, 5].map((i) => `<span class="${i < pinIsi.length ? "isi" : ""}"></span>`).join("");
}
$("#pad").innerHTML = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].map((k) => `<button class="${k ? "" : "kosong"}" data-k="${k}">${k}</button>`).join("");
$("#pad").onclick = async (e) => {
  const k = e.target.dataset.k;
  if (k === undefined || k === "") return;
  if (k === "⌫") pinIsi = pinIsi.slice(0, -1);
  else if (pinIsi.length < 6) pinIsi += k;
  gambarTitik();
  if (pinIsi.length === 6) {
    const pin = pinIsi;
    pinIsi = "";
    try { await pinAksi.selesai(pin); }
    catch (x) { $("#pinErr").textContent = x.message; $("#pinErr").hidden = false; gambarTitik(); }
  }
};
$("#pinBatal").onclick = () => pinAksi.batal();

// ---------- Ganti PIN ----------

function gantiPin(wajib) {
  const awal = wajib ? "PIN Anda masih sementara. " : "";
  mintaPin({
    judul: "Ganti PIN", info: awal + "Masukkan PIN lama", batal: wajib ? null : beranda,
    selesai: async (lama) => mintaPin({
      judul: "Ganti PIN", info: "Masukkan PIN baru", batal: wajib ? null : beranda,
      selesai: async (baru) => mintaPin({
        judul: "Ganti PIN", info: "Ulangi PIN baru", batal: wajib ? null : beranda,
        selesai: async (ulang) => {
          const ulangDari = (pesan) => { gantiPin(wajib); $("#pinErr").textContent = pesan; $("#pinErr").hidden = false; };
          if (ulang !== baru) return ulangDari("PIN baru tidak sama. Ulangi dari awal");
          try { await api("POST", "/api/pos/ganti-pin", { pin_lama: lama, pin_baru: baru }); }
          catch (x) { return ulangDari(x.message); }
          staff.wajib_ganti_pin = false;
          beranda("PIN berhasil diganti");
        },
      }),
    }),
  });
}

// ---------- Beranda ----------

function beranda(pesan) {
  $("#berandaNama").textContent = staff.nama;
  $("#berandaRole").textContent = staff.role.map((r) => NAMA_ROLE[r]).join(", ");
  $("#berandaPesan").textContent = pesan || "";
  $("#berandaPesan").hidden = typeof pesan !== "string";
  tampil("lBeranda");
}
$("#gantiPin").onclick = () => gantiPin(false);
async function keluar() {
  try { await api("POST", "/api/pos/keluar", {}); } catch {}
  setSesi(null);
  staff = null;
  pilihOrang();
}
$("#keluar").onclick = keluar;
$("#ganti").onclick = keluar;

// ---------- Mulai ----------

(async () => {
  tokenHp = (await kv("token").catch(() => null)) || null;
  if (!tokenHp) return tampil("lDaftar");
  try {
    const { perangkat } = await api("GET", "/api/pos/perangkat");
    $("#kodeHp").textContent = "HP " + perangkat.kode;
    if (sesi) {
      try {
        staff = (await api("GET", "/api/pos/saya")).staff;
        return staff.wajib_ganti_pin ? gantiPin(true) : beranda();
      } catch { setSesi(null); }
    }
    pilihOrang();
  } catch (x) {
    // Token tidak dikenal sudah diarahkan ke layar daftar oleh api(). Selain itu berarti server tidak terjangkau.
    if (tokenHp) document.body.insertAdjacentHTML("beforeend", '<div class="wrap"><div class="card">Server tidak bisa dihubungi. Periksa sinyal lalu muat ulang.</div></div>');
  }
})();
</script>
</body>
</html>
