<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hikayat Dashboard</title>
<style>
:root{--accent:#FF6100;--accent-dark:#E5570A;--accent-bg:#FFF0E5;--bg:#F4F5F3;--card:#fff;--border:#E7E8E4;--border-strong:#D6D8D1;--text:#1E2321;--text-2:#5B615C;--text-mut:#93988F;--danger-bg:#FDECEA;--danger-text:#C0392B;--success-bg:#E4F7EF;--success-text:#00734E;--warn-bg:#FDF2DD;--warn-text:#B7791F}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
[hidden]{display:none!important}
h1{font-size:20px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}
.muted{color:var(--text-mut)}.small{font-size:12px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
.narrow{width:100%;max-width:380px}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;font:inherit}
input:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--border-strong);background:#fff;font:inherit;font-weight:600;cursor:pointer;color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-dark)}
.btn.danger{color:var(--danger-text)}.btn.small{padding:5px 10px;font-size:12px}
.btn.block{width:100%;justify-content:center;margin-top:20px}
.btn:disabled{opacity:.5;cursor:default}
.err{background:var(--danger-bg);color:var(--danger-text);padding:10px 12px;border-radius:8px;margin-top:14px}
.ok{background:var(--success-bg);color:var(--success-text);padding:10px 12px;border-radius:8px;margin-top:14px}
.grafik-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:6px}
.card.grafik{padding:16px 18px}.grafik h3{font-size:14px;margin:0 0 10px}
.gb-baris{display:grid;grid-template-columns:minmax(80px,34%) 1fr auto;gap:10px;align-items:center;padding:4px 0;position:relative;outline:none}
.gb-label{font-size:13px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gb-jalur{height:14px;display:block}.gb-batang{display:block;height:14px;background:#2a78d6;border-radius:0 4px 4px 0}
.gb-nilai{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.gb-baris:hover .gb-batang,.gb-baris:focus .gb-batang{filter:brightness(.9)}
.gb-baris:hover::after,.gb-baris:focus::after{content:attr(data-tip);position:absolute;left:34%;bottom:100%;background:#1E2321;color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:5;pointer-events:none}
tr.total td{border-top:2px solid var(--border)}
@media print{.side,.top,.ku-noprint,.subtabs,.back,#popup{display:none!important}body{background:#fff}.card{break-inside:avoid;box-shadow:none}main{max-width:none;padding:0}}
.warn{background:var(--warn-bg);color:var(--warn-text);padding:10px 12px;border-radius:8px;margin-top:14px}
.top{background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:24px;padding:0 20px;height:56px;position:sticky;top:0;z-index:4}
.logo{width:196px;color:var(--accent-dark);line-height:1.15;font-size:12px}.logo b{display:block;font-size:15px}
.area{display:flex;gap:4px;flex:1}
.area button{background:none;border:0;font:inherit;font-weight:600;color:var(--text-2);padding:7px 14px;border-radius:8px;cursor:pointer}
.area button.on{background:var(--accent);color:#fff}
.app{display:flex;align-items:flex-start}
.side{width:236px;flex:none;background:var(--accent);min-height:calc(100vh - 56px);position:sticky;top:56px;padding:10px 0}
#nav{display:flex;flex-direction:column}
#nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-left:3px solid transparent;color:#fff;font:inherit;font-weight:600;padding:11px 18px;text-align:left;cursor:pointer;white-space:nowrap}
#nav button:hover{background:rgba(0,0,0,.08)}
#nav button.on{background:rgba(0,0,0,.2);border-left-color:#FFD6BD}
#nav svg{width:18px;height:18px;flex:none;pointer-events:none}
#isi{flex:1;min-width:0}
.app:has(#isi>.form) .side{display:none}
@media (max-width:900px){.app{flex-direction:column;align-items:stretch}.side{width:auto;min-height:0;position:static;padding:0}#nav{flex-direction:row;overflow-x:auto}#nav button{border-left:0;border-bottom:3px solid transparent;padding:10px 14px}#nav button.on{border-bottom-color:#FFD6BD}.logo{width:auto}}
.akun{position:relative}
.akun>button{background:none;border:0;color:var(--text);font:inherit;cursor:pointer;text-align:right}
.menu{position:absolute;right:0;top:44px;background:#fff;color:var(--text);border:1px solid var(--border);border-radius:10px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:5}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;font:inherit;cursor:pointer}
.menu button:hover{background:var(--bg)}
main{margin:0;padding:24px 28px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;color:var(--text-2);font-weight:600;background:#FAFAF8}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;margin:0 4px 2px 0;background:var(--bg);color:var(--text-2)}
.tag.owner{background:var(--accent-bg);color:var(--accent-text,#E5570A)}
.tag.aktif{background:var(--success-bg);color:var(--success-text)}
.tag.warn{background:var(--warn-bg);color:var(--warn-text)}
.tag.off{background:var(--danger-bg);color:var(--danger-text)}
.form{max-width:960px;margin:24px auto;padding:0 20px}
.back{background:none;border:0;color:var(--text-2);font:inherit;cursor:pointer;padding:0;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.top{height:auto;padding:10px 16px}}
.checks{display:flex;gap:18px;flex-wrap:wrap}
.checks label{font-weight:400;display:flex;gap:6px;align-items:center;margin:0}
.actions{display:flex;gap:10px;margin-top:24px}
.kode{font:700 34px/1.2 ui-monospace,Menlo,monospace;letter-spacing:4px;background:var(--accent-bg);color:var(--accent-dark);padding:16px;border-radius:10px;text-align:center;margin:12px 0}
.cred{font:600 16px ui-monospace,Menlo,monospace;background:var(--bg);padding:2px 8px;border-radius:6px}
.overlay{position:fixed;inset:0;background:rgba(30,35,33,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay .card{max-width:520px;width:100%;max-height:90vh;overflow-y:auto}
textarea{min-height:70px;resize:vertical}
.num{text-align:right;white-space:nowrap}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;font:inherit;font-weight:600;color:var(--text-2);cursor:pointer}
.subtabs button.on{color:var(--accent-dark);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:20px;margin-top:2px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters>*,.filters input,.filters select{width:auto}
.filters input[type=search]{min-width:220px}
td input,td select{padding:7px 9px}
tr.klik{cursor:pointer}tr.klik:hover td{background:#FAFAF8}
tfoot td{font-weight:700;background:#FAFAF8}
.pilih{max-height:60vh;overflow:auto;border:1px solid var(--border);border-radius:8px;margin-top:10px}
.pilih label{display:flex;gap:10px;align-items:center;font-weight:400;margin:0;padding:9px 12px;border-bottom:1px solid var(--border)}
.section{margin-top:22px}
</style>
</head>
<body>

<div id="layarSetup" class="center" hidden>
  <form class="card narrow" id="fSetup">
    <h1>Siapkan akun Owner</h1>
    <p class="muted">Ini hanya muncul sekali, saat belum ada akun sama sekali.</p>
    <label>Kode setup</label><input type="text" name="kode" autocomplete="off" required>
    <label>Nama</label><input type="text" name="nama" required>
    <label>Email</label><input type="email" name="email" required>
    <label>Password</label><input type="password" name="password" autocomplete="new-password" required>
    <p class="small muted">Minimal 8 karakter, berisi huruf dan angka.</p>
    <label>PIN POS (6 angka)</label><input type="password" name="pin" inputmode="numeric" maxlength="6" required>
    <div class="err" hidden></div>
    <button class="btn primary block">Buat akun Owner</button>
  </form>
</div>

<div id="layarMasuk" class="center" hidden>
  <form class="card narrow" id="fMasuk">
    <h1>Hikayat Merchandise</h1>
    <p class="muted">Masuk ke dashboard</p>
    <label>Email</label><input type="email" name="email" autocomplete="username" required>
    <label>Password</label><input type="password" name="password" autocomplete="current-password" required>
    <div class="err" hidden></div>
    <button class="btn primary block">Masuk</button>
  </form>
</div>

<div id="layarGantiPw" class="center" hidden>
  <form class="card narrow" id="fGantiPw">
    <h1>Ganti password</h1>
    <p class="muted" id="gantiPwInfo"></p>
    <label>Password lama</label><input type="password" name="lama" autocomplete="current-password" required>
    <label>Password baru</label><input type="password" name="baru" autocomplete="new-password" required>
    <label>Ulangi password baru</label><input type="password" name="ulang" autocomplete="new-password" required>
    <p class="small muted">Minimal 8 karakter, berisi huruf dan angka.</p>
    <div class="err" hidden></div>
    <button class="btn primary block">Simpan password</button>
    <button type="button" class="btn block" id="batalGantiPw">Batal</button>
  </form>
</div>

<div id="layarApp" hidden>
  <header class="top">
    <div class="logo">Hikayat<b>Merchandise</b></div>
    <div class="area" id="area"><button data-area="penjualan">Penjualan</button><button data-area="karyawan">Karyawan</button></div>
    <div class="akun">
      <button id="akunBtn"><div id="akunNama"></div><div class="small muted" id="akunRole"></div></button>
      <div class="menu" id="akunMenu" hidden>
        <button id="mGantiPw">Ganti password</button>
        <button id="mKeluar">Keluar</button>
      </div>
    </div>
  </header>
  <div class="app"><aside class="side"><nav id="nav"></nav></aside><div id="isi"></div></div>
</div>

<div class="overlay" id="popup" hidden><div class="card" id="popupIsi"></div></div>

<script src="/dash-katalog.js"></script>
<script src="/dash-inventori.js"></script>
<script src="/dash-penjualan.js"></script>
<script src="/dash-event.js"></script>
<script src="/dash-promo.js"></script>
<script src="/dash-online.js"></script>
<script src="/dash-laporan.js"></script>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const NAMA_ROLE = { owner: "Owner", admin: "Admin", kasir: "Kasir" };
const waktu = (iso) => iso ? new Date(iso).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" }) : "—";
const rp = (n) => "Rp " + Number(n || 0).toLocaleString("id-ID");
const tgl = (ymd) => ymd ? new Date(ymd + "T00:00:00").toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }) : "—";
const hariIni = () => new Date(Date.now() + 7 * 3600_000).toISOString().slice(0, 10);
const angka = (v) => (v === "" || v === null || v === undefined ? null : Number(String(v).replace(/[.\s]/g, "")));
function subtabs(daftar, aktif, pilih) {
  return `<div class="subtabs">${daftar.map(([k, n]) => `<button type="button" data-sub="${k}" class="${k === aktif ? "on" : ""}">${n}</button>`).join("")}</div>`;
}
function pasangSubtabs(pilih) {
  document.querySelectorAll("[data-sub]").forEach((b) => (b.onclick = () => pilih(b.dataset.sub)));
}
function unduhCsv(nama, baris) {
  const isi = baris.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + isi], { type: "text/csv" }));
  a.download = nama;
  a.click();
}
let saya = null;
let tab = null;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body !== undefined ? { "content-type": "application/json" } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
    credentials: "same-origin",
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && data.kode === "perlu_masuk") { tampil("layarMasuk"); throw new Error(data.error); }
  if (res.status === 403 && data.kode === "wajib_ganti_password") { bukaGantiPw(true); throw new Error(data.error); }
  if (!res.ok) throw new Error(data.error || "Gagal menghubungi server");
  return data;
}

function tampil(id) {
  for (const l of ["layarSetup", "layarMasuk", "layarGantiPw", "layarApp"]) $("#" + l).hidden = l !== id;
}

function formKirim(form, aksi) {
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $(".err", form), btn = $("button.primary", form);
    err.hidden = true; btn.disabled = true;
    try { await aksi(Object.fromEntries(new FormData(form))); }
    catch (x) { err.textContent = x.message; err.hidden = false; }
    finally { btn.disabled = false; }
  });
}

// Batas isian angka: pesan kecil "Maksimal ..." di bawah kolom yang angkanya diturunkan.
function pesanMaks(input, teks) {
  let el = input.nextElementSibling;
  if (!el?.classList.contains("pesan-maks")) { el = document.createElement("div"); el.className = "pesan-maks small"; el.style.color = "var(--warn-text)"; input.after(el); }
  el.textContent = "Maksimal " + teks;
  clearTimeout(el._t); el._t = setTimeout(() => (el.textContent = ""), 2500);
}

function popup(html) {
  $("#popupIsi").innerHTML = html + '<div class="actions"><button class="btn primary" id="tutupPopup">Tutup</button></div>';
  $("#popup").hidden = false;
  $("#tutupPopup").onclick = () => { $("#popup").hidden = true; };
}

// ---------- Masuk, setup, ganti password ----------

formKirim($("#fSetup"), async (d) => {
  await api("POST", "/api/setup", d);
  $("#fMasuk").email.value = d.email;
  tampil("layarMasuk");
});

formKirim($("#fMasuk"), async (d) => {
  const r = await api("POST", "/api/masuk", d);
  $("#fMasuk").reset();
  mulai(r.staff);
});

function bukaGantiPw(wajib) {
  $("#gantiPwInfo").textContent = wajib ? "Password Anda masih sementara dari Owner. Ganti dulu sebelum lanjut." : "";
  $("#batalGantiPw").hidden = wajib;
  $("#fGantiPw").reset();
  tampil("layarGantiPw");
}
$("#batalGantiPw").onclick = () => tampil("layarApp");

formKirim($("#fGantiPw"), async (d) => {
  if (d.baru !== d.ulang) throw new Error("Ulangi password baru belum sama");
  await api("POST", "/api/ganti-password", { lama: d.lama, baru: d.baru });
  saya.wajib_ganti_password = false;
  mulai(saya);
});

$("#akunBtn").onclick = () => { $("#akunMenu").hidden = !$("#akunMenu").hidden; };
$("#mGantiPw").onclick = () => { $("#akunMenu").hidden = true; bukaGantiPw(false); };
$("#mKeluar").onclick = async () => { await api("POST", "/api/keluar"); saya = null; tampil("layarMasuk"); };

// ---------- Aplikasi ----------

function mulai(staff) {
  saya = staff;
  if (staff.wajib_ganti_password) return bukaGantiPw(true);
  $("#akunNama").textContent = staff.nama;
  $("#akunRole").textContent = staff.role.map((r) => NAMA_ROLE[r]).join(", ");
  const owner = staff.role.includes("owner");
  tabs = [["dashboard", "Dashboard"], ["laporan", "Laporan"], owner && ["keuangan", "Keuangan"], ["event", "Event"], ["presale", "Pesanan Pre-sale"], ["online", "Penjualan Online"], ["penjualan", "Penjualan POS"], ["produk", "Produk"], ["inventori", "Inventori"], ["pelanggan", "Pelanggan"], ["promosi", "Promosi"], ["pengaturan", "Pengaturan POS"], ["karyawan", "Karyawan"], ["perangkat", "Perangkat POS"], owner && ["riwayat", "Riwayat Masuk"]].filter(Boolean);
  $("#nav").onclick = (e) => e.target.dataset.tab && buka(e.target.dataset.tab);
  $("#area").onclick = (e) => {
    const a = e.target.dataset.area;
    if (a) buka(a === "karyawan" ? "karyawan" : tabTerakhir);
  };
  tampil("layarApp");
  buka(tabs.some(([k]) => k === tab) ? tab : tabs[0][0]);
}

// Bilah atas memilih area (Penjualan atau Karyawan); menu samping berisi halaman di area itu.
const AREA_KARYAWAN = ["karyawan", "perangkat", "riwayat"];
let tabs = [], tabTerakhir = "dashboard";
const IKON = {
  dashboard: "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
  laporan: "M5 3h14v18H5zM9 8h6M9 12h6M9 16h4",
  keuangan: "M3 7h18v12H3zM3 11h18M7 15h3",
  event: "M4 6h16v14H4zM4 10h16M8 3v5M16 3v5",
  presale: "M6 8h12l-1 12H7zM9 8a3 3 0 0 1 6 0",
  online: "M3 4h3l2 11h11l2-8H7M10 20h.01M17 20h.01",
  penjualan: "M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6",
  produk: "M12 3l8 4v10l-8 4-8-4V7zM4 7l8 4 8-4M12 11v10",
  inventori: "M3 9l9-5 9 5v11H3zM8 20v-6h8v6",
  pelanggan: "M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M16 3a4 4 0 0 1 0 8M18 14a6 6 0 0 1 4 7",
  promosi: "M3 12l9-9h8v8l-9 9zM15 8h.01",
  pengaturan: "M7 3h10v18H7zM11 18h2",
  karyawan: "M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0",
  perangkat: "M7 3h10v18H7zM11 18h2",
  riwayat: "M12 7v5l3 3M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5",
};
const ikon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IKON[k] || ""}"/></svg>`;

function buka(t) {
  tab = t;
  const area = AREA_KARYAWAN.includes(t) ? "karyawan" : "penjualan";
  if (area === "penjualan") tabTerakhir = t;
  for (const b of $("#area").children) b.classList.toggle("on", b.dataset.area === area);
  $("#nav").innerHTML = tabs.filter(([k]) => AREA_KARYAWAN.includes(k) === (area === "karyawan"))
    .map(([k, n]) => `<button data-tab="${k}" class="${k === t ? "on" : ""}">${ikon(k)}${n}</button>`).join("");
  ({ dashboard: halDashboard, keuangan: halKeuangan, online: halOnline, pelanggan: halPelanggan, presale: halPresale, promosi: halPromosi, event: halEvent, laporan: halLaporan, penjualan: halPenjualan, pengaturan: halPengaturan, produk: halProduk, inventori: halInventori, karyawan: halKaryawan, perangkat: halPerangkat, riwayat: halRiwayat })[t]();
}

// ---------- Karyawan ----------

let subKaryawan = "daftar", filterRiwayat = "";
const jamWibD = (iso) => new Date(iso).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });

function halKaryawan(sub) {
  if (sub) subKaryawan = sub;
  (subKaryawan === "bertugas" ? halBertugas : halDaftarKaryawan)();
}
const kepalaKaryawan = (tombol = "") => `<div class="head"><div><h1>Karyawan</h1></div>${tombol}</div>${subtabs([["daftar", "Daftar Karyawan"], ["bertugas", "Bertugas Hari Ini"]], subKaryawan)}`;

async function halDaftarKaryawan() {
  $("#isi").innerHTML = '<main><p class="muted">Memuat…</p></main>';
  const owner = saya.role.includes("owner");
  const [{ karyawan }, rw] = await Promise.all([api("GET", "/api/karyawan"), api("GET", `/api/riwayat-masuk?tempat=pos${filterRiwayat ? "&staff=" + filterRiwayat : ""}`)]);
  const salah = (a) => a === "PIN salah" || a === "Password salah";
  $("#isi").innerHTML = `<main>${kepalaKaryawan(owner ? '<button class="btn primary" id="tambahK">+ Karyawan</button>' : "")}
    <div class="muted small" style="margin-bottom:8px">${karyawan.filter((k) => k.aktif).length} aktif${owner ? "" : " · Admin hanya melihat. Perubahan akun dilakukan Owner."}</div>
    <div class="tablewrap"><table><thead><tr><th>Nama</th><th>Role</th><th>Email dashboard</th><th>Status akun</th><th>Bertugas di</th><th>Terakhir di POS</th><th></th></tr></thead><tbody>
    ${karyawan.map((k) => `<tr>
      <td><b>${esc(k.nama)}</b><div class="small muted">${esc(k.telp) || ""}</div></td>
      <td>${k.role.map((r) => `<span class="tag ${r}">${NAMA_ROLE[r]}</span>`).join("")}</td>
      <td>${esc(k.email) || '<span class="muted">POS saja</span>'}</td>
      <td>${k.aktif ? '<span class="tag aktif">Aktif</span>' : '<span class="tag off">Nonaktif</span>'}
        ${k.password_sementara === null ? "" : k.password_sementara ? '<span class="tag warn">Password sementara</span>' : '<span class="tag">Password sudah diganti</span>'}
        ${k.pin_sementara ? '<span class="tag warn">PIN sementara</span>' : '<span class="tag">PIN sudah diganti</span>'}</td>
      <td class="small">${k.bertugas.map(esc).join(", ") || '<span class="muted">—</span>'}</td>
      <td class="small">${k.terakhir_pos ? waktu(k.terakhir_pos) : '<span class="muted">Belum pernah</span>'}</td>
      <td>${owner ? `<button class="btn small" data-ubah="${k.id}">Ubah</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="head" style="margin-top:24px"><h2 style="margin:0">Riwayat Masuk POS ${rw.salah_hari_ini ? `<span class="tag off">${rw.salah_hari_ini} PIN salah hari ini</span>` : ""}</h2>
      <select id="filterRiwayat" style="width:auto;min-width:220px"><option value="">Semua karyawan</option>${karyawan.map((k) => `<option value="${k.id}" ${k.id === filterRiwayat ? "selected" : ""}>${esc(k.nama)}</option>`).join("")}</select></div>
    <div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Karyawan</th><th>Aktivitas</th><th>Tempat</th><th>Perangkat</th></tr></thead><tbody>
    ${rw.riwayat.map((l) => `<tr><td>${waktu(l.waktu)}</td><td>${esc(l.nama) || "—"}</td><td>${salah(l.aksi) ? `<span class="tag off">${esc(l.aksi)}</span>` : esc(l.aksi)}</td>
      <td>${esc(l.keterangan ?? "")}</td><td>${esc(l.perangkat ?? "—")}</td></tr>`).join("") || '<tr><td colspan="5" class="muted">Belum ada.</td></tr>'}
    </tbody></table></div></main>`;
  pasangSubtabs(halKaryawan);
  $("#filterRiwayat").onchange = (e) => { filterRiwayat = e.target.value; halDaftarKaryawan(); };
  if ($("#tambahK")) $("#tambahK").onclick = () => formKaryawan(null);
  $("#isi").querySelectorAll("[data-ubah]").forEach((b) => (b.onclick = () => formKaryawan(karyawan.find((k) => k.id === b.dataset.ubah))));
}

async function halBertugas() {
  $("#isi").innerHTML = '<main><p class="muted">Memuat…</p></main>';
  const { kartu, ringkasan: r } = await api("GET", "/api/karyawan/bertugas");
  const WARNA = { buka: "aktif", gabung: "aktif", masuk: "", keluar: "", belum: "off" };
  $("#isi").innerHTML = `<main>${kepalaKaryawan()}
    <div class="kpis"><div class="kpi"><span class="muted small">Lokasi aktif</span><b>${r.lokasi}</b></div><div class="kpi"><span class="muted small">Laci terbuka</span><b>${r.laci}</b></div>
      <div class="kpi"><span class="muted small">Ditugaskan, belum masuk POS</span><b style="${r.belum_masuk ? "color:var(--danger-text)" : ""}">${r.belum_masuk}</b></div>
      <div class="kpi"><span class="muted small">Ditugaskan di dua event sekaligus</span><b>${r.ganda.length}</b>${r.ganda.length ? `<span class="small muted">${r.ganda.map(esc).join(", ")}</span>` : ""}</div></div>
    <div class="grafik-grid">${kartu.map((k) => `<div class="card"><div class="head" style="margin:0 0 8px"><h2 style="margin:0">${esc(k.nama)}</h2>${k.jenis === "event" ? `<a href="#" data-ev="${k.id}">Detail event</a>` : ""}</div>
      ${k.jenis === "event" ? `<div class="small muted">Penanggung jawab: ${esc(k.pj ?? "—")}</div>` : '<div class="small muted">Tidak punya petugas tetap.</div>'}
      ${k.laci.map((l) => `<div class="ok small">Laci terbuka · ${esc(l.kasir)} sejak ${jamWibD(l.buka)} · ${l.transaksi} transaksi · ${rp(l.penjualan)}</div>`).join("") || '<div class="small muted" style="margin-top:8px">Belum ada laci terbuka.</div>'}
      <table style="margin-top:8px">${k.orang.map((o) => `<tr><td>${esc(o.nama)}${o.ditugaskan ? "" : ' <span class="small muted">(tidak ditugaskan)</span>'}</td>
        <td><span class="tag ${WARNA[o.status]}">${esc(o.status === "buka" ? "Membuka kasir" : o.teks)}</span>${o.waktu ? ` <span class="small muted">${jamWibD(o.waktu)}</span>` : ""}</td></tr>`).join("") || '<tr><td class="muted small">Belum ada yang memakai POS di sini hari ini.</td></tr>'}</table></div>`).join("")}</div></main>`;
  pasangSubtabs(halKaryawan);
  $("#isi").querySelectorAll("[data-ev]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); buka("event"); detailEvent(a.dataset.ev); }));
}

function formKaryawan(k) {
  const baru = !k;
  $("#isi").innerHTML = `<div class="form">
    <button class="back" id="kembali">← Kembali</button>
    <h1>${baru ? "Tambah karyawan" : "Ubah karyawan"}</h1>
    <form class="card" id="fK" style="margin-top:12px">
      <div class="grid2">
        <div><label>Nama</label><input type="text" name="nama" value="${esc(k?.nama)}" required></div>
        <div><label>No HP</label><input type="tel" name="telp" value="${esc(k?.telp)}"></div>
      </div>
      <label>Role</label>
      <div class="checks">${["owner", "admin", "kasir"].map((r) => `<label><input type="checkbox" name="role" value="${r}" ${k?.role.includes(r) ? "checked" : ""}> ${NAMA_ROLE[r]}</label>`).join("")}</div>
      <p class="small muted">Owner dan Admin masuk dashboard dengan email dan password. Semua karyawan masuk POS dengan PIN 6 angka.</p>
      <label>Email</label><input type="email" name="email" value="${esc(k?.email)}">
      <p class="small muted">Wajib untuk Owner dan Admin. Kosongkan untuk Kasir.</p>
      ${baru ? `<div class="grid2">
        <div><label>Password sementara</label><input type="text" name="password" autocomplete="off" placeholder="Kosongkan untuk dibuatkan otomatis"></div>
        <div><label>PIN sementara</label><input type="text" name="pin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Kosongkan untuk dibuatkan otomatis"></div>
      </div><p class="small muted">Karyawan wajib mengganti keduanya saat pertama masuk.</p>`
      : `<label class="checks" style="margin-top:18px"><label><input type="checkbox" name="aktif" ${k.aktif ? "checked" : ""}> Akun aktif</label></label>`}
      <div class="err" hidden></div>
      <div class="actions">
        <button class="btn primary">Simpan</button>
        <button type="button" class="btn" id="batal">Batal</button>
        ${baru ? "" : `<span style="flex:1"></span>
          ${k.email ? '<button type="button" class="btn" id="resetPw">Reset password</button>' : ""}
          <button type="button" class="btn" id="resetPin">Reset PIN</button>`}
      </div>
    </form></div>`;
  $("#kembali").onclick = $("#batal").onclick = halKaryawan;
  const f = $("#fK");
  formKirim(f, async (d) => {
    const body = { nama: d.nama, telp: d.telp, email: d.email, role: [...f.querySelectorAll("[name=role]:checked")].map((c) => c.value) };
    if (baru) {
      if (d.password) body.password = d.password;
      if (d.pin) body.pin = d.pin;
      const r = await api("POST", "/api/karyawan", body);
      await halKaryawan();
      popupSementara(d.nama, r.password_sementara, r.pin_sementara);
    } else {
      body.aktif = f.aktif.checked;
      const r = await api("PATCH", "/api/karyawan/" + k.id, body);
      await halKaryawan();
      if (r.password_sementara) popupSementara(d.nama, r.password_sementara, null);
    }
  });
  if (!baru) {
    const reset = (jenis) => async () => {
      if (!confirm(`Reset ${jenis === "password" ? "password" : "PIN"} ${k.nama}? Yang lama langsung tidak berlaku.`)) return;
      const r = await api("POST", `/api/karyawan/${k.id}/reset-${jenis}`, {});
      popupSementara(k.nama, r.password_sementara ?? null, r.pin_sementara ?? null);
    };
    if ($("#resetPw")) $("#resetPw").onclick = reset("password");
    $("#resetPin").onclick = reset("pin");
  }
}

function popupSementara(nama, pw, pin) {
  popup(`<h2>Catat untuk ${esc(nama)}</h2>
    <p class="muted">Ini hanya ditampilkan sekali. Berikan langsung ke karyawan. Mereka wajib menggantinya saat pertama masuk.</p>
    ${pw ? `<p>Password sementara: <span class="cred">${esc(pw)}</span></p>` : ""}
    ${pin ? `<p>PIN sementara: <span class="cred">${esc(pin)}</span></p>` : ""}`);
}

// ---------- Perangkat ----------

const STATUS_HP = {
  aktif: '<span class="tag aktif">Aktif</span>',
  menunggu: '<span class="tag warn">Menunggu kode diketik</span>',
  kode_kadaluarsa: '<span class="tag warn">Kode kedaluwarsa</span>',
  nonaktif: '<span class="tag off">Nonaktif</span>',
};

async function halPerangkat() {
  $("#isi").innerHTML = '<main><p class="muted">Memuat…</p></main>';
  const { perangkat } = await api("GET", "/api/perangkat");
  const owner = saya.role.includes("owner");
  $("#isi").innerHTML = `<main>
    <div class="head"><div><h1>Perangkat POS</h1><div class="muted">HP kasir yang boleh membuka POS</div></div>
    <button class="btn primary" id="tambahHp">+ Daftarkan HP</button></div>
    <div class="tablewrap"><table><thead><tr><th>Kode</th><th>Nama</th><th>Status</th><th>Terakhir dipakai</th><th>Didaftarkan</th><th></th></tr></thead><tbody>
    ${perangkat.length ? perangkat.map((p) => `<tr>
      <td><b>${esc(p.kode)}</b></td><td>${esc(p.nama)}</td><td>${STATUS_HP[p.status]}</td>
      <td>${waktu(p.terakhir_dipakai)}</td><td>${waktu(p.dibuat_pada)}<div class="small muted">${esc(p.dibuat_oleh)}</div></td>
      <td>${p.status === "menunggu" || p.status === "kode_kadaluarsa" ? `<button class="btn small" data-kode="${p.id}">Kode baru</button>` : ""}
        ${owner && p.status !== "nonaktif" ? `<button class="btn small danger" data-off="${p.id}" data-nama="${esc(p.kode + " " + p.nama)}">Nonaktifkan</button>` : ""}</td></tr>`).join("")
      : '<tr><td colspan="6" class="muted">Belum ada HP terdaftar.</td></tr>'}
    </tbody></table></div></main>`;
  $("#tambahHp").onclick = formPerangkat;
  $("#isi").querySelectorAll("[data-kode]").forEach((b) => (b.onclick = async () => popupKode(await api("POST", `/api/perangkat/${b.dataset.kode}/kode-baru`, {}))));
  $("#isi").querySelectorAll("[data-off]").forEach((b) => (b.onclick = async () => {
    if (!confirm(`Nonaktifkan ${b.dataset.nama}? HP ini langsung keluar dan tidak bisa membuka POS lagi.`)) return;
    await api("POST", `/api/perangkat/${b.dataset.off}/nonaktifkan`, {});
    halPerangkat();
  }));
}

function formPerangkat() {
  $("#isi").innerHTML = `<div class="form">
    <button class="back" id="kembali">← Kembali</button>
    <h1>Daftarkan HP</h1>
    <form class="card" id="fHp" style="margin-top:12px">
      <label>Nama HP</label><input type="text" name="nama" placeholder="Misalnya: HP Booth 1 (Samsung A15)" required>
      <div class="err" hidden></div>
      <div class="actions"><button class="btn primary">Buat kode</button><button type="button" class="btn" id="batal">Batal</button></div>
    </form></div>`;
  $("#kembali").onclick = $("#batal").onclick = halPerangkat;
  formKirim($("#fHp"), async (d) => {
    const r = await api("POST", "/api/perangkat", d);
    await halPerangkat();
    popupKode(r);
  });
}

function popupKode(r) {
  const posUrl = location.origin + "/pos";
  popup(`<h2>Kode untuk HP ${esc(r.kode)}</h2>
    <ol style="padding-left:18px;margin:0">
      <li>Di HP kasir, buka <b>${esc(posUrl)}</b></li>
      <li>Ketik kode ini:</li>
    </ol>
    <div class="kode">${esc(r.kode_daftar.slice(0, 4))}-${esc(r.kode_daftar.slice(4))}</div>
    <p class="small muted">Berlaku sampai ${new Date(r.berlaku_sampai).toLocaleTimeString("id-ID", { timeStyle: "short" })} (10 menit) dan hanya bisa dipakai sekali.</p>`);
  $("#tutupPopup").addEventListener("click", halPerangkat);
}

// ---------- Riwayat masuk ----------

async function halRiwayat() {
  $("#isi").innerHTML = '<main><p class="muted">Memuat…</p></main>';
  const { riwayat } = await api("GET", "/api/riwayat-masuk");
  const salah = (a) => a === "PIN salah" || a === "Password salah";
  $("#isi").innerHTML = `<main>
    <div class="head"><div><h1>Riwayat Masuk</h1><div class="muted">200 catatan terakhir</div></div></div>
    <div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Nama</th><th>Aksi</th><th>Tempat</th><th>Keterangan</th><th>IP</th></tr></thead><tbody>
    ${riwayat.map((l) => `<tr><td>${waktu(l.waktu)}</td><td>${esc(l.nama) || "—"}</td>
      <td>${salah(l.aksi) ? `<span class="tag off">${esc(l.aksi)}</span>` : esc(l.aksi)}</td>
      <td>${l.tempat === "pos" ? "POS" + (l.perangkat ? " · " + esc(l.perangkat) : "") : "Dashboard"}</td>
      <td>${esc(l.keterangan)}</td><td class="small muted">${esc(l.ip)}</td></tr>`).join("")}
    </tbody></table></div></main>`;
}

// ---------- Mulai ----------

(async () => {
  try {
    const s = await fetch("/api/saya", { credentials: "same-origin" });
    if (s.ok) return mulai((await s.json()).staff);
    const { perlu } = await (await fetch("/api/setup")).json();
    tampil(perlu ? "layarSetup" : "layarMasuk");
  } catch {
    document.body.innerHTML = '<div class="center"><div class="card">Server tidak bisa dihubungi. Coba muat ulang.</div></div>';
  }
})();
</script>
</body>
</html>
